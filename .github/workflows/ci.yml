name: CI

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: typecheck / lint / build / test / template
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npx vitest run
      - name: Validate CloudFormation template structure
        run: |
          set -euo pipefail
          node --check scripts/deploy.mjs
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import YAML from 'yaml';

          for (const templatePath of [
            'infra/cloudformation/stack.yaml',
            'infra/cloudformation/github-actions-deployment.yaml',
          ]) {
            const document = YAML.parseDocument(fs.readFileSync(templatePath, 'utf8'));
            if (document.errors.length > 0) {
              throw new Error(`${templatePath}: ${document.errors.join('\n')}`);
            }
            const template = document.toJS();
            if (!template?.AWSTemplateFormatVersion) {
              throw new Error(`${templatePath}: missing AWSTemplateFormatVersion`);
            }
            if (!template.Resources || Object.keys(template.Resources).length === 0) {
              throw new Error(`${templatePath}: missing Resources`);
            }
            console.log(`${templatePath}: ${Object.keys(template.Resources).length} resources`);
          }
          JS
