name: Promote to production

on:
  workflow_dispatch:
    inputs:
      artifact_sha256:
        description: SHA-256 of the artifact currently deployed in development
        required: true
        type: string
      confirm:
        description: Type PROMOTE to confirm production promotion
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-aws
  cancel-in-progress: false

jobs:
  promote-prod:
    name: Promote exact artifact to production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      DEPLOYMENT_ENV: production
      AWS_REGION: us-east-1
      STACK_NAME: recap-agent-runtime
    steps:
      - name: Validate source branch and confirmation
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main" || {
            echo "Production promotion must run from refs/heads/main, got ${GITHUB_REF}." >&2
            exit 1
          }
          test "${{ inputs.confirm }}" = "PROMOTE" || {
            echo "Refusing promotion: confirm must be exactly PROMOTE." >&2
            exit 1
          }
          printf '%s' "${{ inputs.artifact_sha256 }}" | grep -Eq '^[0-9a-fA-F]{64}$' || {
            echo "Refusing promotion: artifact_sha256 must be a 64-character hexadecimal digest." >&2
            exit 1
          }
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          role-session-name: recap-prod-${{ github.run_id }}
          aws-region: us-east-1
          allowed-account-ids: '684516060775'
      - name: Bridge repository-required AWS profile
        run: |
          set -euo pipefail
          mkdir -p ~/.aws
          printf '[profile se-dev]\nregion = us-east-1\n' >> ~/.aws/config
          echo "AWS_PROFILE=se-dev" >> "$GITHUB_ENV"
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Install deployment dependencies
        run: npm ci
      - name: Download and verify exact development artifact
        id: artifact
        env:
          ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
        run: |
          set -euo pipefail
          test -n "${ARTIFACT_BUCKET:?production ARTIFACT_BUCKET variable must be set}"
          sha="$(printf '%s' '${{ inputs.artifact_sha256 }}' | tr 'A-F' 'a-f')"
          artifact_path=".artifacts/deployment/lambda-${sha}.zip"
          mkdir -p .artifacts/deployment
          aws s3 cp "s3://${ARTIFACT_BUCKET}/lambda/${sha}.zip" "${artifact_path}" --no-progress
          actual_sha="$(sha256sum "${artifact_path}" | cut -d' ' -f1)"
          test "${actual_sha}" = "${sha}" || {
            echo "Artifact digest mismatch: expected ${sha}, got ${actual_sha}." >&2
            exit 1
          }
          unzip -t "${artifact_path}" >/dev/null
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "path=${artifact_path}" >> "$GITHUB_OUTPUT"
      - name: Promote without rebuilding or re-uploading
        env:
          ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
          CLOUDFORMATION_EXECUTION_ROLE_ARN: ${{ vars.CLOUDFORMATION_EXECUTION_ROLE_ARN }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFORMATION_EXECUTION_ROLE_ARN:?production CLOUDFORMATION_EXECUTION_ROLE_ARN variable must be set}"
          DEPLOY_ARTIFACT_PATH="${{ steps.artifact.outputs.path }}" \
          DEPLOY_ARTIFACT_SHA256="${{ steps.artifact.outputs.sha }}" \
          DEPLOY_ARTIFACT_S3_KEY="lambda/${{ steps.artifact.outputs.sha }}.zip" \
            npm run deploy
      - name: Record promoted artifact
        run: |
          {
            echo "### Production promotion"
            echo "- Source commit: \`${GITHUB_SHA}\`"
            echo "- Artifact: \`lambda/${{ steps.artifact.outputs.sha }}.zip\`"
            echo "- Stack: \`recap-agent-runtime\`"
          } >> "$GITHUB_STEP_SUMMARY"
