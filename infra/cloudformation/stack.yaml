AWSTemplateFormatVersion: '2010-09-09'
Description: recap-agent serverless runtime

Parameters:
  DeploymentEnvironment:
    Type: String
    AllowedValues:
      - development
      - production
    Description: Explicit deployment target. The deployment script must always provide this value.
  FunctionName:
    Type: String
    Description: Lambda function name. Development and production names must remain distinct.
  CodeS3Bucket:
    Type: String
    Description: S3 bucket containing the zipped Lambda artifact.
  CodeS3Key:
    Type: String
    Description: S3 key containing the zipped Lambda artifact.
  OpenAISecretArn:
    Type: String
    Description: ARN of the Secrets Manager secret containing the OpenAI API key.
  SeApiSecretArn:
    Type: String
    Description: ARN of the Secrets Manager secret containing the Sin Envolturas Agent API key.
  ChannelApiSecretArn:
    Type: String
    Description: ARN of the Secrets Manager secret containing the inbound channel API key.
  OpenAIModel:
    Type: String
    Default: gpt-5.6-luna
  OpenAIExtractorModel:
    Type: String
    Default: gpt-5.6-luna
  OpenAIResponseClassifierModel:
    Type: String
    Default: gpt-5.6-luna
  OpenAIResponseClassifierTimeoutMs:
    Type: Number
    Default: 16000
    MinValue: 1000
    MaxValue: 60000
  OpenAIExtractorTimeoutMs:
    Type: Number
    Default: 35000
    MinValue: 1000
    MaxValue: 60000
  OpenAIReplyTimeoutMs:
    Type: Number
    Default: 22000
    MinValue: 1000
    MaxValue: 60000
  OpenAIRetrievalTimeoutMs:
    Type: Number
    Default: 8000
    MinValue: 1000
    MaxValue: 60000
  ResponseClassifierMode:
    Type: String
    Default: enforce
    AllowedValues:
      - observe
      - enforce
  SinEnvolturasBaseUrl:
    Type: String
    Default: https://api.sinenvolturas.com/api-web/vendor
  SinEnvolturasGuestServiceBaseUrl:
    Type: String
    Default: https://api.sinenvolturas.com/api/guest-service
  SinEnvolturasUserAuthBaseUrl:
    Type: String
    Default: https://api.sinenvolturas.com/api-web/user
  AgentApiBaseUrl:
    Type: String
    Default: https://api.sinenvolturas.com/api/agent
  AgentApiTimeoutMs:
    Type: Number
    Default: 5000
    MinValue: 250
    MaxValue: 30000
  AgentApiMaxRetries:
    Type: Number
    Default: 2
    MinValue: 0
    MaxValue: 5
  AgentMessageLoggingEnabled:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Allow POST writes to the Agent API messages endpoint.
  ProviderSearchMode:
    Type: String
    Default: hybrid
    AllowedValues:
      - api
      - vector
      - hybrid
  ProviderVectorStoreName:
    Type: String
    Default: Sin Envolturas Provider Search
  ProviderVectorStoreId:
    Type: String
    Default: ''
    Description: OpenAI vector store ID for provider semantic search.
  ProviderVectorMaxResults:
    Type: Number
    Default: 12
    MinValue: 1
    MaxValue: 50
  ProviderVectorScoreThreshold:
    Type: Number
    Default: 0.2
    MinValue: 0
    MaxValue: 1
  PerfRetentionDays:
    Type: Number
    Default: 30
    MinValue: 1
    MaxValue: 365
  PerfCaptureAssistantPreview:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Store redacted assistant-message previews in perf traces for feedback validation.
  LogRetentionDays:
    Type: Number
    Default: 7
    AllowedValues:
      - 1
      - 3
      - 5
      - 7
      - 14
      - 30
      - 60
      - 90
    Description: Number of days to retain runtime CloudWatch logs.
  KbEnabled:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
  KbVectorStoreId:
    Type: String
    Default: ''
    Description: OpenAI vector store ID for first-class knowledge retrieval.
  KbMaxResults:
    Type: Number
    Default: 6
    MinValue: 1
    MaxValue: 50
  KbScoreThreshold:
    Type: Number
    Default: 0
    MinValue: 0
    MaxValue: 1
  AgentFeatureProviderPlanning:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
  AgentFeatureProviderSearch:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
  AgentFeatureProviderQuoteRequests:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
  AgentFeatureFaq:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
  AgentFeatureInvitedEventLookup:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
  AgentFeaturePurchaseInformation:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
  AgentFeatureRsvp:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'

Rules:
  EnvironmentFunctionIsolation:
    Assertions:
      - AssertDescription: Development must not target the production runtime function.
        Assert: !Not
          - !And
            - !Equals [!Ref DeploymentEnvironment, development]
            - !Equals [!Ref FunctionName, recap-agent-runtime]
      - AssertDescription: Production must not target the development runtime function.
        Assert: !Not
          - !And
            - !Equals [!Ref DeploymentEnvironment, production]
            - !Equals [!Ref FunctionName, recap-agent-runtime-dev]

Conditions:
  IsDevelopment: !Equals [!Ref DeploymentEnvironment, development]

Resources:
  RuntimeLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub '/aws/lambda/${FunctionName}'
      RetentionInDays: !Ref LogRetentionDays

  PlansTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TableName: !Sub '${FunctionName}-plans'

  PerfTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: gsi1pk
          AttributeType: S
        - AttributeName: gsi1sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: channel-user-turns
          KeySchema:
            - AttributeName: gsi1pk
              KeyType: HASH
            - AttributeName: gsi1sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        Enabled: true
        AttributeName: ttl_epoch_seconds
      TableName: !Sub '${FunctionName}-perf'

  # S1 development-only durable fixture history. String pk/sk keys,
  # on-demand billing, TTL attribute ttl. The existing PlansTable has no TTL
  # and its Lambda permission lacks Query, so it is never repurposed for
  # fixture state. Production receives neither this table nor fixture
  # permissions/configuration (see Condition, scoped policy, and
  # EVAL_FIXTURE_TABLE_NAME below).
  EvalFixtureTable:
    Type: AWS::DynamoDB::Table
    Condition: IsDevelopment
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        Enabled: true
        AttributeName: ttl
      TableName: !Sub '${FunctionName}-eval-fixtures'

  RuntimeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: recap-agent-dynamo
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:DeleteItem
                Resource: !GetAtt PlansTable.Arn
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                Resource: !GetAtt PerfTable.Arn
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Ref OpenAISecretArn
                  - !Ref SeApiSecretArn
                  - !Ref ChannelApiSecretArn

  # S1 development-only fixture access, scoped to the EvalFixtureTable only.
  # GetItem/PutItem/Query/UpdateItem cover consistent reads, conditional
  # inserts, paginated queries, and atomic per-scope counters. Production
  # receives neither this policy nor the table (Condition: IsDevelopment).
  # Local evaluation principal setup: the se-dev profile in us-east-1
  # (account 684516060775) used by the eval harness needs matching
  # dynamodb rights on the development table; see docs/implementation-log.md.
  EvalFixtureTableAccess:
    Type: AWS::IAM::Policy
    Condition: IsDevelopment
    Properties:
      PolicyName: recap-agent-eval-fixture
      Roles:
        - !Ref RuntimeRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:Query
              - dynamodb:UpdateItem
            Resource: !GetAtt EvalFixtureTable.Arn

  # Packet B lease-fenced RSVP writes (saveFenced TransactWrite: Put +
  # TURN_LOCK ConditionCheck on the existing plans table). DynamoDB
  # TransactWriteItems requires per-operation permissions, so the role needs
  # both dynamodb:TransactWriteItems and dynamodb:ConditionCheckItem;
  # TransactWriteItems alone does not cover ConditionCheck. PutItem for the
  # transact Put is already granted by recap-agent-dynamo above. Scoped to the
  # plans table ARN only; item-level TURN_LOCK scoping stays in the runtime
  # ConditionExpression, not IAM. Development-only (Condition:
  # IsDevelopment) so production effective permissions are unchanged. No
  # second table, no TTL change.
  PlansTransactAccess:
    Type: AWS::IAM::Policy
    Condition: IsDevelopment
    Properties:
      PolicyName: recap-agent-plans-transact
      Roles:
        - !Ref RuntimeRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - dynamodb:TransactWriteItems
              - dynamodb:ConditionCheckItem
            Resource: !GetAtt PlansTable.Arn

  RuntimeFunction:
    Type: AWS::Lambda::Function
    DependsOn: RuntimeLogGroup
    Properties:
      FunctionName: !Ref FunctionName
      Handler: lambda/index.handler
      Runtime: nodejs24.x
      Timeout: 90
      MemorySize: 1024
      Role: !GetAtt RuntimeRole.Arn
      LoggingConfig:
        ApplicationLogLevel: INFO
        LogFormat: JSON
        LogGroup: !Ref RuntimeLogGroup
        SystemLogLevel: WARN
      Code:
        S3Bucket: !Ref CodeS3Bucket
        S3Key: !Ref CodeS3Key
      Environment:
        Variables:
          OPENAI_SECRET_ID: !Ref OpenAISecretArn
          SE_API_SECRET_ID: !Ref SeApiSecretArn
          CHANNEL_API_SECRET_ID: !Ref ChannelApiSecretArn
          DEPLOYMENT_ENV: !Ref DeploymentEnvironment
          OPENAI_MODEL: !Ref OpenAIModel
          OPENAI_EXTRACTOR_MODEL: !Ref OpenAIExtractorModel
          OPENAI_RESPONSE_CLASSIFIER_MODEL: !Ref OpenAIResponseClassifierModel
          OPENAI_RESPONSE_CLASSIFIER_TIMEOUT_MS: !Ref OpenAIResponseClassifierTimeoutMs
          OPENAI_EXTRACTOR_TIMEOUT_MS: !Ref OpenAIExtractorTimeoutMs
          OPENAI_REPLY_TIMEOUT_MS: !Ref OpenAIReplyTimeoutMs
          OPENAI_RETRIEVAL_TIMEOUT_MS: !Ref OpenAIRetrievalTimeoutMs
          RESPONSE_CLASSIFIER_MODE: !Ref ResponseClassifierMode
          PLANS_TABLE_NAME: !Ref PlansTable
          # S1 development-only fixture state. Resolves to the
          # EvalFixtureTable name in development and is removed entirely in
          # production (Fn::If + AWS::NoValue), so production receives
          # neither the table nor fixture configuration.
          EVAL_FIXTURE_TABLE_NAME: !If [IsDevelopment, !Ref EvalFixtureTable, !Ref 'AWS::NoValue']
          PERF_TABLE_NAME: !Ref PerfTable
          PERF_RETENTION_DAYS: !Ref PerfRetentionDays
          PERF_CAPTURE_ASSISTANT_PREVIEW: !Ref PerfCaptureAssistantPreview
          PROMPTS_DIR: /var/task/prompts
          SINENVOLTURAS_BASE_URL: !Ref SinEnvolturasBaseUrl
          SINENVOLTURAS_GUEST_SERVICE_BASE_URL: !Ref SinEnvolturasGuestServiceBaseUrl
          SINENVOLTURAS_USER_AUTH_BASE_URL: !Ref SinEnvolturasUserAuthBaseUrl
          AGENT_API_BASE_URL: !Ref AgentApiBaseUrl
          AGENT_API_TIMEOUT_MS: !Ref AgentApiTimeoutMs
          AGENT_API_MAX_RETRIES: !Ref AgentApiMaxRetries
          AGENT_MESSAGE_LOGGING_ENABLED: !Ref AgentMessageLoggingEnabled
          PROVIDER_SEARCH_MODE: !Ref ProviderSearchMode
          PROVIDER_VECTOR_STORE_NAME: !Ref ProviderVectorStoreName
          PROVIDER_VECTOR_STORE_ID: !Ref ProviderVectorStoreId
          PROVIDER_VECTOR_MAX_RESULTS: !Ref ProviderVectorMaxResults
          PROVIDER_VECTOR_SCORE_THRESHOLD: !Ref ProviderVectorScoreThreshold
          KB_ENABLED: !Ref KbEnabled
          KB_VECTOR_STORE_ID: !Ref KbVectorStoreId
          KB_MAX_RESULTS: !Ref KbMaxResults
          KB_SCORE_THRESHOLD: !Ref KbScoreThreshold
          AGENT_FEATURE_PROVIDER_PLANNING: !Ref AgentFeatureProviderPlanning
          AGENT_FEATURE_PROVIDER_SEARCH: !Ref AgentFeatureProviderSearch
          AGENT_FEATURE_PROVIDER_QUOTE_REQUESTS: !Ref AgentFeatureProviderQuoteRequests
          AGENT_FEATURE_FAQ: !Ref AgentFeatureFaq
          AGENT_FEATURE_INVITED_EVENT_LOOKUP: !Ref AgentFeatureInvitedEventLookup
          AGENT_FEATURE_PURCHASE_INFORMATION: !Ref AgentFeaturePurchaseInformation
          AGENT_FEATURE_RSVP: !Ref AgentFeatureRsvp

  RuntimeFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      AuthType: NONE
      TargetFunctionArn: !GetAtt RuntimeFunction.Arn
      Cors:
        AllowHeaders:
          - authorization
          - content-type
        AllowMethods:
          - POST
        AllowOrigins:
          - '*'
        ExposeHeaders:
          - www-authenticate

  RuntimeFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunctionUrl
      FunctionName: !Ref RuntimeFunction
      FunctionUrlAuthType: NONE
      Principal: '*'

  RuntimeFunctionInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref RuntimeFunction
      Principal: '*'
      InvokedViaFunctionUrl: true

Outputs:
  DeploymentEnvironment:
    Description: Deployment target used by the runtime.
    Value: !Ref DeploymentEnvironment
  FunctionUrl:
    Value: !GetAtt RuntimeFunctionUrl.FunctionUrl
  PlansTableName:
    Value: !Ref PlansTable
  PerfTableName:
    Value: !Ref PerfTable
  EvalFixtureTableName:
    Description: Development-only durable evaluation fixture history (absent in production).
    Condition: IsDevelopment
    Value: !Ref EvalFixtureTable
  RuntimeLogGroupName:
    Value: !Ref RuntimeLogGroup
  OpenAISecretArn:
    Value: !Ref OpenAISecretArn
  SeApiSecretArn:
    Value: !Ref SeApiSecretArn
  ChannelApiSecretArn:
    Value: !Ref ChannelApiSecretArn
