pre_mortem:
  overall_risk_level: medium
  critical_failure_modes:
    - scenario: Phone split is wrong for a supported country (extension vs national number), causing auth-by-phone to 404 for real users — silent permanent OTP fallback with no error surface.
      likelihood: medium
      impact: high
      mitigation: Persist the parseInternationalPhone split (countryCode/nationalNumber) at ingestion; unit-test the +51/+52/+1 COUNTRY_RULES matrix; live case asserts requestUserLoginCode is NOT called when phone auth succeeds.
    - scenario: auth-by-phone expires_in (epoch seconds, e.g. 1787843661) is misread as a duration. Dead extractTokenExpiry (sinenvolturas-gateway.ts:1060) already treats expires_in as duration — reusing it would produce year-2076 expiry and accept stale tokens.
      likelihood: medium
      impact: high
      mitigation: New gateway method converts epoch seconds -> ISO explicitly (value > 1e9 treated as epoch); unit test with 1787843661; hasValidUserAuthToken (Date.parse) compatibility asserted.
    - scenario: OTP/phone-auth race — user has an in-flight OTP (status code_requested) and a phone-auth attempt clobbers or is clobbered by that state.
      likelihood: medium
      impact: medium
      mitigation: "Hard guard: phone-first pre-step is skipped when plan.user_auth.status === 'code_requested'; unit test asserts state preservation."
    - scenario: Terminal channel has no sender phone (TERMINAL_CONTACT_PHONE unset, src/terminal/client.ts:132) — phone-first silently skipped locally, divergence between local validation and WhatsApp behavior.
      likelihood: high
      impact: low
      mitigation: Document the env in eval fixtures; live cases seed plan.contact_phone; fallback chain inbound.contactPhone -> plan.contact_phone -> externalUserId is reused, not reinvented.
    - scenario: Outbound logMessage POST on every reply adds latency/failure surface and doubles /messages write volume.
      likelihood: medium
      impact: medium
      mitigation: Logging stays behind AGENT_MESSAGE_LOGGING_ENABLED and Noop gateway; call sites treat logging failure as non-fatal (reply still sent); unit test asserts reply succeeds when logging fails.
    - scenario: RSVP intent mis-extraction (keyword matching is banned; extraction must come from LLM schemas) — phrases like "sí, ahí voy" misrouted.
      likelihood: medium
      impact: medium
      mitigation: New actionIntentValues entry + extractor prompt examples (Spanish); judged live cases for attending/declining; no regex-based routing permitted.
    - scenario: multiple_pending disambiguation loop — user never produces a valid selection.
      likelihood: low
      impact: medium
      mitigation: Mirror selection_candidates pattern with bounded retries and human-escalation fallback; typed already_responded/no_pending/phone_mismatch results end the loop deterministically.
    - scenario: 409 phone-linked-to-other-account from /user/update-phone treated as fatal and the freshly verified OTP token is discarded.
      likelihood: low
      impact: high
      mitigation: "Spec'd non-fatal: token stays valid, auth_method 'email' recorded, warning logged; unit test asserts token retained on 409."
  assumptions:
    - Agent API dual-auth = X-Agent-Key header on every call + Bearer user JWT on user-scoped reads, same as existing getOrders/getGiftPurchases.
    - resolveInformationAuthentication (agent-service.ts:1896) is the single auth gate for associated_event + purchase requests; phone-first plugs in there, not in the orchestrator.
    - Dev stack deploys via scripts/deploy.mjs which already accepts AGENT_API_BASE_URL (deploy.mjs:95); no CFN template change is required, only the parameter value.
    - Spanish is mandatory only in conversational prompts; all code/tests/docs in English.
