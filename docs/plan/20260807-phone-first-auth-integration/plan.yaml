plan_id: 20260807-phone-first-auth-integration
objective: >
  Integrate the SinEnvolturas Agent API endpoints into the WhatsApp conversational agent, headlined by
  PHONE-FIRST authentication: POST /auth-by-phone with the WhatsApp sender number before any email OTP,
  falling back to OTP only on 404 user_not_found, then persisting the phone via POST /user/update-phone
  after successful OTP so future sessions skip OTP. Also: switch associated_event reads to GET /user-events,
  greenfield POST /guest/rsvp conversational flow with disambiguation, and outbound message logging.
created_at: '2026-08-07T00:00:00Z'
created_by: gem-planner
status: pending
tldr: |
  12 tasks / 8 waves. Wave 1 builds foundations in parallel (Agent API gateway methods, core schema
  extensions, dev env check). Wave 2 wires phone-first auth into resolveInformationAuthentication,
  switches the orchestrator to /user-events, and rewrites Spanish prompts. Waves 3-4 serialize
  agent-service.ts work (RSVP greenfield node, then outbound logging). Wave 5 offline tests, wave 6
  dev Lambda redeploy (se-dev, AGENT_API_BASE_URL=https://se-v2-api-dev.jnq.io/api/agent), wave 7 live
  behavior regression cases + mandatory eval:behavior-live gate, wave 8 implementation-log/docs.

