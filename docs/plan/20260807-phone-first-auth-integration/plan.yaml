    title: Phone-first auth in resolveInformationAuthentication + update-phone after OTP
    description: >
      In src/runtime/agent-service.ts: (1) add a phone-first pre-step inside resolveInformationAuthentication
      (L1896) BEFORE the email path — resolve the sender phone via the existing chain (inbound.contactPhone
      -> plan.contact_phone -> externalUserId, cf. resolveEscalationPhone L2765), re-parse with
      parseInternationalPhone to obtain the {phone_extension, phone_number} split (prefer persisted split
