open_questions:
  - question: Does GET /user-events authorize purely via Bearer token, or does it also require a phone/email query param?
    context: Agent API is dual-auth (X-Agent-Key + user JWT). Existing getOrders/getGiftPurchases pass token only; assume /user-events matches.
    type: research
    affects: [T01-agent-gateway-methods, T05-orchestrator-user-events-switch]
  - question: "Exact response envelope fields for /auth-by-phone (beyond credentials.access_token + expires_in), /user/update-phone, /guest/rsvp (candidate fields: guest_id, event name/date) and the multiple_pending payload shape."
    context: Dev base URL https://se-v2-api-dev.jnq.io/api/agent is reachable; implementer probes dev API during T01 and encodes zod schemas from observed payloads.
    type: research
    affects: [T01-agent-gateway-methods, T07-rsvp-flow-greenfield]
  - question: After RSVP completes (or errors), which node does the conversation resume at?
    context: "Information flow uses information_state.resume_node. Default decision: mirror that pattern; RSVP sets resume to the node that was active when the RSVP intent was extracted."
    type: nice_to_know
    affects: [T07-rsvp-flow-greenfield]
  - question: Enable AGENT_MESSAGE_LOGGING_ENABLED=true on the dev stack to validate outbound logging end-to-end?
