decisions:
  - "Single-writer lock: at most one active task edits shared runtime files (agent-service.ts,
    openai-agent-runtime.ts, contracts.ts). Waves 3 through 8 serialize on those files; no parallel
    patches."
  - "Destructive-first behavior change (operator directive 2026-09-14): modifying model behavior
    must delete the old capability, typed dictionary, tool record, or instruction that teaches the
    undesired behavior BEFORE adding any new guidance. A later 'do not do X' appended after the
    thing that teaches X does not work. Models only do what they are told."
  - "Campaign-event assumption (operator directive 2026-09-14): the agent may assume the event
    under discussion ONLY from previous messages sent by a campaign (not the agent) that reference
    one specific event (RSVP confirmation/reminder campaigns). In all other multi-event situations
    it must ask which event, with event name and date."
  - "One state, three agents, tools differentiate (operator directive 2026-09-14): no hard RSVP
    state machine that forces lookups-instead-of-answers or actions-instead-of-answers. The same
    agent answers purchase, invitation, and RSVP questions; capabilities differ by available tools."
  - "Native image handling (operator directive 2026-09-14): images ride as native model context
    (ChatGPT-style: pixels attached, model reads and builds on top). No typed enumeration of image
    possibilities, no extractor over-reliance, no hand-held image paths. Assume model intelligence;
    subtract machinery, do not add it."
  - "L2 order: purchase family plus contact and quotation closure first (waves 3-4), then support
    and capability, RSVP, and clarification plus images plus auth (waves 5-7)."
  - Baseline 79/83 is never rescored. Evaluator changes require a separate reviewed change with both
    baseline and candidate rerun on the revised contract.
  - Every behavior-changing wave gets its own live-behavior-coverage.yaml entry with hard structural
    plus hard text_semantic requireJudge true, a deterministic offline twin, a development deploy
    (se-dev, us-east-1, STS 684516060775), and the full mandatory live suite. Contract and test-only
    changes run focused checks only.
  - Record production exception separately from strict gate status. No retroactive waiver,
    denominator change, judge relaxation, or conversion of a hard semantic failure into a pass.
  - Repeated wording does not by itself prove deterministic code origin. Trace model output,
    projected receipt evidence, and rendered output before fixing the false resend claim.
  - Pending work is a single dependency chain across shared runtime, evaluator and deployment state;
    wave labels are descriptive only. A downstream writer may start only after its predecessor hands
    off evidence and releases ownership.
  - The packet for each task is sufficient dispatch context; do not send the entire implementation
    log or conversation. Read acceptance-contract.md sections listed in that packet, and retrieve
    only the referenced evidence.
  - "Owner decision 2026-09-10: exactly three persistent owners: planning, faq (General
    information), customer_assistance (Customer assistance). Purchases, invitations, authentication
    and support are scoped capabilities within Customer assistance, not separate owners."
assumptions:
