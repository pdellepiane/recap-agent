      - Hard text_semantic with requireJudge true.
      - Offline twin for deterministic behavior.
      - Separate live-behavior-coverage entry per behavior change.
      - Replace the superseded human-handoff expectation for one +1; retain a distinct unsupported
        multi-companion case rather than deleting that safety boundary.
  - id: T7
    title: Independent review and regression gate
    wave: 4
    owner: reviewer
    status: completed
    depends_on: [T5, T6]
    acceptance:
      - Review selection truth table and disclosure projections.
      - Verify no scope expansion into payment verification, OCR, or unrelated planning behavior.
      - Typecheck, lint, full local tests, prompt audit, and coverage registry pass.
      - Blocking findings return implementation to revision; no deploy over a failed review.
  - id: T8
    title: Deploy once and run bounded then complete live gates
    wave: 5
    owner: primary
    status: pending
    depends_on: [T7]
    acceptance:
      - STS confirms account 684516060775 using se-dev in us-east-1.
      - Development Lambda deployed through the existing CloudFormation pipeline.
      - Run the seven new named cases first, fail closed.
      - Run the five RSVP +1 cases in the bounded gate before the complete suite.
      - Run the complete live_behavior_regression suite after the bounded gate passes.
      - Missing judge key, skipped case, evaluator error, or failed hard expectation fails the gate.
      - Record prompt bytes, deployment revision, sanitized fixture outcomes, and eval artifacts in docs/implementation-log.md.

orchestration:
  maximum_concurrent_workers: 2
  worker_model: gpt-5.6-luna
  child_agents_allowed: false
  rules:
    - Use workers only for disjoint bounded ownership.
    - Primary integrates and reviews cross-cutting state transitions.
    - Do not run two workers against the same runtime file.
    - Do not begin an implementation wave until its evidence/spec dependencies are complete.

acceptance_criteria:
  - >-
    Every reported case is mapped to one or more explicit evidence classes: partition parsing,
    absent endpoint data, model/runtime interpretation, FAQ coverage, or continuity/delivery.
  - New guest-order partitions, cart-only users, and mixed order/cart users are handled without legacy orders decisions.
  - No raw API response is included in any model input.
  - No currency, local timestamp, balance, approval, or receipt confirmation is inferred from missing fields.
  - The indexed 72-business-hour policy is combined only with a selected pending transfer, Yape,
    or Plin case. PayPal remains gated until its conflicting policy sources are resolved.
    Revision note (T7 review W1): faq_vector_store_audit.policy_conflict records the user decision
    selecting the indexed validation-window article as authoritative for this implementation,
    including its PayPal guidance; that resolution supersedes the PayPal gating clause above.
  - When currency is null, customer-facing output contains no currency symbol or denomination;
    a verified numeric amount may be paired with its verified payment method.
  - Offset-less timestamps never reach the model. UTC-to-America/Lima conversion is deterministic
    and enabled only after backend confirmation of the source storage convention.
  - Current and historical records are not conflated; unresolved ambiguity produces one bounded question.
  - Campaign-grounded follow-ups and support details do not reset or rename the channel user.
  - No duplicate-delivery, serialization, or plan-store redesign is implemented until trace
    correlation verifies the applicable continuity failure mode.
  - Existing RSVP, accountless-phone, OTP, COD, and purchase-detail behavior remains green.
  - A single explicit +1 no longer triggers default human takeover and is reported successful only
    when plus_one.saved is true.
  - A plus_one.saved false result remains a valid typed outcome and never becomes a success claim.
  - Multiple companions are not collapsed into the backend's single +1 representation.
  - Prompt/model context is smaller or any increase is explicitly justified by measured branch relevance.
  - One reviewed development deployment and all required live gates pass before completion is claimed.

explicit_non_goals:
  - Reading or validating payment receipt images.
  - Approving, rejecting, refunding, or mutating payments.
  - Inferring bank settlement from a user message.
  - Inventing missing backend fields or time-zone rules.
  - General provider-planning redesign.
  - General plan-store redesign without trace evidence connecting it to these failures.
  - Backward-compatible conversational decisions based on the legacy orders array.
  - General group, family, or household RSVP mutation beyond the documented single +1.
  - Inferring +1 eligibility before the backend returns a typed result.
