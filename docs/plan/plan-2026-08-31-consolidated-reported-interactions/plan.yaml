verified_evidence:
  repository:
    - >-
      The current GET /guest/orders parser accepts only data.orders. It does not consume
      data.completed_orders, data.pending_orders, or data.carts.
    - >-
      Raw Agent API payloads are intended to pass through Zod validation and typed mapping before
      information orchestration. This boundary must be preserved and strengthened.
    - >-
      Existing message context retains a bounded latest admin_campaign anchor, but campaign
      handling is specialized for RSVP. No verified typed purchase/cart campaign anchor exists.
    - >-
      Existing purchase types do not represent cart identity, partition provenance, balance due,
      transferred amount, currency confidence, time-zone confidence, or evidence provenance.
    - >-
      Existing information projection can expose multiple phone purchases to the reply model when
      a request does not resolve a single candidate.
    - >-
      The current RSVP runtime short-circuits every extracted rsvpParty.scope=self_and_others into
      request_human_takeover before event selection or POST /guest/rsvp. Existing deterministic and
      live regressions encode that now-superseded behavior.
  read_only_api_probes:
    contract:
      top_level_arrays: [orders, completed_orders, pending_orders, carts]
      legacy_orders_policy: >-
        orders remains for transport compatibility but must not drive new conversational decisions.
      completed_orders_semantics: approved_or_refunded
      pending_orders_semantics: pending_declined_error_or_null
      cart_fields_observed:
        - cart_id
        - created_at
        - event_date
        - event_id
        - event_name
        - event_url
        - gifts_quantity
        - items
        - status
        - subtotal
        - was_abandoned
      order_currency_observed: null
      gift_purchase_paid_at_observed: timestamp_without_offset
    sanitized_case_results:
      victor_suffix_171:
        pending_orders:
          - { event: Samuel Josue, amount: 80, status: pending, created_at: 2026-08-29 }
        completed_orders:
          - { event: Josue y Paola, amount: 88.18, status: approved, created_at: 2025-04-16 }
      claudia_luis_felipe_suffix_085:
        pending_orders:
          - { event: Claudia and Luis Felipe, amount: 1042.89, status: pending, method: Transferencia }
        currency: null
        paid_at: offset_missing
      alex_suffix_340:
        pending_orders:
          - { event: Luis Raul and Carmen del Rosario, amount: 250, status: pending, method: Yape_o_Plin }
        carts:
          - { event: Luis Raul and Carmen del Rosario, status: active }
      sonia_suffix_765:
        pending_orders: []
        completed_orders: []
        carts:
          - { event: Carlos and Adriana, status: abandoned }
      maria_jose_suffix_554:
        pending_orders:
          - { event: Isa and Lu, amount: 63.85, status: pending, method: Transferencia, created_at: 2026-08-28 }
          - { event: AMORCITOS_WEDDING, amount: 98.14, status: declined, method: Transferencia, created_at: 2023-11-11 }
        carts:
          - { event: Isa and Lu, status: active }
        currency: null
      luis_suffix_389:
        pending_orders:
          - { event: Alejandra, amount: 227.76, status: pending, method: Yape_o_Plin }
        carts:
          - { event: Alejandra, status: active }
        currency: null
  faq_vector_store_audit:
    audited_at: 2026-08-31
    mode: read_only
    configured_file_count: 79
    validation_window:
      source_present: true
      indexed: true
      top_result: atc_template_regalo_en_validacion_anfitriones
      supported_policy: >-
        Up to 72 business hours for the documented validation methods, including Yape, Plin,
        transfer, and the indexed PayPal variant.
      conclusion: >-
        The reported missing-window answers were not caused by absent FAQ knowledge. They were
        caused by failing to request or reconcile general FAQ policy with the selected pending
        order state.
      policy_conflict:
        stakeholder_statement: >-
          The validation window applies to methods other than card or PayPal.
        indexed_corpus: >-
          Transfer, Yape, and Plin are consistently covered; one indexed ATC variant also includes
          PayPal.
        status: resolved_for_this_implementation
        decision: >-
          The user selected the indexed article as authoritative for this implementation. Retrieve
          and project the indexed validation-window article for questions in this space, including
          its PayPal guidance, while keeping the order-specific payment method and state separate
          from the general policy evidence.
    payment_methods:
      source_present: true
      indexed: true
      restriction: >-
        Generic payment-method guidance cannot establish a specific order's currency, received
        amount, balance, settlement, or payment confirmation.
    transaction_code:
      source_present: true
      evidence: ATC templates use CODxxx placeholders.
      conclusion: COD recognition is a structured normalization concern, not a retrieval concern.
    rsvp_plus_one:
      direct_operational_contract_indexed: false
      generic_rsvp_management_article_indexed: true
      conclusion: >-
        Generic RSVP documentation is insufficient for a +1 mutation. The phone-scoped RSVP
        endpoint, selected guest_id, and typed saved result are authoritative.
    unavailable_as_faq_truth:
      - current_order_or_cart_state
      - received_amount
      - balance_due
      - purchase_currency_when_api_currency_is_null
      - backend_timestamp_timezone
      - payment_receipt_verification
      - current_payment_outage_or_processor_cause
      - plus_one_eligibility_for_a_specific_guest
  documented_rsvp_plus_one_contract:
    source: AGENT_ENDPOINTS_5_section_9
    endpoint: POST_guest_rsvp
    identity: trusted_phone_extension_and_phone_number
    request:
      action: optional_attending_or_declining
      guest_id: required_for_plus_one_and_for_multiple_pending_selection
      plus_one_response: optional_yes_or_no
      optional_plus_one_details:
        - plus_one_name
        - plus_one_email
        - plus_one_phone_no
        - plus_one_phone_ext
      minimum_decision: at_least_one_of_action_or_plus_one_response
    eligibility:
      - guest_has_couple_true
      - event_has_couple_confirmation_config
    outcomes:
      saved:
        http: 200
        evidence: plus_one.saved_true
      not_eligible:
        http: 200
        evidence: plus_one.saved_false_with_reason
      multiple_pending:
        http: 200
        evidence: code_multiple_pending_with_pending_guests
      forbidden_phone_guest_mismatch: 403
      no_guest_or_guest_id: 404
      invalid_request: 422
      unauthorized_agent_key: 401
    verified_limit: >-
      This contract represents one configured +1. It does not prove support for multiple named
      companions or a general group RSVP mutation.
  screenshot_only_evidence:
    - >-
      Outbound campaigns in the screenshots contain event-specific recovery or balance language.
      The screenshots do not prove that equivalent structured campaign metadata is available to
      the runtime.
    - >-
      User-supplied payment receipts show claimed transfers. A screenshot is not backend payment
      confirmation and must not be converted into approved status.
    - >-
      Maria Jose's campaign says USD 3.85 remains, while the orders endpoint only exposes a current
      pending total of 63.85 and an old declined purchase. The orders endpoint does not expose the
      received amount or balance due.
    - >-
      Luis's campaign says PEN 13.76 remains, while the endpoint exposes a pending order total and
      an active cart. The endpoint does not document a balance-due field.

unverified_hypotheses:
  - >-
    Generic restarts may come from empty plan state, an extraction transition, concurrent plan
    creation, or duplicate webhook delivery. Do not attribute them to the LLM until per-case traces
    identify the transition and plan/message identity.
  - >-
    The offset-less paid_at values may be stored as UTC. A system stakeholder reports that
    subtracting five hours matches the observed Lima time, but the backend contract does not yet
    confirm this. America/Lima is UTC-05:00, so converting a UTC timestamp to Lima subtracts five
    hours and may change the calendar date. Carry this as a provisional design assumption only;
    do not expose a converted time until the backend owner confirms the storage convention.
  - >-
    A pending order and same-event cart may represent one checkout lifecycle, but the relationship
    is not documented. Keep both records and reconcile only through verified IDs or explicitly
    documented rules.
  - >-
    A campaign body may correspond to a structured campaign record, but only the visible text is
    currently proven. Inspect the channel API/storage contract before designing the anchor source.

failure_taxonomy:
  order_partition_parsing_and_reconciliation:
    definition: >-
      The required evidence exists in completed_orders, pending_orders, or carts but is currently
      ignored, flattened, or shown alongside unrelated records.
    cases:
      - Kiara
      - Delia
      - Victor_Samuel_Josue
      - Alex
      - Sonia
      - Maria_Jose_Isa_and_Lu
      - Luis_Alejandra
      - Claudia_and_Luis_Felipe_partial
    fixed_by:
      - Parse the three new partitions independently.
      - Keep cart and order identities distinct.
      - Resolve one subject from campaign, event, order, cart, or explicit user evidence.
      - Project only the selected record and requested fields.
  endpoint_information_absent:
    definition: >-
      The agent cannot answer safely because no authoritative endpoint field supplies the fact.
    cases:
      - case: Maria_Jose_balance
        missing: [amount_received, balance_due, currency_for_each_operand]
      - case: Luis_Alejandra_balance
        missing: [amount_received, balance_due, currency_for_each_operand]
      - case: Claudia_and_Luis_Felipe_currency
        missing: [currency]
      - case: payment_local_time
        missing: [timestamp_offset_or_confirmed_storage_timezone]
      - case: receipt_validation
        missing: [backend_receipt_match_and_settlement_result]
      - case: card_rejection_or_outage_reason
        missing: [specific_processor_reason_or_service_health]
      - case: Martha_invitation
        missing: [phone_association_for_the_expected_invitation]
    behavior: >-
      State only existing facts. Keep missing facts unknown, avoid calculating or contradicting a
      campaign amount, and offer the approved next step when the fact is unavailable.
  llm_or_runtime_misinterpretation:
    definition: >-
      Sufficient evidence existed, but routing, reconciliation, selection, or response composition
      drew an unsupported conclusion or exposed contradictory evidence.
    cases:
      - { case: Cristian, error: no_pending_was_treated_as_no_invitation }
      - { case: Paolo_and_Mariana, error: resolved_event_was_followed_by_unrelated_candidate_list }
      - { case: current_vs_historical_purchase, error: unrelated_old_record_competed_with_grounded_current_record }
      - { case: customer_transaction_code, error: COD_prefixed_reference_was_not_normalized }
      - { case: currency_and_time_rendering, error: nullable_or_offsetless_fields_became_definitive_facts }
      - { case: repeated_generic_welcome, error: active_support_context_fell_through_to_onboarding }
  faq_knowledge_absent_or_not_sufficient:
    definition: >-
      A policy question cannot be answered from the indexed corpus, or retrieved policy is too
      generic to establish a user-specific fact.
    cases:
      - case: rsvp_plus_one_mutation
        status: operational_contract_not_in_faq
        authoritative_source: phone_scoped_rsvp_endpoint
      - case: exact_balance_or_received_amount
        status: not_a_faq_fact
        authoritative_source: future_typed_payment_reconciliation_fields
      - case: timestamp_storage_timezone
        status: not_documented_or_indexed
        authoritative_source: backend_contract
      - case: specific_card_failure_or_system_outage
        status: generic_alternatives_indexed_but_specific_cause_absent
        authoritative_source: processor_or_service_health_contract
    explicitly_not_missing:
      - validation_window_up_to_72_business_hours
      - generic_Yape_Plin_transfer_and_PayPal_validation_guidance
      - generic_payment_method_guidance
      - COD_placeholder_examples
  conversation_continuity_or_delivery:
    definition: >-
      The symptom is a restart, duplicate greeting, repeated answer, or loss of the active subject.
      Screenshots alone do not distinguish duplicated delivery, concurrent plan writes, missing
      recent-message context, or an incorrect state transition.
    current_cases:
      - Claudia_and_Luis_Felipe
      - Claudia_Roger_Baby_Shower_Catalina
      - Alex
      - Maria_Jose_Isa_and_Lu
      - Sonia
    verified_historical_evidence: >-
      A prior retained WhatsApp FAQ audit found ten native message identifiers processed twice,
      and some duplicate pairs produced different answers. This proves duplicate processing has
      occurred historically, but not that it caused the new screenshots.
    required_diagnosis: >-
      Correlate inbound message_id, conversation identity, Lambda request IDs, plan revision,
      classifier/extractor decisions, recent-message retrieval, outbound IDs, and conditional-write
      outcomes before selecting a fix.
    conditional_fixes:
      duplicate_delivery: idempotency_by_native_message_id
      concurrent_processing: per_conversation_serialization_or_revision_guard
      missing_context: typed_campaign_and_active_subject_anchor
      wrong_transition: continuity_state_machine_fix

