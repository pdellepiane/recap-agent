invariants:
  minimum_disclosure:
    - Never send a raw Agent API response or raw partition envelope to a model.
    - Validate each endpoint and partition independently.
    - Reconcile into typed canonical state before response composition.
    - Project only the selected subject and fields required by the current question.
    - Omit duplicate evidence and internal source payloads.
    - Measure serialized instruction and input bytes for every changed model call.
  evidence_safety:
    - Missing currency remains unknown; never infer PEN, soles, USD, or dollars from amount or country.
    - A payment method such as Yape, Plin, transfer, or PayPal does not prove currency.
    - >-
      When amount and payment method are verified but currency is null, render only the numeric
      amount and method, for example "monto 63.85 mediante transferencia". Do not add a currency
      symbol or denomination.
    - A timestamp without Z or numeric offset is unavailable for customer-facing date/time claims.
    - A user claim or receipt image is not equivalent to backend payment confirmation.
    - A system campaign may ground only fields that are present in a verified trusted campaign anchor.
    - A 404 means not associated with this phone/scope, never global nonexistence.
    - Do not calculate or state a balance unless all operands have the same explicit currency,
      verified order/event identity, and documented provenance.
  routing_safety:
    - No keyword or exact-string flow routing.
    - Use structured extraction and typed persisted state.
    - A support subject name must never overwrite the trusted channel user's identity.
    - Contextual corrections and requested support details must not restart planning or welcome flow.
    - Cart-only evidence is valid information coverage and must not become purchase not_found.
    - A supported single +1 request must not default to human takeover merely because party scope
      is self_and_others.
  selection_safety:
    - Partition provenance and payment_status are separate facts.
    - pending_orders does not imply payment_status=pending.
    - completed_orders does not imply payment_status=approved because refunded is also valid.
    - Recency alone cannot select a record.
    - Resolve automatically only from a unique typed identity or convergent evidence.
    - If multiple candidates remain plausible, ask one concise selection question.
    - If sources conflict for the same identity, mark coverage inconsistent and avoid a definitive claim.

target_design:
  phone_context_snapshot:
    description: >-
      One immutable per-turn canonical snapshot assembled outside the model from the minimum set of
      phone-scoped calls required by the structured request.
    shape:
      phone_identity: trusted_channel_only
      orders:
        pending_partition: typed_order_candidates
        completed_partition: typed_order_candidates
      carts: typed_cart_candidates
      detailed_gift_purchases: optional_typed_enrichment
      events: optional_typed_event_evidence
      campaign_anchor: optional_typed_trusted_outbound_context
      coverage: complete_or_partial_or_inconsistent
      failures: sanitized_typed_outcomes
  order_candidate:
    required:
      - backend_order_id
      - partition
      - payment_status
    optional:
      - customer_transaction_number
      - event_id
      - event_name
      - event_date
      - amount
      - currency
      - payment_method
      - created_at
    restrictions:
      - Preserve exact status separately from partition.
      - Do not attach a local time without verified offset.
  cart_candidate:
    required:
      - cart_id
      - status
      - was_abandoned
    optional:
      - event_id
      - event_name
      - event_date
      - subtotal
      - gifts_quantity
      - safe_item_summary
      - created_at
    restrictions:
      - Never coerce a cart into an order.
      - Never claim a cart payment exists.
  campaign_anchor:
    required:
      - source
      - campaign_type
      - sent_at
    optional:
      - event_id
      - event_name
      - backend_order_id
      - cart_id
      - amount_due
      - currency
      - recovery_url
    source_decision: >-
      First inspect whether the channel/conversation API supplies structured campaign metadata. If
      it does, validate that metadata. If it does not, propose a storage change at campaign-send
      time. Do not introduce body-keyword parsing as a substitute.
  datetime_projection:
    raw_input_policy: Never send an offset-less backend timestamp to the response model.
    provisional_source_assumption: UTC_pending_backend_confirmation
    target_display_zone: America_Lima_UTC_minus_05_00
    deterministic_boundary: >-
      Once the backend owner confirms that offset-less values are UTC, parse and convert them to
      America/Lima before model projection. UTC-to-Lima subtracts five hours and may change the
      calendar date. The model never performs the conversion.
    activation_gate: >-
      Until storage semantics are documented, omit the local date/time rather than presenting the
      raw value or guessing its zone.
  resolution_states:
    - resolved_single
    - needs_subject_selection
    - unavailable
    - inconsistent
  model_projection:
    description: >-
      A route-specific object containing resolution, coverage, one selected order/cart/event or a
      bounded candidate list, and only the requested safe fields. Raw endpoint objects, unused
      partitions, old unrelated records, payment identifiers, bank details, vouchers, and internal
      reconciliation traces remain absent.
  rsvp_plus_one:
    scope_boundary:
      representable:
        - guest_plus_one_only_yes_or_no
        - guest_own_rsvp_plus_one_yes_or_no
        - one_optional_plus_one_identity
      not_representable:
        - multiple_companions
        - group_or_household_mutation_beyond_one_plus_one
        - inferred_plus_one_decision_without_explicit_user_evidence
    typed_state:
      own_action: attending_or_declining_or_absent
      plus_one_response: yes_or_no_or_absent
      companion_count: zero_or_one_or_many_or_unknown
      guest_id: selected_backend_identifier_or_absent
      event_resolution: resolved_single_or_needs_event_selection_or_unavailable
      mutation_outcome: saved_or_not_eligible_or_invalid_or_forbidden_or_not_found_or_retryable_failure
    execution:
      - Preserve the existing structured party extractor's precision; do not introduce keyword routing.
      - Resolve one event and guest_id before any +1 mutation.
      - Send one combined request when both the guest decision and +1 decision are explicit.
      - Send a +1-only request when the guest decision is absent or already recorded.
      - Do not ask for name, email, or phone because those fields are optional unless a separately
        verified business rule later makes one necessary.
      - Render saved=true deterministically as success.
      - Render saved=false as an honest eligibility result using a sanitized reason; never claim saved.
      - Preserve selection state on ambiguous events and ask one bounded event question.
      - Reserve human takeover for an explicit human request or a genuine unsupported/failure path,
        not as the default for one representable +1.
    minimum_disclosure_projection:
      - selected_event_identity
      - guest_own_decision_when_present
      - plus_one_decision_when_present
      - sanitized_mutation_outcome
    excluded_from_model:
      - raw_rsvp_response
      - raw_pending_guests_envelope
      - trusted_phone
      - unused_companion_contact_fields
      - backend_or_authorization_diagnostics

request_policy:
  cart_or_checkout_question:
    primary: guest_orders_carts_partition
    answerable_from_cart_only: true
    must_not_do:
      - Return purchase not_found merely because no order exists.
      - Ask for email or OTP when the trusted phone cart is available.
  pending_or_current_payment_question:
    primary: guest_orders_pending_partition
    detail_call: guest_gift_purchases_only_if_requested_or_required
    selection: explicit_order_or_campaign_anchor_or_event_or_amount_then_single_candidate
  historical_completed_question:
    primary: guest_orders_completed_partition
  dedication_thanks_or_payment_detail:
    primary: guest_gift_purchases
  event_or_rsvp_question:
    primary: existing_phone_event_flow
    restriction: >-
      Preserve existing own-RSVP state behavior and extend only the documented single-plus-one
      mutation path after one guest_id is grounded.
  rsvp_plus_one_question:
    primary: phone_scoped_guest_rsvp
    event_resolution: existing_phone_event_flow
    human_takeover_policy: >-
      Do not call request_human_takeover for a single representable +1. Escalation remains possible
      for explicit human requests, multiple companions, or a failure whose approved recovery path
      genuinely requires support.
  call_deduplication:
    key: phone_resource_order_event_per_turn
    rule: Reuse partitioned orders and event-scoped purchases already present in the snapshot.

reported_case_matrix:
  already_covered_regressions_to_preserve:
    - case: Cristian
      expected: Phone event association prevents false no-invitation; RSVP state claimed only from enriched attendance.
    - case: Paolo_and_Mariana
      expected: A resolved RSVP exposes one event and never follows with a broad contradictory candidate list.
    - case: Kiara
      expected: Pending phone purchase is answerable without an OTP loop.
    - case: Joaquin
      expected: Detailed gift/dedication is selected by phone without requiring a registered account.
    - case: Martha
      expected: Accountless/cart or event evidence is used before asking for private account authentication.
    - case: Delia
      expected: Phone order status is selected deterministically and does not fall into legacy auth.
    - case: customer_transaction_code
      expected: COD-prefixed and numeric references normalize to the same customer transaction number.
    - case: existing_self_and_others_handoff_behavior
      current_behavior: All self_and_others requests are handed to a human before RSVP lookup.
      replacement_behavior:
        - One explicit +1 is handled through POST /guest/rsvp with selected guest_id.
        - Combined own and +1 decisions use one backend request.
        - Multiple companions remain outside the one-plus-one contract and are not silently truncated.
        - saved=false is reported as not saved, without a false success claim.
  new_or_consolidated_regressions:
    - case: Claudia_and_Luis_Felipe
      evidence: One pending transfer; currency null; paid_at has no offset.
      expected:
        - Explain up to 72 business hours from the indexed transfer-validation policy.
        - If amount and method are needed, say the numeric amount and transfer method without a currency.
        - Do not state a local payment time from the endpoint until the UTC storage assumption is confirmed.
        - Preserve the purchase thread across corrections; no generic restart.
    - case: Claudia_Roger_Baby_Shower_Catalina
      expected:
        - Treat Roger as the affected support subject, not the channel user.
        - Treat Baby Shower Catalina as support context, not a new planning request.
        - Do not repeat the full prior card explanation.
    - case: Victor_Samuel_Josue
      evidence: Current pending amount 80 and historical completed amount 88.18 are in distinct partitions.
      expected:
        - Select Samuel Josue when the current question or trusted anchor grounds it.
        - Do not expose or ask about the historical purchase unless it remains plausibly relevant.
    - case: Alex
      evidence: Same-event pending order and active cart.
      expected:
        - A payment/checkout continuation stays in information flow.
        - No repeated generic introduction.
        - Select the cart or order according to the structured question; do not flatten them.
    - case: Sonia
      evidence: Cart-only abandoned checkout for Carlos and Adriana.
      expected:
        - Recognize the cart as phone-scoped coverage.
        - Explain that transfer can be selected through the existing recovery path only if that path is present in trusted context.
        - Never answer purchase not_found solely because orders are empty.
    - case: Maria_Jose_Isa_and_Lu
      evidence: Current pending Isa and Lu order, same-event active cart, historical declined AMORCITOS record.
      expected:
        - Ground the current Isa and Lu thread from a verified campaign anchor or explicit user evidence.
        - Suppress AMORCITOS unless the user explicitly asks about it.
        - Do not assert that the amount matched or did not match because the endpoint lacks received-amount and balance fields.
        - After the user reports paying the shortfall, say the order remains pending and apply the verified validation window; do not claim approval or deny receipt.
    - case: Luis_Alejandra
      evidence: Current pending Alejandra order and same-event active cart; endpoint currency null.
      expected:
        - Preserve the campaign/order context when the user reports sending the balance.
        - Do not confirm receipt from an image or calculate/display currency without typed evidence.
        - State the up-to-72-business-hour validation window when method/status evidence supports it.

conditional_reliability_investigations:
  duplicate_or_reset_messages:
    prior_evidence: >-
      A retained historical WhatsApp audit found ten native message IDs processed twice and some
      duplicate pairs produced different answers. This establishes a real duplicate-processing
      risk, but does not identify the cause of the newly supplied screenshots.
    required_evidence:
      - inbound_message_id
      - channel_and_external_user_hash
      - lambda_request_ids
      - plan_id_before_and_after
      - previous_and_next_node
      - response_classifier_decision
      - structured_extraction
      - outbound_message_ids
    implementation_gate: >-
      Add message-level conditional-write deduplication or per-user serialization only if traces
      prove duplicate delivery, concurrent processing, or plan creation races. Otherwise fix the
      typed continuity transition only. Do not redesign storage from screenshots alone.
  campaign_grounding:
    required_evidence:
      - channel_message_contract
      - stored_admin_campaign_fields
      - campaign_send_path
      - whether order_id_cart_id_event_id_and_amount_due_exist_as_metadata
    implementation_gate: >-
      If typed campaign metadata exists, validate and persist it. If it does not, add metadata at
      send time as a separately reviewed design. Never parse flow from exact campaign text.
  balance_reconciliation:
    required_backend_contract:
      - total_due
      - amount_received
      - balance_due
      - currency_for_each_operand
      - payment_validation_status
      - timestamp_with_offset
    implementation_gate: >-
      Until these fields are documented and returned, the agent may relay a typed campaign
      amount_due but may not recompute or contradict it from order totals.

tasks:
  - id: T0
    title: Freeze the baseline and disposition the experimental draft
    wave: 0
    owner: primary
    status: completed
    deliverables:
      - User decision to discard the draft or retain it only as review material.
      - Clean, named git baseline before production edits.
      - No accidental inclusion of exploratory prompt/test edits.
    acceptance:
      - git status and baseline commit recorded.
      - No user or external edits are removed.
  - id: T1
    title: Complete read-only trace and contract audit
    wave: 1
    owner: cheap_worker_a
    status: completed
    scope:
      - Retrieve exact traces for reset/repetition cases.
      - Inspect structured campaign metadata availability.
      - Capture sanitized partition schemas and response outcomes.
      - Classify every reported case as partition parsing, absent endpoint data, model/runtime
        interpretation, FAQ coverage, or continuity/delivery; allow more than one class when proven.
      - Correlate every restart or repeated response before selecting an idempotency, serialization,
        context-anchor, or state-transition change.
    no_code_changes: true
    acceptance:
      - Each root cause marked verified, disproven, or unresolved.
      - FAQ source presence, retrieval result, and user-specific API evidence are reported separately.
      - No raw phone, token, payment payload, or bank data in the artifact.
  - id: T2
    title: Specify canonical phone context and disclosure contracts
    wave: 1
    owner: cheap_worker_b
    status: completed
    scope:
      - Define order/cart/campaign/source types and resolution states.
      - Define precedence, inconsistency, and selection truth tables.
      - Define model-visible projections per question class.
      - Define single-plus-one extraction, selection, mutation, and failure truth tables.
      - Define currency-null and timestamp-source truth tables before response wording is designed.
    no_code_changes: true
    acceptance:
      - Ambiguous and conflicting examples have deterministic outcomes.
      - Raw API response exclusion is testable.
      - Currency/time/balance unknowns remain unknown.
      - Payment method never supplies a missing currency.
      - Offset-less timestamps are absent from model input; deterministic Lima conversion remains
        gated on backend confirmation that the source is UTC.
      - One +1 is distinguished from multiple companions without keyword routing.
  - id: T3
    title: Implement partitioned gateway parsing and canonical snapshot
    wave: 2
    owner: cheap_worker_a
    status: completed
    depends_on: [T0, T1, T2]
    file_ownership:
      - src/runtime/agent-conversation-gateway.ts
      - src/core/information.ts
      - src/runtime/rsvp_gateway_contract_to_be_confirmed
      - gateway_contract_tests
    acceptance:
      - Parse completed_orders, pending_orders, and carts independently.
      - Retain legacy orders only for contract comparison, never decision input.
      - Distinguish partition from exact status.
      - Reject malformed partitions with typed invalid_response.
      - No raw payload can reach a reply model input fixture.
      - RSVP requests and responses include typed optional +1 fields and validate saved true/false,
        multiple_pending, 401, 403, 404, 422, malformed success, and retryable failure.
  - id: T4
    title: Implement typed selection, reconciliation, and continuity
    wave: 2
    owner: cheap_worker_b
    status: completed
    depends_on: [T0, T1, T2]
    file_ownership:
      - src/runtime/information-orchestrator.ts
      - typed_continuity_module_to_be_selected_after_T1
      - offline_behavior_tests
    acceptance:
      - Cart-only, order-only, and order-plus-cart cases remain distinct.
      - Current/historical ambiguity follows the truth table, not list order.
      - Third-party support identity cannot replace channel identity.
      - Contextual corrections stay in information flow.
      - No exact-string routing.
      - A single representable +1 reaches event selection and guest_rsvp without default takeover.
      - Multiple companions are not coerced into a single +1.
      - Combined own and +1 decisions produce at most one mutation call.
  - id: T5
    title: Integrate route-specific minimum disclosure
    wave: 3
    owner: primary
    status: completed
    depends_on: [T3, T4]
    scope:
      - Compose PhoneContextSnapshot once per turn.
      - Select the minimum endpoint set and deduplicate calls.
      - Build state-specific model projection or deterministic renderer.
      - Add only the smallest Spanish prompt change that cannot be encoded in state.
      - Combine a selected pending order with only the applicable retrieved FAQ policy; do not send
        unrelated FAQ passages, completed records, carts, or raw retrieval results to the model.
    acceptance:
      - Prompt input excludes unused partitions, candidates, and raw evidence.
      - Serialized prompt bytes measured and within existing relevance/size gates.
      - Existing RSVP, OTP, COD, and provider-planning regressions remain unchanged.
      - The RSVP +1 branch projects only selected event, explicit decisions, and sanitized outcome.
      - Bank destinations, payment identifiers, vouchers, internal processor data, and unsupported
        currency/time claims remain excluded.
  - id: T6
    title: Add permanent interaction regressions and coverage entries
    wave: 3
    owner: primary
    status: completed
    depends_on: [T3, T4]
    required_live_cases:
      - purchase_pending_transfer_currency_time_continuity
      - support_subject_identity_continuity
      - current_pending_over_historical_completed
      - active_cart_checkout_continuity_alex
      - abandoned_cart_only_sonia
      - current_campaign_order_over_historical_declined_maria_jose
      - pending_balance_validation_luis
      - rsvp_plus_one_only_saved
      - rsvp_guest_and_plus_one_combined_saved
      - rsvp_plus_one_multiple_events_requires_selection
      - rsvp_plus_one_not_eligible_no_false_success
