      pass them as caseIds; invocation form: npm run eval:behavior-live -- --case <id> --case <id>.
      (c) Preserve the fail-closed exit contract verbatim (live-behavior-cli.ts:36-44): empty
      selection (including any unknown case ID, since the suite filter intersects the allowlist),
      any failed, errored, or skipped case, or passedCases !== totalCases sets exit code 1.
