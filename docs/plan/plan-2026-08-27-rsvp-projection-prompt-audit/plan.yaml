plan_id: plan-2026-08-27-rsvp-projection-prompt-audit
status: pending
tldr: |
  Two workstreams, sequenced for exactly 2 Lambda deploys and 2 eval:behavior-live runs, each
  running a named case subset via the new eval CLI filtering (T0), never the full suite. Wave 1
  (parallel): T0 exposes repeatable --case filtering in the live eval CLI; T1 implements the
  recorded three-state RSVP projection fix with its live case and offline twin; T2 fixes the
  Aug 2026 audit rubric (bounded research); T3 builds the prompt inventory plus per-branch byte
  measurement as an extension of the existing audit:prompts tooling, baselining ALL branches
  (RSVP included) from the 78ae24e anchor via git show. Wave 2 (parallel): T1r is a reviewer
  gate on T1's change set; T4 produces the full prompt-audit report with one remediation decision
  per finding. Wave 3: T6 deploys the T1 change set and runs eval gate 1 on the named 12-case
  RSVP subset. Wave 4: T5 applies the remediation batch with measured byte deltas and relevance
  regressions, registering its own coverage entries. Wave 5: T5r is a reviewer gate on T5's
  change set. Wave 6: T7 deploys the remediation batch and runs eval gate 2 on the RSVP
  re-validation subset plus T5's registered cases. Wave 7: T8 verifies all ten baseline criteria
  and presents the explicit user decision point for the full live_behavior_regression suite
  (37 cases today, pinned by suite ID), also closing the gate open since commit 78ae24e; the
  suite is never silently skipped. Code and prompt changes are never co-batched across
  workstreams, so live cases cannot mask each other.
created_at: 2026-08-27
created_by: planner
revision: 2
replan_count: 1
planner_revision_used: true

baseline:
  objective: |
    (A) Ship the diagnosed three-state RSVP phone-evidence projection in src/runtime/agent-service.ts
    (resolved_single | needs_event_selection | unavailable; candidate arrays omitted when resolved_single;
    records without event identity rejected; deterministic rendering; /guest/rsvp observability) exactly
    per the proposal recorded in docs/implementation-log.md, with the Paolo & Mariana interaction
    registered and gated. (B) Execute a total system-prompt audit under the Minimum Disclosure
    convention, state-machine aware (per node and per transition), benchmarked against current
    (Aug 2026) context-engineering and agent-design practice, with remediation applied and measured.
    Sequence the work to minimize deploys and eval:behavior-live runs without co-batching changes
    whose live cases could mask each other, and fold the pending full 36-conversation suite gate
    into the final strategy.
  acceptance_criteria:
    - "AC1: RSVP projection exposes exactly three states; resolved_single omits candidate arrays; records lacking event identity are rejected; rendering deterministic; /guest/rsvp observability added; broad candidate list only in needs_event_selection."
    - "AC2: Paolo & Mariana registered as a new entry in evals/live-behavior-coverage.yaml with a live case in evals/cases/ carrying hard structural assertions plus a hard text_semantic expectation with requireJudge true, and a deterministic offline twin test; reuse of an existing live case only with exact coverage."
    - "AC3: Git-tracked audit report with per-node prompt inventory (path -> node -> transitions consuming it), byte measurements per model call type (classifier/extraction/reply) before and after changes, categorized findings (duplicate/conflict/irrelevant/underspecified), and a remediation decision per finding."
    - "AC4: Every applied remediation satisfies Minimum Disclosure; no new global rules where typed state can carry the invariant; dynamic state-machine evidence replaces broad conditional guidance; measured instruction/input bytes recorded for every changed model call; net reduction or justified delta."
    - "AC5: tests/live-behavior-coverage.test.ts passes; every registered change points to a live case."
    - "AC6: Full local gate green; unit/orchestration tests at baseline (520 tests / 71 files), typecheck, lint; no any in TypeScript (strict)."
    - "AC7: Dev Lambda redeployed via se-dev profile us-east-1, fail closed unless STS confirms account 684516060775, after any Lambda-impacting change; npm run eval:behavior-live executed for every conversational-behavior change; missing judge key, skipped case, evaluator error, or failed hard expectation = failed gate."
    - "AC8: Bounded strategy for the full 36-conversation live suite respecting the recorded usage-limit decision; wave-gated subsets per deploy plus an explicit final user decision point; never silently skipped."
    - "AC9: docs/implementation-log.md updated for every code, prompt, and infra change with reason and decision."
    - "AC10: No keyword/exact-string matching introduced for flow decisions; runtime stays channel-agnostic; no backward-compat shims; CloudFormation for any infra change."
  captured_at: 2026-08-27

decisions:
  - "Two deploys, never one. Deploy 1 (T6) carries the RSVP code fix plus its own reply-branch prompt alignment, because one live case covers both. Deploy 2 (T7) carries the audit remediation batch (T5). No cross-workstream co-batching, so live cases cannot mask each other."
  - "Exactly two npm run eval:behavior-live runs, one per deploy, each restricted to a named case subset via the T0 repeatable --case flag (e.g. npm run eval:behavior-live -- --case <id> ...). The full suite (suite ID live_behavior_regression, 37 cases today, grows as T1/T5 register entries) is deferred to one explicit user decision point in T8, which also closes the gate open since commit 78ae24e. The suite is always referenced by suite ID, never by a frozen count; T8's cost estimate uses the then-current manifest count."
  - "The RSVP fix spec is the recorded three-state proposal in docs/implementation-log.md (section Diagnose the omitted Paolo & Mariana RSVP result); implement it, do not redesign it. Reference gating pattern: information-orchestrator executeGuestEventRequest/selectGuestEvent/guestEventsResult."
  - "Byte comparison anchor is commit 78ae24e. T3 records the per-branch baseline for ALL branches and call types INCLUDING the RSVP branches, extracted from the anchor commit content (git show), never the racy wave-1 working tree. T1 computes its RSVP reply-branch delta against the same anchor with the same method. T4 and T5 complete the before/after table in the audit report."
  - "Byte measurement reuses and extends the existing audit infrastructure (npm run audit:prompts via src/audit/prompt-audit-cli.ts and auditPromptBundles; npm run audit:prompts:compare via src/audit/static-prompt-comparison-cli.ts; tests/prompt-audit.test.ts; tests/static-prompt-comparison.test.ts). No parallel harness or CLI is built. Prompt changes (T1 RSVP section, T5 batch) must keep audit:prompts:compare gates green, resolving any trip through the tool's existing mechanism with a logged justification, never by weakening gates."
  - "Audit report path: docs/prompt-audit/2026-08-system-prompt-audit.md (English, git-tracked); rubric artifact path: docs/plan/plan-2026-08-27-rsvp-projection-prompt-audit/rubric.md."
  - "T4 remediation decisions are final scope for T5. Findings that would require RSVP redesign or reopening paths closed in 78ae24e (parser/gateway, COD301816 normalization, phone-scoped retrieval) are flagged out of scope, not planned."
  - "Every behavior-affecting prompt remediation gets its own evals/live-behavior-coverage.yaml entry; reuse an existing live case only with exact coverage of the new behavior."
  - "Reviewer gates before each Lambda-impacting deploy: T1r reviews the T1 change set before T6 deploys; T5r reviews the T5 change set before T7 deploys. T4 remains the prompts-only review. A review verdict with blocking findings sends the reviewed task back to needs_revision; the deploy never proceeds over an unresolved blocking finding."
  - "Per-deploy eval subsets are pinned by explicit case IDs (deterministic membership), not by tags or counts: gate 1 (T6) runs the 12-case RSVP projection subset; gate 2 (T7) runs the same 12 RSVP re-validation cases plus every case ID referenced by the registry behavior-change entries T5 adds. Tag filtering in the eval CLI is deliberately cut (YAGNI): tags would make per-deploy membership drift as cases evolve, and finding 2 requires named exact IDs."
  - "Parallelism and file ownership: wave 1 runs T0, T1, T2, T3 concurrently on disjoint paths; wave 2 runs T1r and T4 concurrently (both read-only over runtime/prompts, disjoint outputs). Wave 3 (T6) precedes wave 4 (T5) so the deploy tree contains exactly the T1 change set; T0's eval-harness change is not Lambda-impacting and does not affect the deploy bundle. No other wave barriers exist; each barrier is a real dependency (review gate, deploy-snapshot integrity) or resource conflict, not convenience."
  - "docs/implementation-log.md is append-only in every wave: each worker appends its entries as single atomic writes committed immediately after the change they document; concurrent tasks never reorder or rewrite existing entries. This is the deterministic write ordering for any wave with concurrent log appenders."
  - "T0's CLI change preserves the fail-closed gate contract of src/evals/live-behavior-cli.ts (empty selection, any failed, errored, or skipped case, or passedCases !== totalCases sets exit code 1); the single-case runner option used by src/evals/cli.ts stays untouched."

assumptions:
  - "The recorded three-state proposal is implementable as written without renaming state-machine nodes."
  - "Prompt assembly is deterministic and unit-testable offline, so per-branch serialized byte counts can be asserted without live calls (buildRequestMetrics instructionBytes/inputBytes, src/runtime/openai-agent-runtime.ts:411-423)."
  - "The existing dev deploy pipeline uses CloudFormation artifacts and needs no new infrastructure in this plan."
  - "The live_behavior_regression suite harness exists and is invocable on demand (evals/suites/live_behavior_regression.yaml, 37 case IDs today); T0's --case filtering makes per-deploy subsets invocable without changing the suite manifest."
  - "The evals case patterns from the COD entries (evals/live-behavior-coverage.yaml:243-248) generalize to the new RSVP case."
  - "Extending EvalRunnerOptions with an optional caseIds field is non-breaking for the existing offline eval CLI (src/evals/cli.ts) which uses the single caseId option."

replan:
  reason: >
    Bounded revision from code-verified review findings. Blocking: (1) npm run eval:behavior-live
    executes the ENTIRE live_behavior_regression suite with no case filtering
    (src/evals/live-behavior-cli.ts passes no caseId; src/evals/runner.ts:169 supports single-case
    only), contradicting the plan's bounded strategy and making the T8 decision point redundant;
    (2) the per-deploy bounded subset was undefined. Also: T3 baseline scope raced T1's concurrent
    RSVP edits; no reviewer gate before either deploy; T3 proposed a parallel byte harness instead
    of extending the existing audit:prompts tooling; suite size was frozen at 36; T1 line refs were
    off by one function; concurrent log appends in wave 2 lacked ordering.
  changed_tasks: [T1, T3, T6, T7, T8]
  added_tasks: [T0, T1r, T5r]
  removed_tasks: []
  preserved_acceptance_criteria:
    - "AC1 through AC10 unchanged; baseline objective and hard constraints unchanged."
  new_risks:
    - "T0 modifies the eval gate CLI; regression risk is bounded by preserving the exit-code contract verbatim and adding selection unit tests."
    - "T1r/T5r review gates can trigger rework loops that extend the schedule; each reviewed task returns to needs_revision with retry accounting unchanged."
    - "Subset runs (12 of 37) do not exercise non-subset cases between deploys; residual regression risk is accepted and closed by the T8 full-suite user decision point."
  progress_signal: "No tasks started; plan status pending; revision applied before execution."
  revised_tasks: [T1, T3, T6, T7, T8]
  invalidated_tasks: []
  invalidated_assumptions:
    - "The 36-conversation live suite harness exists and is invocable on demand. Replaced by: the live_behavior_regression suite (37 cases today, pinned by suite ID) is invocable on demand, with per-deploy subsets enabled by T0."

