      the exit contract. (e) docs/implementation-log.md entry. Do NOT add tag filtering: per-deploy
      membership must be deterministic named case IDs (decision recorded); the single caseId option
      used by src/evals/cli.ts stays untouched. reuse: existing selectCases filtering and exit
