template: template.base-live
id: live_behavior.active_cart_checkout_continuity_alex
suite: live_behavior_regression
version: 1
description: Alex same-event pending order and active cart stay distinct; checkout continuation does not restart or flatten records.
tags: [live, behavior, purchase, cart, continuity, reported-interaction, alex]
targetModes: [live_lambda]
inputs:
  - text: Quiero continuar el checkout de Luis Raul y Carmen del Rosario. Veo el pedido pendiente y el carrito activo del mismo evento. Que falta para pagar?
    channel: whatsapp
    contactPhone: "+51982340340"
    sessionId: live-active-cart-alex-session
    backendFixture:
      scenario: purchase-alex-340
  - text: El carrito sigue activo, no es un pedido nuevo. No me saludes de nuevo como si fuera la primera vez.
    channel: whatsapp
    contactPhone: "+51982340340"
    sessionId: live-active-cart-alex-session
    backendFixture:
      scenario: purchase-alex-340
backendFixture:
  scenario: purchase-alex-340
notes:
  - "El nombre registrado del evento es Luis Raul and Carmen del Rosario; repetirlo tal cual no es mezcla de idiomas."
expectations:
  - id: active-cart-stays-information
    type: node_transition
    to: resolver_consultas_informativas
    turnIndex: 0
    severity: hard
  - id: active-cart-uses-phone-partitions
    type: tool_usage
    mustCall: [lookup_guest_orders_by_phone]
    mustNotCall: [auth_by_phone, request_user_login_code, verify_user_login_code]
    turnIndex: 0
    severity: hard
  - id: active-cart-continuity-stays-information
    type: node_transition
    to: resolver_consultas_informativas
    turnIndex: 1
    severity: hard
  - id: active-cart-not-flattened
    type: text_semantic
    rubric: >-
      The trusted phone lookup returns a pending order and an active cart for the same event Luis Raul and Carmen del Rosario. The response must be concise, natural Latin American Spanish, keep the two records distinct, and answer the checkout continuation without flattening cart into order. It must not restart with a generic Sin Envolturas welcome, ask what event the user is planning, claim the cart is a separate new order, or ask for email/OTP. On the second turn it must stay in the same checkout thread and not repeat a generic introduction.
    minScore: 0.9
    requireJudge: true
    turnIndex: 1
    severity: hard
budget:
  maxTurns: 2
  estimatedPromptTokensPerTurn: 1700
  estimatedCompletionTokensPerTurn: 220
