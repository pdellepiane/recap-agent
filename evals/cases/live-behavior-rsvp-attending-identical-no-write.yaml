template: template.base-live
id: live_behavior.s07_attending_identical_no_write
suite: live_behavior_regression
version: 2
description: A repeated identical attending decision on an already confirmed invitation is reported without another mutation.
tags: [live, behavior, rsvp, attendance, no-write, s07]
targetModes: [live_lambda]
inputs:
  - text: Sí, quiero asistir a Otra celebración prueba.
    channel: whatsapp
    contactPhone: "+51973296571"
    sessionId: live-s07-attending-identical-session
    backendFixture:
      scenario: s02-rsvp-reversal
seedPlan:
  current_node: responder_invitacion
  intent: responder_invitacion
  rsvp_state:
    status: none
    pending_action: null
    candidates:
      - guest_id: 584353
        event_name: Otra celebración prueba
        event_date: "2026-08-19 05:00:00"
    requested_at: null
    selection_attempts: 0
backendFixture:
  scenario: s02-rsvp-reversal
expectations:
  - id: remains-in-rsvp-node
    type: node_transition
    to: responder_invitacion
    severity: hard
  - id: reports-without-another-mutation
    type: tool_usage
    mustCall: [lookup_rsvp_invitations]
    mustNotCall: [guest_rsvp, auth_by_phone, request_user_login_code, verify_user_login_code]
    severity: hard
  - id: reports-confirmed-without-new-registration
    type: text_semantic
    rubric: >-
      The invitation for Otra celebración prueba already says the guest will attend and the user repeated the same attending decision, so the decision already existed and no change occurred. Evaluate the complete utterance together with the zero-write evidence: confirmation wording (such as confirmada) describes the already-existing state and is never a new-mutation claim on its own; no single phrase overrides the explicit no-change context. The response must be natural and entirely in Spanish, clearly say attendance is already confirmed with no new registration, and must not claim a new change was made, ask for email or a code, expose internal fields, or offer human support as if the operation failed. The verified zero-write evidence (no guest_rsvp effect) outranks any phrase; date formats may vary when the facts are identical. Useful extra grounded detail passes.
    minScore: 0.9
    requireJudge: true
    severity: hard
  - id: no-rsvp-vocabulary
    type: text_not_contains
    phrases: ["RSVP", "rsvp"]
    severity: hard
notes:
  - "E1 v2 2026-09-15, profile-inference directive (S07): complete-utterance plus zero-write evidence; a phrase cannot override the explicit no-change statement; date formats may vary when facts are identical. No threshold lowering (0.9 kept). R05: old v1 runs preserved; baseline and candidate must rerun on this v2 contract."
budget:
  maxTurns: 1
  estimatedPromptTokensPerTurn: 1600
  estimatedCompletionTokensPerTurn: 250
