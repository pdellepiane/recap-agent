template: template.base-live
id: live_behavior.support_detail_continuity
suite: live_behavior_regression
version: 1
description: Details supplied after a payment-support answer remain attached to that support thread and do not replace the channel user's identity.
tags: [live, behavior, faq, support, continuity, identity, reported-interaction, claudia-roger]
targetModes: [live_lambda]
inputs:
  - text: Un amigo no puede usar su tarjeta de crédito para comprar un regalo. ¿Hay problemas con tarjetas?
    channel: whatsapp
    contactPhone: "+51985101461"
    sessionId: live-support-detail-continuity-session
  - text: El nombre del invitado afectado es Roger Abanto.
    channel: whatsapp
    contactPhone: "+51985101461"
    sessionId: live-support-detail-continuity-session
  - text: Y el evento es Baby Shower Catalina.
    channel: whatsapp
    contactPhone: "+51985101461"
    sessionId: live-support-detail-continuity-session
backendFixture:
  scenario: support-continuity
expectations:
  - id: support-question-uses-kb
    type: tool_usage
    mustCall: [knowledge_base_search]
    mustNotCall: [search_providers_from_plan, auth_by_phone, request_user_login_code]
    turnIndex: 0
    severity: hard
  - id: guest-name-stays-support
    type: node_transition
    to: resolver_consultas_informativas
    turnIndex: 1
    severity: hard
  - id: event-detail-stays-support
    type: node_transition
    to: resolver_consultas_informativas
    turnIndex: 2
    severity: hard
  - id: support-details-do-not-reset-or-rename
    type: text_semantic
    rubric: >-
      Roger Abanto is the affected invited purchaser, not the WhatsApp user. Baby Shower Catalina is the event connected to the same card-payment support thread. The final answer must be concise, natural, and entirely in Spanish; acknowledge the newly supplied event detail and continue only with the next necessary support step. It must not greet or address the channel user as Roger, restart with a generic welcome, switch to provider planning, repeat the full card-payment explanation, or claim that an account or purchase was verified when no such lookup occurred.
    minScore: 0.9
    requireJudge: true
    turnIndex: 2
    severity: hard
budget:
  maxTurns: 3
  estimatedPromptTokensPerTurn: 1700
  estimatedCompletionTokensPerTurn: 220
