template: template.base-live
id: live_feedback.token_seeded_contact_correction
suite: live_behavior_regression
version: 2
description: Seeded close flow should consume tokens while rejecting and then accepting corrected contact phone.
tags: [live, feedback, token, seeded-plan, contact]
backendFixture:
  scenario: token-contact-correction-close
inputs:
  - text: mi teléfono es 967
    sessionId: live-feedback-contact-session
    backendFixture:
      scenario: token-contact-correction-close
  - text: perdón, mi teléfono con código es +51 954779071
    sessionId: live-feedback-contact-session
    backendFixture:
      scenario: token-contact-correction-close
  - text: mi nombre es Carolina y mi correo es carolina@example.com
    sessionId: live-feedback-contact-session
    backendFixture:
      scenario: token-contact-correction-close
seedPlan:
  current_node: crear_lead_cerrar
  event_type: boda
  location: Lima
  guest_range: 51-100
  active_need_category: Fotografía y video
  vendor_category: Fotografía y video
  provider_needs:
    - category: Fotografía y video
      status: selected
      preferences: []
      hard_constraints: []
      missing_fields: []
      recommended_provider_ids: [90]
      recommended_providers:
        - id: 90
          title: Carlos Schult
          category: Fotografía y video
          location: Lima
          priceLevel: null
          reason: seleccionado
          serviceHighlights: []
          termsHighlights: []
      selected_provider_ids: [90]
      selected_provider_hints: [Carlos Schult]
expectations:
  - id: tokens-all-turns
    type: token_usage_present
    allTurns: true
  - id: first-phone-invalid
    type: trace_field_equals
    turnIndex: 0
    path: contact_validation_summary.status
    expected: invalid
  - id: corrected-phone-final
    type: trace_field_equals
    turnIndex: 1
    path: contact_validation_summary.plan_contact_fields_present.phone
    expected: true
  - id: correct-contact-correction-behavior
    type: text_semantic
    turnIndex: 1
    rubric: >-
      After rejecting the incomplete phone number, the response must accept the corrected Peruvian number without asking for the same correction again, preserve the existing close-flow context, and request only genuinely missing contact information. Asking for the event date is admissible since the seed plan carries no event date. The response must be clear and natural in Spanish.
    minScore: 0.85
    requireJudge: true
    severity: hard
  - id: correct-final-close-behavior
    type: text_semantic
    turnIndex: 2
    rubric: >-
      After the corrected phone number, name, and email address are all present, the response must complete or clearly continue submission for Carlos Schult without asking for any of those same contact fields (phone, name, email) again and without restarting provider search. Requesting the event date is admissible: the seed plan carries no event date, so a date ask during close is correct behavior, never a defect (same precedent as live_feedback.token_seeded_selection_defer_close). It must communicate the outcome naturally in Spanish.
    minScore: 0.85
    requireJudge: true
    severity: hard
notes:
  - "R05 oracle revision v1 to v2, 2026-09-16, evaluator-owned audit fix. Old contact-info clause (without asking for any of those same fields again) could be read to ban any further question, including the close-flow event date, although the seed plan carries no event date and the sibling close case (live_feedback.token_seeded_selection_defer_close, EX1 v2) already protects the date-ask as correct close behavior. New contract scopes the ban to the contact fields (phone, name, email) plus restarting provider search; a date ask stays admissible on both contact turns. Thresholds, hard severity, requireJudge, structural authorization/effect checks unchanged. Old v1 runs preserved; baseline and candidate must rerun on this v2 contract."
budget:
  maxTurns: 3
  estimatedPromptTokensPerTurn: 1400
  estimatedCompletionTokensPerTurn: 400
