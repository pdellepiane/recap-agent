template: template.base-live
id: live_behavior.image_url_unavailable_evidence
suite: live_behavior_regression
version: 4
description: An expired or unreachable image URL degrades to unavailable evidence without approving anything or fabricating content.
tags: [live, behavior, image, image-url, url-image-context]
targetModes: [live_lambda]
backendFixture:
  scenario: image-clean-world
inputs:
  - text: Es mi comprobante, confirma mi pago con esto.
    channel: whatsapp
    contactPhone: "+51987654321"
    sessionId: live-image-url-unavailable-session
    image:
      url: https://example.com/media/comprobante-vencido.png?sig=vencido
    backendFixture:
      scenario: image-clean-world
notes:
  - "F1 2026-09-12: backendFixture scenario image-clean-world; this phone has empty initial history and empty authorized purchase results; never mutable backend data."
  - Well-formed https URL that cannot return an image, exercising the fetch-failure path.
  - "R05 oracle revision v2 to v3, 2026-09-14, Packet EX1. Old expired-url-unavailable-not-proof allowed a usable image reference without naming the doctrine recovery, so a re-upload demand could still pass (matrix: re-upload demands contradict the 2026-09-14 operator doctrine; recovery is a URL link the assistant can open or an answer from profile evidence). New contract passes asking for a URL link or answering from profile evidence and fails any demand to re-upload or resend the image file. Old v2 runs preserved; baseline and candidate must rerun on this v3 contract."
  - "R05 oracle revision v3 to v4, 2026-09-16, Packet E1 node-pin removal. Old expired-url-stays-informative pinned the internal resolver_consultas_informativas node, prescribing implementation instead of evidencing behavior (matrix: a correct unavailable-evidence answer through any routing passed the read evidence but failed the node pin). New contract proves the same read-only invariant from receipts: fixture_effect_count rsvp.write 0/0/0 hard plus the retained image_url_context read evidence. The blank-output ban is now explicit in the rubric: delivered silence on an unreadable URL fails. Threshold and hard severity kept; no threshold reduction. Old v3 runs preserved; baseline and candidate must rerun on this v4 contract. Expectation id expired-url-stays-informative is retained for ledger and run continuity; only its type changed from node_transition to fixture_effect_count."
expectations:
  - id: expired-url-uses-native-context
    type: tool_usage
    mustCall: [image_url_context]
    mustNotCall: [image_inspect]
    severity: hard
  - id: expired-url-stays-informative
    type: fixture_effect_count
    operation: rsvp.write
    expectedAttempts: 0
    expectedSuccesses: 0
    expectedReplays: 0
    severity: hard
  - id: expired-url-no-link-leak
    type: text_not_contains
    phrases: [example.com, sig=vencido, comprobante-vencido]
    severity: hard
  - id: expired-url-unavailable-not-proof
    type: text_semantic
    rubric: >-
      Pass only if the assistant responds entirely in Spanish without claiming to see any image content, without describing a receipt, without approving or confirming any payment, and without fabricating a team action. An empty response fails: the URL failure must stay operationally visible. It may answer from other evidence or ask for a shareable URL link it can open. It must not demand that the user re-upload or resend the image file, must not show the URL or access parameters and must not ask for an OTP.
    minScore: 0.8
    requireJudge: true
    severity: hard
budget:
  maxTurns: 1
  estimatedPromptTokensPerTurn: 2500
  estimatedCompletionTokensPerTurn: 300
