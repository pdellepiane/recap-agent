template: template.base-live
id: live_behavior.accountless_guest_event_uses_phone_without_otp
suite: live_behavior_regression
version: 3
description: An invited WhatsApp guest without an account receives event details through the trusted phone without being pushed into email OTP.
tags: [live, behavior, associated-event, accountless-guest, phone-first, reported-interaction]
targetModes: [live_lambda]
backendFixture:
  scenario: guest-julisabeth-andres
inputs:
  - text: Respondí la invitación por WhatsApp. ¿Dónde será la recepción y fiesta?
    channel: whatsapp
    contactPhone: "+51904523314"
    sessionId: live-accountless-guest-event-session
    backendFixture:
      scenario: guest-julisabeth-andres
expectations:
  - id: routes-to-associated-event-information
    type: fixture_effect_count
    operation: rsvp.write
    expectedAttempts: 0
    expectedSuccesses: 0
    expectedReplays: 0
    severity: hard
  - id: uses-phone-enriched-event-context-directly
    type: tool_usage
    mustCall: [lookup_guest_events_by_phone, get_guest_event_detail]
    mustNotCall: [auth_by_phone, request_user_login_code, verify_user_login_code, update_phone, guest_rsvp]
    severity: hard
  - id: leaves-no-authentication-request-pending
    type: plan_field_equals
    path: user_auth.status
    expected: none
    severity: hard
  - id: answers-from-the-invited-event-without-otp
    type: text_semantic
    rubric: >-
      The trusted WhatsApp number has no Sin Envolturas account but is an invited guest to Julisabeth y Andrés. The verified event detail identifies “Recepción y Fiesta” at Hacienda Recoveco on Avenida Manuel Valle in Lima. The answer must be concise, natural, and entirely in Spanish; directly provide that verified reception location, and must not ask for an email, OTP code, account creation, or another turn before answering.
    minScore: 0.9
    requireJudge: true
    severity: hard
budget:
  maxTurns: 1
  estimatedPromptTokensPerTurn: 1800
  estimatedCompletionTokensPerTurn: 300

notes:
  - "R05 v3 (2026-09-16, customer-support release E1): old contract pinned the internal route (node_transition to resolver_consultas_informativas). Old defect: a correct venue answer composed through any other routing passed the read evidence but failed the pin, grading implementation instead of behavior. New acceptance: zero RSVP mutations from effect receipts (fixture_effect_count rsvp.write 0/0/0 hard) plus mandatory actual venue facts (Hacienda Recoveco, Avenida Manuel Valle, Lima) and no email/OTP demand. Failing counterexample: an answer that performs a guest_rsvp write, omits the reception location, or asks for an OTP fails. Threshold and hard severity kept; earlier verdicts unchanged."
