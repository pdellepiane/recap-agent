template: template.base-live
id: live_behavior.phone_confirmation_unclear_requires_yes_or_no
suite: live_behavior_regression
version: 1
description: A stale imprecise answer after the retired confirmation prompt must use the current phone automatically instead of asking again.
tags: [live, behavior, authentication, phone-first, reported-interaction]
targetModes: [live_lambda]
inputs:
  - text: Este
    channel: whatsapp
    contactPhone: "$TERMINAL_CONTACT_PHONE"
    sessionId: phone-confirmation-unclear-session
seedPlan:
  current_node: resolver_consultas_informativas
  user_auth:
    status: none
    email: null
    token: null
    token_expires_at: null
    last_error: null
    requested_at: null
    failed_code_attempts: 0
    awaiting_phone_confirmation: true
    auth_method: null
  information_state:
    resume_node: entrevista
    pending_requests:
      - requestId: information-1
        kind: associated_event
        query: ¿La restricción de vestir de blanco aplica a mujeres y varones?
        eventHint: Karem y Alfredo
    selection_candidates: []
expectations:
  - id: stale-confirmation-is-cleared
    type: plan_field_equals
    path: user_auth.awaiting_phone_confirmation
    expected: false
    severity: hard
  - id: current-phone-is-authenticated-automatically
    type: tool_usage
    mustCall: [auth_by_phone]
    mustNotCall: [request_user_login_code, verify_user_login_code]
    severity: hard
  - id: phone-auth-method-persists
    type: plan_field_equals
    path: user_auth.auth_method
    expected: phone
    severity: hard
  - id: does-not-repeat-retired-confirmation
    type: text_semantic
    rubric: >-
      The user answered only “Este” in a conversation seeded from the retired phone-confirmation flow. Pass if the response continues the preserved event question naturally in Spanish after the structurally asserted successful phone authentication. It must not ask for another yes/no confirmation, ask the user to repeat the known question, or request an email or one-time code. Do not require the user-facing answer to explain the internal automatic-phone mechanism.
    minScore: 0.9
    requireJudge: true
    severity: hard
budget:
  maxTurns: 1
  estimatedPromptTokensPerTurn: 1800
  estimatedCompletionTokensPerTurn: 350
