template: template.base-live
id: live_behavior.abandoned_cart_only_sonia
suite: live_behavior_regression
version: 5
description: "Merged cart thread: Sonia cart-only abandoned checkout is confirmed without a not-found answer, then the Alex same-event pending order and active cart stay distinct through checkout continuation, and thanks closes."
tags: [ live, behavior, purchase, cart, abandoned, reported-interaction, sonia, continuity, alex ]
targetModes: [ live_lambda ]
inputs:
  - text: Tengo un carrito abandonado de Carlos y Adriana. Quiero saber si puedo pagar por transferencia.
    channel: whatsapp
    contactPhone: "+51965765765"
    sessionId: live-abandoned-cart-sonia-session
    backendFixture:
      scenario: purchase-sonia-765
  - text: ¿Entonces no tengo ningún pedido pendiente, solo el carrito?
    channel: whatsapp
    contactPhone: "+51965765765"
    sessionId: live-abandoned-cart-sonia-session
    backendFixture:
      scenario: purchase-sonia-765
  - text: Quiero continuar el checkout de Luis Raul y Carmen del Rosario. Veo el pedido pendiente y el carrito activo del mismo evento. Que falta para pagar?
    channel: whatsapp
    contactPhone: "+51982340340"
    sessionId: live-abandoned-cart-sonia-session
    backendFixture:
      scenario: purchase-alex-340
  - text: El carrito sigue activo, no es un pedido nuevo. No me saludes de nuevo como si fuera la primera vez.
    channel: whatsapp
    contactPhone: "+51982340340"
    sessionId: live-abandoned-cart-sonia-session
    backendFixture:
      scenario: purchase-alex-340
  - text: Gracias, voy a completar el pago por transferencia.
    channel: whatsapp
    contactPhone: "+51965765765"
    sessionId: live-abandoned-cart-sonia-session
    backendFixture:
      scenario: purchase-sonia-765
backendFixture:
  scenario: purchase-sonia-765
notes:
  - "Contexto confiable reconstruido: el historial saliente verificado contiene el mensaje id 1 outbound campaign body 'Hola Sonia Maribel, hiciste un regalo para Carlos & Adriana pero no terminaste el proceso. Puedes completarlo aqui: https://sinenvolturas.com/cart/recover/ea14739a-4064-4791-a646-aa24b799d2da' con ruta /cart/recover valida. La respuesta puede referirse a ese enlace ya enviado como ruta de recuperacion existente, sin inventar ni generar una URL nueva y sin repetir la URL textual."
  - "El nombre registrado del evento es Carlos and Adriana; repetirlo tal cual no es mezcla de idiomas."
  - "La politica indexada de medios de pago incluye la transferencia bancaria como opcion general para completar la compra de regalos."
  - "2026-09-30 purchase-lane extension v2: grows 1 turn to 3 with a cart-only confirmation follow-up and a thanks closure. Pre-existing expectations gain explicit turnIndex 0 because un-indexed expectations evaluate the final turn."
  - "2026-09-30 LIVE-PURCHASE merge v3: absorbed live_behavior.active_cart_checkout_continuity_alex into this carrier; every structural and text_semantic assertion kept with renumbered turnIndex (abandoned-cart-sonia: T0->M0,T1->M1,T2->M4; active-cart-checkout-alex: T0->M2,T1->M3,T2->M4). Absorbed source files deleted; turn fixtures/phones preserved per turn."
expectations:
  - id: abandoned-cart-uses-phone-partitions
    type: tool_usage
    mustCall: []
    mustNotCall: [ auth_by_phone, request_user_login_code, verify_user_login_code ]
    turnIndex: 0
    severity: hard
  - id: no-correo-channel-claim
    type: text_not_contains
    phrases: [ "correo" ]
    turnIndex: 0
    severity: hard
  - id: cart-only-followup-no-auth
    type: tool_usage
    mustCall: []
    mustNotCall: [ auth_by_phone, request_user_login_code, verify_user_login_code, request_human_takeover ]
    turnIndex: 1
    severity: hard
  - id: active-cart-uses-phone-partitions
    type: tool_usage
    mustCall: []
    mustNotCall: [ auth_by_phone, request_user_login_code, verify_user_login_code ]
    turnIndex: 2
    severity: hard
  - id: sonia-thanks-no-new-action
    type: tool_usage
    mustCall: []
    mustNotCall: [ auth_by_phone, request_user_login_code, verify_user_login_code, request_human_takeover ]
    turnIndex: 4
    severity: hard
  - id: active-cart-thanks-no-new-action
    type: tool_usage
    mustCall: []
    mustNotCall: [ auth_by_phone, request_user_login_code, verify_user_login_code, request_human_takeover ]
    turnIndex: 4
    severity: hard
budget:
  maxTurns: 5
  estimatedPromptTokensPerTurn: 1600
  estimatedCompletionTokensPerTurn: 200
scorers:
  - id: expectation-core
    type: expectation_pass_rate
    weight: 1
