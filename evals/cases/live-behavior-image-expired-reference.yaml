template: template.base-live
id: live_behavior.image_expired_reference_resubmit
suite: live_behavior_regression
version: 5
description: A question about an expired persisted image reference must not guess pixels; recovery answers from available evidence or asks only for the specific missing fact, never an image or URL.
tags: [live, behavior, image, image-file, expiry]
targetModes: [live_lambda]
backendFixture:
  scenario: image-clean-world
seedPlan:
  current_node: resolver_consultas_informativas
  image_attachments:
    - kind: file
      fileId: file-expired-seed-1
      expiresAt: 2020-01-01T00:00:00.000Z
      mimeType: image/png
      byteLength: 1024
      contentDigest: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      messageId: wamid.expiredseed1
      receivedAt: 2020-01-01T00:00:00.000Z
inputs:
  - text: Que dice el comprobante que te envie?
    channel: whatsapp
    contactPhone: "+51987654321"
    sessionId: live-image-expired-session
notes:
  - "F1 2026-09-12: backendFixture scenario image-clean-world; this phone has empty initial history and empty authorized purchase results; never mutable backend data."
  - "Seeded plan carries one file reference whose five-day Files expiry already elapsed. Known fact: the original pixels are unavailable, so no amount, date or issuer can be reported. The model must explain the image cannot be read and then either answer from available evidence or ask only for the specific missing factual information; it must never request an image, resubmission, re-upload, or URL, substitute a newer image, narrate internal file identifiers or expiry mechanics, or invent content."
  - "R05 oracle revision v4 to v5, 2026-09-14, recheck-5e846b. The v4 contract demanded a bounded question naming a single specific missing datum even for this blocked-pixel-only request with no identified purchase or field; no tool can recover missing pixels and zero reads is not a defect. New contract permits a concise honest limitation, an answer from available evidence, or a useful open question about what the customer wants to resolve, without demanding a named datum or blind orders reads. Hard no-fabrication, no image-or-URL ask, and no-effects checks stay. Old v4 runs preserved; baseline and candidate must rerun on this v5 contract."
  - "Blocked-pixel-only scope: turn_state.record_checks with lookups_attempted 0 means no lookup occurred, not an empty backend result. This case evaluates the blocked-pixel question only, separately from genuine backend-status questions."
expectations:
  - id: expired-no-inspect-no-write
    type: tool_usage
    mustCall: []
    mustNotCall: [image_inspect, guest_rsvp, auth_by_phone, request_user_login_code, verify_user_login_code, request_human_takeover]
    severity: hard
  - id: expired-no-invented-content
    type: text_not_contains
    phrases: [pago aprobado, pago confirmado, hemos confirmado tu pago, pago verificado]
    severity: hard
  - id: expired-answers-from-evidence-or-asks-fact
    type: text_semantic
    rubric: >-
      Pass only if the assistant responds entirely in Spanish stating that it cannot read the previous image, without narrating internal file identifiers or expiry mechanics, and then does one of: answers from profile or order evidence already available; asks a useful open question about what the customer wants to resolve without demanding a specific named datum; or states a concise honest limitation with no question when no task can be completed, in natural wording without any fixed required phrase. When the user asks a genuine purchase question answerable from authorized records, relevant reads must come before asking. For this blocked-pixel-only question with no identified purchase or field, zero backend reads is not a defect and no named datum may be demanded. It must never ask the user for an image, a resubmission, a re-upload, or a URL link; URLs arrive from the backend only. It must not state any amount, currency, date, issuer or operation number as fact, must not confirm or approve any payment, must not claim the image proves a settled payment, and must not ask for an OTP.
    minScore: 0.8
    requireJudge: true
    severity: hard
budget:
  maxTurns: 1
  estimatedPromptTokensPerTurn: 2500
  estimatedCompletionTokensPerTurn: 300
