notes:
  - "R05 oracle revision v4 to v5, 2026-09-25: Answer the fulfillment question from record facts without mandatory extra causal wording or unsolicited support offer. Historical verdict unchanged."
  - "2026-09-30 purchase-lane extension v6: grows 1 turn to 3 with a no-shipment confirmation follow-up and a thanks closure. Pre-existing expectations gain explicit turnIndex 0 because un-indexed expectations evaluate the final turn."
  - "R05 oracle revision v3 to v4, 2026-09-25: Remove obsolete authorized-order-read prohibition; retain protected effects and authentication boundaries. Historical runs retain their original verdicts; rerun only explicitly selected cases on these revised bytes."
  - "R05 oracle revision v1 to v2, 2026-09-21, gift/campaign review correction 3. Rubric now requires natural Spanish with no internal-code citations and states that approval alone never proves posting. Threshold and hard severity kept. Old v1 runs preserved; baseline and candidate must rerun on this v2 contract."
  - "R05 oracle revision v2 to v3, 2026-09-22, extractor-context-completion package section C: generic credit mechanism is not confirmed account posting, so choosing/discretionary-use/recipient purpose claims now fail without supporting evidence (same ban as the card and campaign contracts). Explicit host choice stays required; dispatch-date, tracking, cash/bank, and posting bans unchanged. Threshold and hard severity kept. Positive/negative calibration examples live in the Lane C review report only; they do not prove live judge consistency."
  - "2026-09-30 LIVE-PURCHASE merge v7: absorbed live_behavior.gift_credit_pending_payment_stays_pending into this carrier; every structural and text_semantic assertion kept with renumbered turnIndex (gift-credit-approved: T0->M0,T1->M1,T2->M4; gift-credit-pending: T0->M2,T1->M3,T2->M4). Absorbed source files deleted; turn fixtures/phones preserved per turn."
