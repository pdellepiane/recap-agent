template: template.base-live
id: live_behavior.s4-injected-renderer-prose-fails
suite: live_behavior_regression
version: 1
description: S4/D6 full-context provenance control through live Lambda. A genuine Miraflores provider card must deliver with verified output origin and the correct card identity; reference-serializer parity means injected or drifted renderer prose cannot verify itself.
tags: [live, behavior, provider-selection, reference, location, provenance, s4]
targetModes: [live_lambda]
backendFixture:
  scenario: provider-miraflores-option
inputs:
  - text: Quiero la opción que está en Miraflores.
    sessionId: live-s4-renderer-provenance-session
    backendFixture:
      scenario: provider-miraflores-option
seedPlan:
  current_node: recomendar
  event_type: boda
  location: Lima
  guest_range: 51-100
  active_need_category: Catering
  vendor_category: Catering
  preferences: [comida japonesa]
  hard_constraints: []
  provider_needs:
    - category: Catering
      status: shortlisted
      preferences: [comida japonesa]
      hard_constraints: []
      missing_fields: []
      recommended_provider_ids: [90, 109]
      recommended_providers:
        - id: 90
          title: Opción Esencial
          category: Catering
          location: Miraflores
          priceLevel: low
          reason: alternativa ubicada en Miraflores
          serviceHighlights: []
          termsHighlights: []
        - id: 109
          title: EDO Sushi Bar
          category: Catering
          location: Barranco
          priceLevel: high
          reason: alternativa ubicada en Barranco
          serviceHighlights: []
          termsHighlights: []
      selected_provider_ids: []
      selected_provider_hints: []
notes:
  - "B4 S4 2026-09-14: genuine provider-card world reused from the Miraflores reference fixture; no backend mutation, no new search. Output-origin verification is enforced by the live gate on every turn (missing/mismatch/generation_failed fails the case); no expectation type exists for origin evidence, so provenance is asserted here through selected-identity state plus the semantic card check."
  - "An injected renderer that appends, removes, reorders or rewrites prose, or alters provider title, URL, id or match label, must fail origin verification instead of validating itself. This case is the genuine-card positive control: correct snapshot identity must still deliver."
expectations:
  - id: s4-miraflores-card-selected
    type: plan_field_subset
    path: provider_needs
    expected:
      - category: Catering
        selected_provider_ids: [90]
    severity: hard
  - id: s4-no-new-search-no-close
    type: tool_usage
    mustNotCall:
      - search_providers_from_plan
      - search_providers_by_query_intent
      - finish_plan
    severity: hard
  - id: s4-genuine-card-correct
    type: text_semantic
    rubric: >-
      The retained shortlist shows Opción Esencial in Miraflores and EDO Sushi Bar in Barranco. Pass only if the response selects or clearly confirms Opción Esencial from the location reference, preserves the catering need, and presents the card with its snapshot identity intact (title Opción Esencial, Miraflores location). It must not ask which provider is in Miraflores, run a new search, select the Barranco provider, append unrelated promotional prose, or alter the provider title, location or link. The response must be natural and entirely in Spanish except for proper names, literal values, URLs, addresses, numbers, and codes.
    minScore: 0.9
    requireJudge: true
    severity: hard
budget:
  maxTurns: 1
  estimatedPromptTokensPerTurn: 1800
  estimatedCompletionTokensPerTurn: 350
