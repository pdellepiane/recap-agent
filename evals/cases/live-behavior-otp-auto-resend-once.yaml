template: template.base-live
id: live_behavior.otp_nondelivery_auto_resends_once
suite: live_behavior_regression
version: 2
description: Version 2 supersedes the v1 auto-resend contract under the user-approved one-shot OTP policy (plan revision 2, S06). The first missing-code report now terminates OTP recovery and hands off to human support with no resend. Incident ID retained.
tags: [live, behavior, authentication, otp, nondelivery, reported-interaction]
targetModes: [live_lambda]
backendFixture:
  scenario: s02-otp-nondelivery
inputs:
  - text: No me llega ningún código.
    channel: whatsapp
    contactPhone: "+51900000904"
    sessionId: live-otp-nondelivery-auto-resend-session
seedPlan:
  current_node: resolver_consultas_informativas
  contact_email: fallback@example.invalid
  user_auth:
    status: code_requested
    email: fallback@example.invalid
    token: null
    token_expires_at: null
    last_error: null
    requested_at: "2026-08-24T21:18:00.000Z"
    failed_code_attempts: 0
    otp_send_attempts: 1
    otp_non_delivery_reports: 0
    awaiting_phone_confirmation: false
    auth_method: null
  information_state:
    resume_node: deteccion_intencion
    pending_requests:
      - requestId: information-1
        kind: purchase
        resource: gift_purchases
        query: Revisar el estado del regalo pagado por la persona.
        orderId: null
        aspects: [summary, payment_status]
        sensitiveFields: []
        authAction: none
    selection_candidates: []
expectations:
  - id: first-nondelivery-enters-human-handoff
    type: node_transition
    to: solicitar_agente_humano
    severity: hard
  - id: first-nondelivery-hands-off-without-another-code-operation
    type: tool_usage
    mustCall: [request_human_takeover]
    mustNotCall: [request_user_login_code, verify_user_login_code]
    severity: hard
  - id: handoff-is-persisted
    type: plan_field_equals
    path: human_escalation.status
    expected: requested
    severity: hard
  - id: protected-query-remains-pending-after-handoff
    type: plan_field_subset
    path: information_state.pending_requests
    expected:
      - kind: purchase
        resource: gift_purchases
        query: Revisar el estado del regalo pagado por la persona.
    severity: hard
  - id: first-nondelivery-handoff-language-has-no-resend-loop
    type: text_semantic
    rubric: >-
      This is the first report that the one-time code did not arrive during a protected purchase query under the one-shot OTP policy. Pass only if the assistant says in natural Spanish that human support has now been requested and leaves the conversation with that team. It must not resend a code, ask whether to resend, request another email, repeat inbox instructions, claim authentication succeeded, lose the pending purchase question, or say that a new code is on its way.
    minScore: 0.9
    requireJudge: true
    severity: hard
budget:
  maxTurns: 1
  estimatedPromptTokensPerTurn: 1800
  estimatedCompletionTokensPerTurn: 300
