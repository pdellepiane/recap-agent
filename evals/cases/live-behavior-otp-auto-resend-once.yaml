template: template.base-live
id: live_behavior.otp_nondelivery_auto_resends_once
suite: live_behavior_regression
version: 5
description: Version 2 supersedes the v1 auto-resend contract under the user-approved one-shot OTP policy (plan revision 2, S06). The first missing-code report now terminates OTP recovery and hands off to human support with no resend. Incident ID retained.
tags: [ live, behavior, authentication, otp, nondelivery, reported-interaction ]
targetModes: [ live_lambda ]
backendFixture:
  scenario: s02-otp-nondelivery
inputs:
  - text: No me llega ningún código.
    channel: whatsapp
    contactPhone: "+51900000904"
    sessionId: live-otp-nondelivery-auto-resend-session
    backendFixture:
      scenario: s02-otp-nondelivery
  - text: Perdona, ¿me repites lo último que me dijiste?
    channel: whatsapp
    contactPhone: "+51900000904"
    sessionId: live-otp-nondelivery-auto-resend-session
    backendFixture:
      scenario: s02-otp-nondelivery
  - text: Gracias, eso era todo.
    channel: whatsapp
    contactPhone: "+51900000904"
    sessionId: live-otp-nondelivery-auto-resend-session
    backendFixture:
      scenario: s02-otp-nondelivery
seedPlan:
  current_node: resolver_consultas_informativas
  contact_email: fallback@example.invalid
  user_auth:
    status: code_requested
    email: fallback@example.invalid
    token: null
    token_expires_at: null
    last_error: null
    requested_at: "2026-08-24T21:18:00.000Z"
    failed_code_attempts: 0
    otp_send_attempts: 1
    otp_non_delivery_reports: 0
    awaiting_phone_confirmation: false
    auth_method: null
  information_state:
    resume_node: deteccion_intencion
    pending_requests:
      - requestId: information-1
        kind: purchase
        resource: gift_purchases
        query: Revisar el estado del regalo pagado por la persona.
        orderId: null
        aspects: [ summary, payment_status ]
        sensitiveFields: []
        authAction: none
    selection_candidates: []
notes:
  - "IMGMISC lane merge surgery 2026-09-30: extended 1 to 3 turns with a repeat-from-history continuity turn and a thanks closure; existing expectations pinned to turn 0 with rubric bytes unchanged. Recall/closure tool pins omit request_human_takeover because turn 0 already hands off."
  - "Merge 2026-09-30: recall + thanks semantics raised 0.8 to 0.9 to honor the B fixture-oracle contract (all semantics in this case judge at 0.9); rubric bytes unchanged."
expectations:
  - id: first-nondelivery-hands-off-without-another-code-operation
    turnIndex: 0
    type: tool_usage
    mustNotCall: [ request_user_login_code, verify_user_login_code ]
    severity: hard
  - id: handoff-is-persisted
    turnIndex: 0
    type: plan_field_equals
    path: human_escalation.status
    expected: requested
    severity: hard
  - id: nondelivery-handoff-effect
    turnIndex: 0
    type: fixture_effect_count
    operation: handoff.write
    expectedAttempts: 1
    expectedSuccesses: 1
    expectedReplays: 0
    severity: hard
  - id: recall-performs-no-new-effect
    type: tool_usage
    mustCall: []
    mustNotCall:
      - auth_by_phone
      - request_user_login_code
      - verify_user_login_code
      - guest_rsvp
      - create_quote_request
      - finish_plan
    turnIndex: 1
    severity: hard
  - id: thanks-performs-no-new-effect
    type: tool_usage
    mustCall: []
    mustNotCall:
      - auth_by_phone
      - request_user_login_code
      - verify_user_login_code
      - guest_rsvp
      - create_quote_request
    turnIndex: 2
    severity: hard
budget:
  maxTurns: 3
  estimatedPromptTokensPerTurn: 1800
  estimatedCompletionTokensPerTurn: 300
scorers:
  - id: expectation-core
    type: expectation_pass_rate
    weight: 1
