template: template.base-live
id: live.faq_kb_sources_official_and_atc
suite: live_faq_kb_sources
version: 4
description: FAQ retrieval answers public commission and gift-claim questions from official Tawk FAQ articles without provider search. Raw ATC response templates are excluded. Includes a gift-damage follow-up and a thanks closure.
tags:
  - live
  - faq
  - knowledge-base
inputs:
  - text: "Necesito dos datos de FAQ: ¿qué comisión cobra Sin Envolturas si un invitado paga con tarjeta? Además, si tengo un problema con un regalo de mi web, ¿estoy obligado a comprarlo o debo reclamar con la marca?"
  - text: El regalo de un invitado llegó dañado, ¿reclamo con la marca o con ustedes?
  - text: Gracias, eso era todo.
expectations:
  - id: faq-knowledge-retrieval-called
    type: tool_usage
    mustCall: []
    mustNotCall:
      - search_providers_from_plan
      - search_providers_by_keyword
      - search_providers_by_category_location
      - get_provider_detail
    maxTotalCalls: 2
    turnIndex: 0
    severity: hard
  - id: no-provider-results
    type: provider_result_count
    max: 0
    turnIndex: 0
    severity: hard
  - id: official-tawk-commission-signal
    type: text_contains
    allOf:
      - tarjeta
      - tarjetas extranjeras
    regex:
      - '3\.70% \+ IGV\s*/\s*IVA'
      - '0\.40 USD \+ IGV\s*/\s*IVA'
    turnIndex: 0
    severity: hard
  - id: official-faq-gift-claim-signal
    type: text_contains
    regex:
      - '(?:[Nn]o\s+(?:est[áa]s|est[aá]|hay|tienes|debes|te\s+corresponde)|[Nn]o\s+es|[Ss]in\s+obligaci[oó]n)[^.!?\n]*(?:obligad[oa]|obligatori[oa]|compr(?:ar|arlo)?|adquirir|hacer\s+la\s+compra|realizar\s+la\s+compra|regalo)'
      - '(?:reclamo|reclamar|garant[ií]a|problema|inconveniente)[^.!?\n]*(?:marca(?:\s+del\s+producto)?|producto|Shop|tienda)|(?:marca(?:\s+del\s+producto)?|producto|Shop|tienda)[^.!?\n]*(?:reclamo|reclamar|garant[ií]a|problema|inconveniente)'
    turnIndex: 0
    severity: hard
  - id: no-kb-missing-fallback
    type: text_not_contains
    phrases:
      - No tengo esa información específica en mi base de conocimiento
    turnIndex: 0
    severity: hard
  - id: turn1-knowledge-retrieval-again
    type: tool_usage
    mustCall: []
    mustNotCall:
      - search_providers_from_plan
      - search_providers_by_keyword
      - search_providers_by_category_location
      - get_provider_detail
    maxTotalCalls: 2
    turnIndex: 1
    severity: hard
  - id: turn1-no-provider-results
    type: provider_result_count
    max: 0
    turnIndex: 1
    severity: hard
  - id: turn2-thanks-closes-quietly
    type: tool_usage
    mustCall: []
    mustNotCall:
      - search_providers_from_plan
      - search_providers_by_keyword
      - search_providers_by_category_location
      - get_provider_detail
      - guest_rsvp
    turnIndex: 2
    severity: hard
  - id: three-turn-budget
    type: budget_constraints
    maxTurns: 3
    maxToolCalls: 6
notes:
  - "2026-10-02 audit: source contract now excludes raw ATC response samples; historical case ID retained to preserve run references."
  - "SUPPORT lane merge surgery 2026-09-30: extended 1 to 3 turns with a gift-damage claim follow-up and a thanks closure; existing expectations pinned to turn 0; turn 0 semantic now requires the judge."
