template: template.base-live
id: live_behavior.rsvp_tia_niur_ambiguous_clarifies
suite: live_behavior_regression
version: 1
description: Tia-Niur class gap 1. Same-day follow-up with an ambiguous event reference across two pending invitations must clarify, never auto-select the newest event.
tags: [live, behavior, rsvp, multi-event, disambiguation, reported-interaction, tia-niur]
targetModes: [live_lambda]
inputs:
  - text: Hola, quiero confirmar mi asistencia al evento
    channel: whatsapp
    contactPhone: "+51941438999"
    sessionId: live-rsvp-tia-niur-ambiguous-session
backendFixture:
  scenario: rsvp-plus-one-multiple-pending
notes:
  - "Tia-Niur diagnostic 2026-09-14 gap 1: contact holds invitations across 2 events (Boda Ana y Luis 2026-09-20, Cumpleaños Marta 2026-09-21); an ambiguous same-day reference auto-selected the newest event (wrong-event attribution, highest-harm grounding class). Synthetic fixture identity only; output must follow this world, never mutable backend data."
  - "New behavior-proving case, Packet EX1. Additive; no existing case deleted or weakened. Baseline and candidate must run on this contract."
expectations:
  - id: ambiguous-enters-rsvp-node
    type: node_transition
    to: responder_invitacion
    severity: hard
  - id: ambiguous-performs-no-mutation
    type: tool_usage
    mustCall: []
    mustNotCall: [guest_rsvp, auth_by_phone, request_user_login_code, verify_user_login_code, request_human_takeover]
    severity: hard
  - id: ambiguous-asks-bounded-selection
    type: text_semantic
    rubric: >-
      The phone lookup returns two pending invitations and the user names no event: Boda Ana y Luis with event date 2026-09-20 and Cumpleaños Marta with event date 2026-09-21. The answer must be concise, natural, and entirely in Spanish; ask exactly one bounded question naming both candidate events with their dates so the user chooses which one the confirmation applies to. It must not auto-select either event and never default to the newest, must not claim attendance was confirmed, must not blend facts across the two events, and must not ask for email or a code.
    minScore: 0.9
    requireJudge: true
    severity: hard
budget:
  maxTurns: 1
  estimatedPromptTokensPerTurn: 1500
  estimatedCompletionTokensPerTurn: 220
