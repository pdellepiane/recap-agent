template: template.base-live
id: live_behavior.concurrent_support_turns_preserve_context
suite: live_behavior_regression
version: 2
description: Claudia's overlapping card-support message and guest details must serialize before plan/history loading.
tags: [live, behavior, concurrency, continuity, identity, reported-interaction, claudia-roger]
targetModes: [live_lambda]
concurrentFirstTwoTurns: true
inputs:
  - text: Un amigo no puede usar su tarjeta de crédito para comprar un regalo. ¿Hay problemas con tarjetas?
    channel: whatsapp
    contactPhone: "+51985101461"
    sessionId: live-concurrent-support-session
    backendFixture:
      scenario: support-continuity
  - text: El nombre del invitado afectado es Roger Abanto. Y el evento es Baby Shower Catalina.
    channel: whatsapp
    contactPhone: "+51985101461"
    sessionId: live-concurrent-support-session
    backendFixture:
      scenario: support-continuity
backendFixture:
  scenario: support-continuity
expectations:
  - id: first-support-question
    type: tool_usage
    mustCall: [knowledge_base_search]
    mustNotCall: [search_providers_from_plan, auth_by_phone, request_user_login_code]
    turnIndex: 0
    severity: hard
  - id: second-turn-actually-contended
    type: trace_field_number
    path: turn_coordination.attempts
    min: 2
    turnIndex: 1
    severity: hard
  - id: second-turn-remains-support
    type: node_transition
    to: resolver_consultas_informativas
    turnIndex: 1
    severity: hard
  - id: second-turn-loads-first-turn-plan
    type: trace_field_equals
    path: previous_node
    expected: resolver_consultas_informativas
    turnIndex: 1
    severity: hard
  - id: support-detail-acknowledgment-does-not-call-backend
    type: tool_usage
    mustCall: []
    mustNotCall: [lookup_guest_events_by_phone, request_human_takeover, auth_by_phone,
      request_user_login_code, verify_user_login_code, search_providers_from_plan]
    turnIndex: 1
    severity: hard
  - id: support-detail-acknowledgment-lightweight-route
    type: trace_field_equals
    path: route_kind
    expected: information_batch
    turnIndex: 1
    severity: hard
  - id: no-restart-or-identity-overwrite-after-overlap
    type: text_semantic
    rubric: >-
      The second reply must continue the same card-payment support conversation in Spanish,
      acknowledge Roger Abanto as the affected invited purchaser and Baby Shower Catalina
      as the user-reported event. Briefly acknowledge both supplied references in that same
      support context. It must not address the channel
      user as Roger, restart with a generic welcome, switch to provider planning, repeat the
      entire payment explanation, perform a backend lookup, request human help, or claim a
      verified purchase, verified invitation, or email/OTP prerequisite.
    minScore: 0.9
    requireJudge: true
    turnIndex: 1
    severity: hard
notes:
  - "R05 v2 (2026-09-17, actionable-answer package Lane B): removed the mandatory kept-open recital. Old defect: the rubric required saying the same support query is being kept for continuation, grading process narration instead of the useful-answer behavior. New acceptance keeps identity/context retention and the no-unnecessary-lookup/no-mutation checks; the supplied references only need brief acknowledgment in the same support context. The expectation formerly named support-detail-acknowledgment-is-deterministic is renamed support-detail-acknowledgment-lightweight-route because the old name prescribed the implementation instead of evidencing behavior; the structural check itself is unchanged. Threshold and hard severity kept; no threshold reduction. Old v1 runs preserved; baseline and candidate must rerun on this v2 contract."
budget:
  maxTurns: 2
  estimatedPromptTokensPerTurn: 1700
  estimatedCompletionTokensPerTurn: 220
