template: template.base-live
id: live_behavior.concurrent_support_turns_preserve_context
suite: live_behavior_regression
version: 4
description: Claudia's overlapping card-support message and guest details must serialize before plan/history loading.
tags: [live, behavior, concurrency, continuity, identity, reported-interaction, claudia-roger]
targetModes: [live_lambda]
concurrentFirstTwoTurns: true
inputs:
  - text: Un amigo no puede usar su tarjeta de crédito para comprar un regalo. ¿Hay problemas con tarjetas?
    channel: whatsapp
    contactPhone: "+51985101461"
    sessionId: live-concurrent-support-session
    backendFixture:
      scenario: support-continuity
  - text: El nombre del invitado afectado es Roger Abanto. Y el evento es Baby Shower Catalina.
    channel: whatsapp
    contactPhone: "+51985101461"
    sessionId: live-concurrent-support-session
    backendFixture:
      scenario: support-continuity
backendFixture:
  scenario: support-continuity
expectations:
  - id: first-support-question
    type: tool_usage
    mustCall: [knowledge_base_search]
    mustNotCall: [search_providers_from_plan, auth_by_phone, request_user_login_code]
    turnIndex: 0
    severity: hard
  - id: first-support-question-answered
    type: text_semantic
    rubric: >-
      The user asks whether there are known problems with card payments for a gift purchase. The
      answer must be concise, natural, and entirely in Spanish; address the card-support question
      from the available knowledge without switching to provider planning, without claiming a
      verified purchase or a verified invitation, and without asking for email or an OTP.
    minScore: 0.9
    requireJudge: true
    turnIndex: 0
    severity: hard
  - id: second-turn-remains-support
    type: fixture_effect_count
    operation: rsvp.write
    expectedAttempts: 0
    expectedSuccesses: 0
    expectedReplays: 0
    turnIndex: 1
    severity: hard
  - id: second-turn-loads-first-turn-plan
    type: fixture_effect_count
    operation: handoff.write
    expectedAttempts: 0
    expectedSuccesses: 0
    expectedReplays: 0
    turnIndex: 1
    severity: hard
  - id: support-detail-acknowledgment-does-not-call-backend
    type: tool_usage
    mustCall: []
    mustNotCall: [lookup_guest_events_by_phone, request_human_takeover, auth_by_phone,
      request_user_login_code, verify_user_login_code, search_providers_from_plan]
    turnIndex: 1
    severity: hard
  - id: support-detail-acknowledgment-lightweight-route
    type: fixture_effect_count
    operation: provider.quote.write
    expectedAttempts: 0
    expectedSuccesses: 0
    expectedReplays: 0
    turnIndex: 1
    severity: hard
  - id: no-restart-or-identity-overwrite-after-overlap
    type: text_semantic
    rubric: >-
      The second reply must continue the same card-payment support conversation in Spanish.
      Maintaining the known card problem is substantive: the reply must keep the card-payment
      topic and must not ask what problem needs reporting when that problem is already known.
      Briefly acknowledging the supplied references in that same support context suffices;
      repeating every identifying detail is optional. It must not address the channel
      user as Roger, restart with a generic welcome, switch to provider planning, repeat the
      entire payment explanation, perform a backend lookup, request human help, or claim a
      verified purchase, verified invitation, or email/OTP prerequisite. No technical
      card-rejection knowledge absent from the fixture is required.
    minScore: 0.9
    requireJudge: true
    turnIndex: 1
    severity: hard
notes:
  - "R05 v4 (2026-09-17, failure-only landing): maintaining the known card topic is substantive and re-asking the known problem fails as a usability defect; repeating every identifying detail is optional; no fixture-absent technical knowledge required. Old defect: the rubric demanded both references be acknowledged while saying nothing about the already-known problem, so a reply that kept the names but re-asked the problem passed. Threshold and hard severity kept; no threshold reduction. Old v3 runs preserved; baseline and candidate must rerun on this v4 contract."
  - "R05 v2 (2026-09-17, actionable-answer package Lane B): removed the mandatory kept-open recital. Old defect: the rubric required saying the same support query is being kept for continuation, grading process narration instead of the useful-answer behavior. New acceptance keeps identity/context retention and the no-unnecessary-lookup/no-mutation checks; the supplied references only need brief acknowledgment in the same support context. The expectation formerly named support-detail-acknowledgment-is-deterministic is renamed support-detail-acknowledgment-lightweight-route because the old name prescribed the implementation instead of evidencing behavior; the structural check itself is unchanged. Threshold and hard severity kept; no threshold reduction. Old v1 runs preserved; baseline and candidate must rerun on this v2 contract."
  - "R05 v3 (2026-09-17, support assessment hardening items 5 and 8): the scheduler retry count, node, previous-node, and route pins are replaced with observable behavior. Old defects: second-turn-actually-contended graded customer quality by a required scheduler retry count (turn_coordination.attempts >= 2); second-turn-remains-support, second-turn-loads-first-turn-plan, and support-detail-acknowledgment-lightweight-route pinned internal node_transition, previous_node, and route_kind telemetry, so a correct overlapping reply composed through any routing failed structurally. New acceptance: overlapping execution is proved by the concurrentFirstTwoTurns harness with the retained coordination evidence, while turn 1 shows zero RSVP, handoff, and provider-quote effects from receipts (fixture_effect_count 0/0/0 hard on each) together with the retained no-backend tool evidence and the identity-preserving semantic judge; persisted context is evidenced by that judge plus answering from retained references without fresh reads. Expectation ids are retained for ledger and run continuity; only their types changed. The scheduler attempt telemetry is removed as customer quality and stays a diagnostic concern only. Turn 0 gains a hard semantic judge (first-support-question-answered, 0.9) so the actionable card-support question is covered instead of inferred from the final reply; this adds one judge call to the panel budget. Threshold and hard severity kept; no threshold reduction. Old v2 runs preserved; baseline and candidate must rerun on this v3 contract."
budget:
  maxTurns: 2
  estimatedPromptTokensPerTurn: 1700
  estimatedCompletionTokensPerTurn: 220
