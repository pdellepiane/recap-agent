template: template.base-live
id: live_behavior.rsvp_trusted_phone_reports_no_pending
suite: live_behavior_regression
version: 1
description: A clear RSVP decision uses the trusted channel phone and distinguishes no associated invitations from no pending invitations.
tags: [live, behavior, rsvp, attendance, trusted-phone, agent-api]
targetModes: [live_lambda]
inputs:
  - text: Sí, confirmo que asistiré a la invitación pendiente.
    channel: whatsapp
    contactPhone: "+12025550100"
    sessionId: live-rsvp-trusted-phone-session
expectations:
  - id: enters-rsvp-node
    type: node_transition
    to: responder_invitacion
    severity: hard
  - id: reads-user-level-invitations-without-auth
    type: tool_usage
    mustCall: [lookup_rsvp_invitations]
    mustNotCall: [guest_rsvp, auth_by_phone, request_user_login_code, verify_user_login_code]
    severity: hard
  - id: records-rsvp-route
    type: trace_field_equals
    path: route_kind
    expected: rsvp
    severity: hard
  - id: reports-no-associated-invitation-outcome
    type: text_semantic
    rubric: >-
      This case uses a reserved synthetic phone number for which the user-level lookup has no associated invitations at all. The response must say naturally and entirely in Spanish that no invitation is associated with the current number. It must not use the misleading statement that there are merely no pending invitations, request email or a one-time code, expose internal values, or claim that attendance was registered. It may offer human help if the guest expected an invitation.
    minScore: 0.9
    requireJudge: true
    severity: hard
budget:
  maxTurns: 1
  estimatedPromptTokensPerTurn: 1400
  estimatedCompletionTokensPerTurn: 250
