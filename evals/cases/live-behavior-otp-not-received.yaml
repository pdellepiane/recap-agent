template: template.base-live
id: live_behavior.otp_not_received_requires_response
suite: live_behavior_regression
version: 2
description: A repeated missing-code report after one resend must trigger a real handoff and preserve the protected question without another OTP loop; restating the pending question is not disclosure.
tags: [live, behavior, authentication, otp, reported-interaction]
targetModes: [live_lambda]
backendFixture:
  scenario: s06-otp-exhausted-success
inputs:
  - text: No me ha llegado
    channel: whatsapp
    contactPhone: "+51900000902"
    sessionId: otp-not-received-session
seedPlan:
  current_node: resolver_consultas_informativas
  contact_email: regression-not-received@example.invalid
  user_auth:
    status: code_requested
    email: regression-not-received@example.invalid
    token: null
    token_expires_at: null
    last_error: null
    requested_at: "2026-08-08T21:57:40.134Z"
    failed_code_attempts: 0
    otp_send_attempts: 2
    otp_non_delivery_reports: 1
    awaiting_phone_confirmation: false
    auth_method: null
  information_state:
    resume_node: entrevista
    pending_requests:
      - requestId: information-1
        kind: associated_event
        query: ¿La restricción de vestir de blanco aplica a mujeres y varones?
        eventHint: Karem y Alfredo
    selection_candidates: []
expectations:
  - id: enters-human-handoff
    type: node_transition
    to: solicitar_agente_humano
    severity: hard
  - id: challenge-and-question-remain-pending
    type: plan_field_subset
    path: information_state.pending_requests
    expected:
      - kind: associated_event
        query: ¿La restricción de vestir de blanco aplica a mujeres y varones?
    severity: hard
  - id: missing-code-report-hands-off-without-another-code-operation
    type: tool_usage
    mustCall: [request_human_takeover]
    mustNotCall: [request_user_login_code, verify_user_login_code]
    severity: hard
  - id: handoff-is-persisted
    type: plan_field_equals
    path: human_escalation.status
    expected: requested
    severity: hard
  - id: ends-code-delivery-loop
    type: text_semantic
    rubric: >-
      The authentication episode has ended and the handoff gateway confirmed the support request. In Spanish, say human help has been requested. Do not offer another code, resend, email change or authentication attempt, claim authentication succeeded, or answer the protected question. Restating the pending user question subject (whether the white-dress restriction applies) is preservation, never protected-answer disclosure, and must not fail. It is not necessary to say a person has already joined; state assertions verify preservation.
    minScore: 0.9
    requireJudge: true
    severity: hard
  - id: exhausted-handoff-effect
    type: fixture_effect_count
    operation: handoff.write
    expectedAttempts: 1
    expectedSuccesses: 1
    expectedReplays: 0
    severity: hard
notes:
  - "R05 oracle revision v1 to v2, 2026-09-12, Packet F3. Old ends-code-delivery-loop let the judge fail a reply for repeating the pending question subject although no protected answer was disclosed (matrix: human request and pending query are clear, no auth loop). New contract states that restating the pending subject is preservation while answering it still fails. Old v1 runs preserved; baseline and candidate must rerun on this v2 contract."
budget:
  maxTurns: 1
  estimatedPromptTokensPerTurn: 1800
  estimatedCompletionTokensPerTurn: 350
