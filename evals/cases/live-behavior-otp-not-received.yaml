template: template.base-live
id: live_behavior.otp_not_received_requires_response
suite: live_behavior_regression
version: 1
description: A missing-code report during an active OTP challenge must receive an actionable response and preserve the protected question.
tags: [live, behavior, authentication, otp, reported-interaction]
targetModes: [live_lambda]
inputs:
  - text: No me ha llegado
    channel: whatsapp
    sessionId: otp-not-received-session
seedPlan:
  current_node: resolver_consultas_informativas
  contact_email: regression-not-received@example.invalid
  user_auth:
    status: code_requested
    email: regression-not-received@example.invalid
    token: null
    token_expires_at: null
    last_error: null
    requested_at: "2026-08-08T21:57:40.134Z"
    failed_code_attempts: 0
    awaiting_phone_confirmation: false
    auth_method: null
  information_state:
    resume_node: entrevista
    pending_requests:
      - requestId: information-1
        kind: associated_event
        query: ¿La restricción de vestir de blanco aplica a mujeres y varones?
        eventHint: Karem y Alfredo
    selection_candidates: []
expectations:
  - id: remains-in-information-flow
    type: node_transition
    to: resolver_consultas_informativas
    severity: hard
  - id: challenge-and-question-remain-pending
    type: plan_field_subset
    path: information_state.pending_requests
    expected:
      - kind: associated_event
        query: ¿La restricción de vestir de blanco aplica a mujeres y varones?
    severity: hard
  - id: missing-code-report-is-not-suppressed-or-verified
    type: tool_usage
    mustNotCall: [verify_user_login_code]
    severity: hard
  - id: offers-actionable-code-delivery-recovery
    type: text_semantic
    rubric: >-
      The user says the one-time code has not arrived while an active challenge protects an event question. Pass only if the assistant responds in natural Spanish, acknowledges that the code is still needed, gives concise delivery guidance, and offers an actionable choice to resend the code or change the email. It must not suppress the turn, ask the user to enter a code they do not have, claim authentication succeeded, or lose the pending event question.
    minScore: 0.9
    requireJudge: true
    severity: hard
budget:
  maxTurns: 1
  estimatedPromptTokensPerTurn: 1800
  estimatedCompletionTokensPerTurn: 350
