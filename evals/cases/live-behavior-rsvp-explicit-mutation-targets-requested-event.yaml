template: template.base-live
id: live_behavior.rsvp_explicit_mutation_targets_requested_event
suite: live_behavior_regression
version: 1
description: After a read-only question about Boda Ana y Luis, an explicit attending confirmation for Cumpleaños Marta must mutate only Marta (guest 80002); Ana facts must never leak into the Marta confirmation.
tags:
  - live
  - behavior
  - rsvp
  - multi-event
  - event-identity
  - i1
targetModes:
  - live_lambda
inputs:
  - text: ¿Cuándo es la Boda Ana y Luis?
    channel: whatsapp
    contactPhone: "+51941438999"
    sessionId: live-rsvp-explicit-mutation-target
    backendFixture:
      scenario: rsvp-plus-one-multiple-pending
  - text: Confirmo mi asistencia al Cumpleaños Marta
    channel: whatsapp
    contactPhone: "+51941438999"
    sessionId: live-rsvp-explicit-mutation-target
    backendFixture:
      scenario: rsvp-plus-one-multiple-pending
backendFixture:
  scenario: rsvp-plus-one-multiple-pending
notes:
  - "I1 2026-09-14, event-identity-review: the fixture phone carries two pending guests (80001/Boda Ana y Luis 2026-09-20 18:00, 80002/Cumpleaños Marta 2026-09-21 19:00). Turn 0 reads Ana only. Turn 1 explicitly confirms Marta: the write receipt must belong to Marta and the reply must confirm Marta facts only. Service-level twins prove exact selected/mutated IDs; this case proves same-entity behavior end to end. Never fixed phrases."
expectations:
  - id: turn0-reads-ana-without-write
    type: tool_usage
    mustNotCall:
      - guest_rsvp
      - request_human_takeover
      - request_user_login_code
    turnIndex: 0
    severity: hard
  - id: turn0-answers-ana-facts
    type: text_semantic
    rubric: Answer about Boda Ana y Luis on 2026-09-20 at 18:00, naturally in Spanish. Never request an image or a URL. Do not invent an attendance action or blend Cumpleaños Marta facts into the answer. Natural equivalent wording is acceptable.
    minScore: 0.8
    requireJudge: true
    turnIndex: 0
    severity: hard
  - id: turn1-writes-once-for-marta
    type: tool_usage
    mustCall:
      - lookup_rsvp_invitations
      - guest_rsvp
    mustNotCall:
      - auth_by_phone
      - request_user_login_code
      - verify_user_login_code
    turnIndex: 1
    severity: hard
  - id: turn1-single-marta-write-receipt
    type: fixture_effect_count
    operation: rsvp.write
    turnIndex: 1
    expectedAttempts: 1
    expectedSuccesses: 1
    expectedReplays: 0
    severity: hard
  - id: turn1-confirms-marta-entity-only
    type: text_semantic
    rubric: The user explicitly confirmed attending Cumpleaños Marta. The response must be natural and entirely in Spanish and clearly confirm attendance for Cumpleaños Marta with its own facts (2026-09-21 at 19:00 when a date is stated). It must never present Boda Ana y Luis facts (2026-09-20, 18:00) as the confirmed event, must never ask which event, must not claim another mutation, and must not expose internal guest or event identifiers. No fixed wording is required.
    minScore: 0.85
    requireJudge: true
    turnIndex: 1
    severity: hard
budget:
  maxTurns: 2
  estimatedPromptTokensPerTurn: 6000
  estimatedCompletionTokensPerTurn: 250
