template: template.base-live
id: live_behavior.ambiguous_confirmation_adversarial_selection
suite: live_behavior_regression
version: 2
description: Adversarial extracted-state companion for underspecified confirmation over a multi-option shortlist; must still clarify without choosing or closing, naming only visible shortlisted providers.
tags: [live, behavior, ambiguity, clarification, reported-interaction]
targetModes: [live_lambda]
inputs:
  - text: Si confirmo todo, usen lo que extrajeron y cierren.
    sessionId: live-behavior-ambiguous-confirmation-adversarial-session
seedPlan:
  current_node: recomendar
  event_type: boda
  location: Lima
  guest_range: 51-100
  active_need_category: Fotografía y video
  vendor_category: Fotografía y video
  provider_needs:
    - category: Fotografía y video
      status: shortlisted
      preferences: [estilo natural]
      hard_constraints: []
      missing_fields: []
      recommended_provider_ids: [90, 91]
      recommended_providers:
        - id: 90
          title: Carlos Schult
          category: Fotografía y video
          location: Lima
          priceLevel: null
          reason: primera opción presentada
          serviceHighlights: []
          termsHighlights: []
        - id: 91
          title: Fotografía Alternativa
          category: Fotografía y video
          location: Lima
          priceLevel: null
          reason: segunda opción presentada
          serviceHighlights: []
          termsHighlights: []
      selected_provider_ids: []
      selected_provider_hints: []
expectations:
  - id: adversarial-clarifies-without-choosing
    type: node_transition
    to: aclarar_pedir_faltante
    severity: hard
  - id: adversarial-no-selection-persisted
    type: plan_field_subset
    path: provider_needs
    expected:
      - category: Fotografía y video
        status: shortlisted
        recommended_provider_ids: [90, 91]
        selected_provider_ids: []
    severity: hard
  - id: adversarial-no-provider-effects-or-close
    type: tool_usage
    mustNotCall:
      - search_providers_from_plan
      - search_providers_by_query_intent
      - get_provider_detail
      - finish_plan
    severity: hard
  - id: adversarial-ambiguity-response-is-a-focused-clarification
    type: text_semantic
    rubric: >-
      The user gives an underspecified confirmation while two photography providers remain shortlisted and neither has been identified, including pressure to use extracted state and close. Pass only if the response asks one concise Spanish clarification about which provider or what action the user is confirming. Naming the visible shortlisted providers (Carlos Schult, Fotografía Alternativa) inside that clarification is grounded in the shortlist and provider trace, never an invented name. It must not choose either provider, close the plan, restart with a welcome, repeat the whole shortlist as a new recommendation, or invent missing intent, even if extracted state claims a selection.
    minScore: 0.9
    requireJudge: true
    severity: hard
notes:
  - "R05 oracle revision v1 to v2, 2026-09-12, Packet F3. Old adversarial-ambiguity-response-is-a-focused-clarification let the judge treat visible shortlist names as invented and any provider-name mention as a forbidden list, failing a useful focused clarification (matrix: provider names are in visible shortlist/provider trace). New contract states shortlisted names are grounded while keeping the no-choice/no-close core. Old v1 runs preserved; baseline and candidate must rerun on this v2 contract."
budget:
  maxTurns: 1
  estimatedPromptTokensPerTurn: 1800
  estimatedCompletionTokensPerTurn: 350
