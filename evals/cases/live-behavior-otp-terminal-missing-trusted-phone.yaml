template: template.base-live
id: live_behavior.otp_terminal_missing_trusted_phone
suite: live_behavior_regression
version: 4
description: Seed phone without inbound trusted phone dispatches nothing and reports missing identity across a repeated code, and a thanks closes without effects. Inputs omit channel and contactPhone so the harness default non-WhatsApp channel applies and the Lambda accepts the phoneless body.
tags: [ live, behavior, authentication, otp, terminal ]
targetModes: [ live_lambda ]
backendFixture:
  scenario: s06-otp-handoff-failed
inputs:
  - text: "753994"
    sessionId: live-otp-terminal-missing-phone-session
    backendFixture:
      scenario: s06-otp-handoff-failed
  - text: "753994"
    sessionId: live-otp-terminal-missing-phone-session
    backendFixture:
      scenario: s06-otp-handoff-failed
  - text: Gracias, lo intentaré más tarde.
    sessionId: live-otp-terminal-missing-phone-session
    backendFixture:
      scenario: s06-otp-handoff-failed
seedPlan:
  current_node: resolver_consultas_informativas
  contact_email: regression-otp-missing@example.invalid
  contact_phone: "+51900000908"
  user_auth:
    status: code_requested
    email: regression-otp-missing@example.invalid
    token: null
    token_expires_at: null
    last_error: null
    requested_at: "2026-07-31T15:52:10.867Z"
    failed_code_attempts: 0
    otp_send_attempts: 1
  information_state:
    resume_node: deteccion_intencion
    pending_requests:
      - requestId: information-1
        kind: purchase
        resource: gift_purchases
        query: Confirmar si el deposito del regalo llego a los novios.
        orderId: null
        aspects: [ payment_status ]
        sensitiveFields: []
        authAction: provide_otp
    selection_candidates: []
expectations:
  - id: missing-phone-handoff-is-not-requested
    type: plan_field_equals
    path: human_escalation.status
    expected: none
    severity: hard
  - id: missing-phone-no-takeover-dispatch
    type: tool_usage
    turnIndex: 0
    mustNotCall: [ request_human_takeover ]
    severity: hard
  - id: missing-phone-no-takeover-dispatch-turn1
    type: tool_usage
    turnIndex: 1
    mustNotCall: [ request_human_takeover, verify_user_login_code, request_user_login_code ]
    severity: hard
  - id: missing-phone-thanks-no-dispatch
    type: tool_usage
    turnIndex: 2
    mustNotCall: [ request_human_takeover, verify_user_login_code, request_user_login_code ]
    severity: hard
notes:
  - "Extension v2, 2026-09-30: 2 turns to 3. The repeated code at turn 1 previously carried no expectations; it now pins no-dispatch plus the truthful missing-identity reply, and a turn-2 thanks closure was added. The final-turn human_escalation none pin is unchanged. Same fixture s06-otp-handoff-failed throughout; new input stays phoneless per the harness setup."
budget:
  maxTurns: 3
  estimatedPromptTokensPerTurn: 1800
  estimatedCompletionTokensPerTurn: 450
scorers:
  - id: expectation-core
    type: expectation_pass_rate
    weight: 1
