template: template.base-live
id: live_behavior.otp_terminal_handoff_unknown
suite: live_behavior_regression
version: 5
description: Rejected OTP with uncertain handoff stays terminal without retry or verification loop; an attempted-but-unconfirmed handoff is truthful, a claimed success is not.
tags: [ live, behavior, authentication, otp, terminal ]
targetModes: [ live_lambda ]
backendFixture:
  scenario: s06-otp-handoff-unknown
inputs:
  - text: "753994"
    channel: whatsapp
    contactPhone: "+51900000906"
    sessionId: live-otp-terminal-unknown-session
    backendFixture:
      scenario: s06-otp-handoff-unknown
  - text: "753994"
    channel: whatsapp
    contactPhone: "+51900000906"
    sessionId: live-otp-terminal-unknown-session
    backendFixture:
      scenario: s06-otp-handoff-unknown
  - text: Ese es el codigo que me llego
    channel: whatsapp
    contactPhone: "+51900000906"
    sessionId: live-otp-terminal-unknown-session
    backendFixture:
      scenario: s06-otp-handoff-unknown
seedPlan:
  current_node: resolver_consultas_informativas
  contact_email: regression-otp-unknown@example.invalid
  contact_phone: "+51900000906"
  user_auth:
    status: code_requested
    email: regression-otp-unknown@example.invalid
    token: null
    token_expires_at: null
    last_error: null
    requested_at: "2026-07-31T15:52:10.867Z"
    failed_code_attempts: 0
    otp_send_attempts: 1
  information_state:
    resume_node: deteccion_intencion
    pending_requests:
      - requestId: information-1
        kind: purchase
        resource: gift_purchases
        query: Confirmar si el deposito del regalo llego a los novios.
        orderId: null
        aspects: [ payment_status ]
        sensitiveFields: []
        authAction: provide_otp
    selection_candidates: []
expectations:
  - id: unknown-handoff-is-not-requested
    type: plan_field_equals
    path: human_escalation.status
    expected: none
    severity: hard
  - id: unknown-handoff-no-verify-after-turn0
    type: tool_usage
    turnIndex: 1
    mustNotCall: [ verify_user_login_code, request_user_login_code, request_human_takeover ]
    severity: hard
  - id: unknown-handoff-no-effect-after-turn0
    type: tool_usage
    turnIndex: 2
    mustNotCall: [ verify_user_login_code, request_user_login_code, request_human_takeover ]
    severity: hard
  - id: unknown-handoff-effect-turn0
    type: fixture_effect_count
    operation: handoff.write
    turnIndex: 0
    expectedAttempts: 1
    expectedSuccesses: 0
    expectedReplays: 0
    severity: hard
  - id: unknown-handoff-effect-final-unchanged
    type: fixture_effect_count
    operation: handoff.write
    turnIndex: 2
    expectedAttempts: 0
    expectedSuccesses: 0
    expectedReplays: 0
    severity: hard
notes:
  - "R05 oracle revision v1 to v2, 2026-09-12, Packet F3. Old unknown-handoff-truthful-turn2 forbade saying a transfer was requested at all, so the judge treated a truthful attempted-and-unconfirmed reply as a success claim (matrix: stored outcome handoff_unknown, model truthfully says attempted and unconfirmed). New contract permits attempted language on all three turns while failing only a claimed confirmed success; an unknown outcome stays explicitly unconfirmed. Old v1 runs preserved; baseline and candidate must rerun on this v2 contract."
budget:
  maxTurns: 3
  estimatedPromptTokensPerTurn: 1800
  estimatedCompletionTokensPerTurn: 450
scorers:
  - id: expectation-core
    type: expectation_pass_rate
    weight: 1
