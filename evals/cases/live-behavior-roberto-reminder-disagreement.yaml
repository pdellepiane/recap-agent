template: template.base-live
id: live_behavior.roberto_reminder_invitation_disagreement
suite: live_behavior_regression
version: 1
description: Roberto confirms after three frontend_followup reminders but the trusted phone lookup returns empty/404. The agent acknowledges the reminder and the inability to verify now, escalates once to a human, writes no RSVP and denies nothing.
tags: [live, behavior, rsvp, reminder, reported-interaction, roberto-screenshot]
targetModes: [live_lambda]
inputs:
  - text: Si, confirmo que asistire
    channel: whatsapp
    contactPhone: "+51900000421"
    sessionId: live-roberto-mismatch-session
backendFixture:
  scenario: s04-roberto-mismatch
expectations:
  - id: mismatch-reads-invitations-without-rsvp-write
    type: tool_usage
    mustCall: [lookup_rsvp_invitations]
    mustNotCall: [guest_rsvp, auth_by_phone, request_user_login_code, verify_user_login_code]
    severity: hard
  - id: mismatch-escalates-once-to-human
    type: tool_usage
    mustCall: [request_human_takeover]
    mustNotCall: [guest_rsvp]
    severity: hard
  - id: mismatch-reply-is-truthful-without-denial
    type: text_semantic
    rubric: >-
      In Spanish, acknowledge the supplied Cumple Marcelo reminder and explain that this lookup cannot verify the invitation now. Since the fixture confirms a successful human-help request, the response may say that support was requested. It must not say attendance was registered, deny the invitation exists, or use the literal technical acronym RSVP. Ordinary Spanish words about attendance or confirmation, and quoting the supplied reminder, are allowed. No assistance link is required; any link shown must be present in the trusted fixture. Judge the candidate's claims, not phrases appearing only in context.
    minScore: 0.9
    requireJudge: true
    severity: hard
  - id: mismatch-uses-no-rsvp-vocabulary
    type: text_not_contains
    phrases: ["RSVP", "rsvp"]
    severity: hard
  - id: mismatch-attendance-unchanged
    type: plan_field_equals
    path: rsvp_state.status
    expected: none
    severity: hard
  - id: mismatch-handoff-requested
    type: plan_field_equals
    path: human_escalation.status
    expected: requested
    severity: hard
  - id: mismatch-handoff-effect
    type: fixture_effect_count
    operation: handoff.write
    expectedAttempts: 1
    expectedSuccesses: 1
    expectedReplays: 0
    severity: hard
budget:
  maxTurns: 1
  estimatedPromptTokensPerTurn: 1600
  estimatedCompletionTokensPerTurn: 300
