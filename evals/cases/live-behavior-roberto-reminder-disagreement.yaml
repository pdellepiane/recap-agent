template: template.base-live
id: live_behavior.roberto_reminder_invitation_disagreement
suite: live_behavior_regression
version: 3
description: Roberto confirms after three frontend_followup reminders but the trusted phone lookup returns empty/404. The agent acknowledges the reminder and the inability to verify now, offers human help without submitting it, writes no RSVP and denies nothing.
tags: [live, behavior, rsvp, reminder, reported-interaction, roberto-screenshot]
targetModes: [live_lambda]
inputs:
  - text: Si, confirmo que asistire
    channel: whatsapp
    contactPhone: "+51900000421"
    sessionId: live-roberto-mismatch-session
    backendFixture:
      scenario: s04-roberto-mismatch
backendFixture:
  scenario: s04-roberto-mismatch
expectations:
  - id: mismatch-reads-invitations-without-rsvp-write
    type: tool_usage
    mustCall: [lookup_rsvp_invitations]
    mustNotCall: [guest_rsvp, auth_by_phone, request_user_login_code, verify_user_login_code]
    severity: hard
  - id: mismatch-escalates-once-to-human
    type: tool_usage
    mustCall: [lookup_rsvp_invitations]
    mustNotCall: [request_human_takeover, guest_rsvp]
    severity: hard
  - id: mismatch-reply-is-truthful-without-denial
    type: text_semantic
    rubric: >-
      In Spanish, acknowledge the supplied Cumple Marcelo reminder and explain the lookup result in scoped terms. The lookup completed but returned no associated invitation, so scoped no-match language (for example No encontré una invitación asociada) passes; cannot-verify phrasing is reserved for failed or unavailable reads and is not required here. Human help was not requested on this turn, so the response may offer human support but must not claim support was requested, submitted, or is on its way. It must not say attendance was registered, deny the invitation exists globally, or use the literal technical acronym RSVP. Ordinary Spanish words about attendance or confirmation, and quoting the supplied reminder, are allowed. No assistance link is required; any link shown must be present in the trusted fixture. Judge the candidate's claims, not phrases appearing only in context.
    minScore: 0.9
    requireJudge: true
    severity: hard
  - id: mismatch-uses-no-rsvp-vocabulary
    type: text_not_contains
    phrases: ["RSVP", "rsvp"]
    severity: hard
  - id: mismatch-attendance-unchanged
    type: plan_field_equals
    path: rsvp_state.status
    expected: none
    severity: hard
  - id: mismatch-handoff-requested
    type: plan_field_equals
    path: human_escalation.status
    expected: none
    severity: hard
  - id: mismatch-handoff-effect
    type: fixture_effect_count
    operation: handoff.write
    expectedAttempts: 0
    expectedSuccesses: 0
    expectedReplays: 0
    severity: hard
notes:
  - "R05 oracle revision v1 to v2, 2026-09-21, gift/campaign package B1. Old defect: the v1 contract pinned an automatic human handoff on RSVP action plus reminder presence, treating campaign presence as escalation consent although the turn carries no explicit human-help request or accepted offer. New contract keeps the truthful no-denial reply and the zero-RSVP-write invariant, but requires zero handoff effects, human_escalation none, and an offer-not-submission rubric. Expectation ids retained for ledger and run continuity; only their content changed. Threshold and hard severity kept; no threshold reduction. Old v1 runs preserved; baseline and candidate must rerun on this v2 contract."
  - "R05 oracle revision v2 to v3, 2026-09-22, bounded-evidence Work 3: the completed-but-empty lookup now accepts scoped no-match language (No encontré una invitación asociada is not a global denial); cannot-verify phrasing is reserved for failed or unavailable reads. Spanish, no attendance-registered claim, no RSVP acronym, and human-offer-without-claim rules unchanged. Threshold and hard severity kept. NOTE: tests/b-fixture-oracles.test.ts ROBERTO_RUBRIC still pins the v2 text and must be updated to this v3 rubric (same file already carries the OTP v1-to-v2 precedent)."
budget:
  maxTurns: 1
  estimatedPromptTokensPerTurn: 1600
  estimatedCompletionTokensPerTurn: 300
