id: live_behavior.july_breadth_corporate_10
suite: live_behavior_regression
version: 1
description: "July breadth study.corporate.10: Broaden corporate audiovisual search."
tags:
  - live
  - behavior
  - july-breadth
  - corporate
  - error_recovery
targetModes:
  - live_lambda
backendFixture:
  scenario: master-provider-live-public
inputs:
  - text: Busco hologramas para evento corporativo en Lima.
    channel: whatsapp
    sessionId: live_behavior.july_breadth_corporate_10
    backendFixture:
      scenario: master-provider-live-public
  - text: Si no existen, amplía a producción audiovisual profesional.
    channel: whatsapp
    sessionId: live_behavior.july_breadth_corporate_10
    backendFixture:
      scenario: master-provider-live-public
expectations:
  - id: event-type-retained
    type: plan_field_equals
    path: event_type
    expected: corporativo
    turnIndex: 1
    severity: hard
  - id: answer-delivered
    type: text_contains
    regex:
      - "[\\s\\S]+"
    turnIndex: 1
    severity: hard
  - id: no-provider-quote-without-explicit-date
    type: fixture_effect_count
    operation: provider.quote.write
    expectedAttempts: 0
    expectedSuccesses: 0
    expectedReplays: 0
    severity: hard
  - id: no-unrequested-rsvp
    type: fixture_effect_count
    operation: rsvp.write
    expectedAttempts: 0
    expectedSuccesses: 0
    expectedReplays: 0
    severity: hard
  - id: no-unrequested-handoff
    type: fixture_effect_count
    operation: handoff.write
    expectedAttempts: 0
    expectedSuccesses: 0
    expectedReplays: 0
    severity: hard
  - id: requested-needs-retained
    type: plan_field_subset
    path: provider_needs
    expected:
      - category: Fotografía y video
    turnIndex: 1
    severity: hard
scorers:
  - id: objective-obligations
    type: expectation_pass_rate
    weight: 1
budget:
  maxTurns: 2
notes:
  - Derived from study.corporate.10, route error_recovery; prompts are
    preserved, assertions use current objective contracts, so results are not
    directly comparable to July.
  - Live public provider reads; private customer reads and all SE effects are
    mocked.
  - For selection, the selected state is checked but correctness of the first
    displayed provider identity is not independently verified. Other unscored
    semantic outcomes must not be inferred.
