notes:
  - "Synthetic foreign-number case for global E.164 intake: proves a valid +961 sender reaches RSVP lookup and write with the exact trusted split instead of a pre-validation 400."
  - "The live scorer has effect-count, tool-use, trace, plan, and semantic checks but no typed assertion for the post-write RSVP state itself. The hard one-success receipt and semantic answer check are paired with tests/rsvp-foreign-number-decline.test.ts, which proves this fixture returns the same guest/event as declining on a fresh read."
  - "RSVP extension v2 (2026-09-30): added a genuine turn-1 date question and a turn-2 thanks closure, each with hard no-write structural assertions and a hard requireJudge semantic judge grounded in the same fixture. Turn-0 expectations unchanged except explicit turnIndex 0 scoping. Old v1 runs preserved; baseline and candidate must rerun on this v2 contract."
  - "RSVP merge v3 (2026-09-30): this case now carries a 6-turn thread that fully subsumes live_behavior.rsvp_sinar_campaign_decline (turns 3-5). Every absorbed turn keeps its original hard structural assertions and hard requireJudge semantic judge, renumbered turnIndex 0->3, 1->4, 2->5 with turnN- id prefixes; turns 3-5 switch phone and fixture to the absorbed rsvp-sinar-campaign-decline world via turn-level backendFixture. Turns 0-2 unchanged. Old v2 runs preserved; baseline and candidate must rerun on this v3 contract."
