template: template.base-live
id: live_behavior.image_conversation_repeat_answered
suite: live_behavior_regression
version: 1
description: An answered image question followed by an explicit repeat request repeats the amount already stated in the thread without re-reading pixels or resetting state.
tags: [live, behavior, image, conversation-continuity, intentional-repeat, s17]
targetModes: [live_lambda]
backendFixture:
  scenario: image-clean-world
inputs:
  - text: Cuanto dice aqui?
    channel: whatsapp
    contactPhone: "+51900027804"
    sessionId: live-image-conversation-repeat-session
    image:
      data: 
      mime_type: image/png
  - text: Me lo puedes repetir por favor?
    channel: whatsapp
    contactPhone: "+51900027804"
    sessionId: live-image-conversation-repeat-session
notes:
  - "F1 2026-09-12: backendFixture scenario image-clean-world; this phone has empty initial history and empty authorized purchase results; never mutable backend data."
  - Backend image forwarding contract 2026-09-08. Synthetic voucher-style fixture rendered locally, never a customer document. Same conversation across both turns; turn 0 answers the captioned question natively, turn 1 is an intentional repeat of that delivered answer.
  - "New case v1, 2026-09-12, Packet F3. Split from live_behavior.image_conversation_continuity v3: that case covers silent-upload then an explicit retained-image question. This case covers the complementary intentional repetition path: answer first, then repeat the amount already stated in the thread. No baseline run exists; baseline and candidate must run it under this contract."
expectations:
  - id: repeat-first-turn-native-persisted
    type: tool_usage
    mustCall: [image_file_context]
    mustNotCall: [image_inspect, auth_by_phone, request_user_login_code, verify_user_login_code, request_human_takeover, guest_rsvp]
    turnIndex: 0
    severity: hard
  - id: repeat-first-turn-answered-in-spanish
    type: text_semantic
    rubric: >-
      Pass only if the assistant responds entirely in Spanish answering the caption question with the text visible in the image, including the amount. It must not confirm or approve any payment, must not claim the image proves a settled payment, must not ask the user to resend the image, and must not ask for an OTP.
    minScore: 0.8
    requireJudge: true
    turnIndex: 0
    severity: hard
  - id: repeat-no-resend-request
    type: text_not_contains
    phrases: [Puedes enviarla de nuevo, supera el tamaño permitido]
    turnIndex: 1
    severity: hard
  - id: repeat-answered-amount-from-history
    type: text_semantic
    rubric: >-
      The previous turn already stated the image amount in this thread, so this explicit repeat request must be answered from conversation history. Pass only if the assistant responds entirely in Spanish repeating the amount already stated, without re-reading pixels, without inventing new image content, without asking the user to resend any image, without confirming or approving any payment, without requesting an OTP, and without starting a planning interview from scratch.
    minScore: 0.8
    requireJudge: true
    turnIndex: 1
    severity: hard
budget:
  maxTurns: 2
  estimatedPromptTokensPerTurn: 2500
  estimatedCompletionTokensPerTurn: 300
