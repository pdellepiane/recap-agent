id: live_behavior.july_breadth_social_01_phonefixed
suite: live_behavior_regression
version: 1
description: "July breadth study.social.01: Complete anniversary catering request."
tags:
  - live
  - behavior
  - july-breadth
  - social
  - recommendation
targetModes:
  - live_lambda
backendFixture:
  scenario: master-provider-live-public
inputs:
  - text: Busco catering elegante para aniversario en Barranco, Lima, 30 personas y
      presupuesto alto.
    channel: whatsapp
    sessionId: live_behavior.july_breadth_social_01_phonefixed
    backendFixture:
      scenario: master-provider-live-public
    contactPhone: "+51900007000"
expectations:
  - id: event-type-retained
    type: plan_field_equals
    path: event_type
    expected: aniversario
    turnIndex: 0
    severity: hard
  - id: answer-delivered
    type: text_contains
    regex:
      - "[\\s\\S]+"
    turnIndex: 0
    severity: hard
  - id: no-provider-quote-without-explicit-date
    type: fixture_effect_count
    operation: provider.quote.write
    expectedAttempts: 0
    expectedSuccesses: 0
    expectedReplays: 0
    severity: hard
  - id: no-unrequested-rsvp
    type: fixture_effect_count
    operation: rsvp.write
    expectedAttempts: 0
    expectedSuccesses: 0
    expectedReplays: 0
    severity: hard
  - id: no-unrequested-handoff
    type: fixture_effect_count
    operation: handoff.write
    expectedAttempts: 0
    expectedSuccesses: 0
    expectedReplays: 0
    severity: hard
  - id: requested-needs-retained
    type: plan_field_subset
    path: provider_needs
    expected:
      - category: Catering
    turnIndex: 0
    severity: hard
  - id: recommendation-has-candidates
    type: provider_result_count
    min: 1
    turnIndex: 0
    severity: hard
  - id: recommendation-delivers-provider-link
    type: text_contains
    regex:
      - https://sinenvolturas\.com/proveedores/[\p{L}\p{N}%_-]+
    turnIndex: 0
    severity: hard
scorers:
  - id: objective-obligations
    type: expectation_pass_rate
    weight: 1
budget:
  maxTurns: 1
notes:
  - Derived from study.social.01, route recommendation; prompts are preserved,
    assertions use current objective contracts, so results are not directly
    comparable to July.
  - Live public provider reads; private customer reads and all SE effects are
    mocked.
  - For selection, the selected state is checked but correctness of the first
    displayed provider identity is not independently verified. Other unscored
    semantic outcomes must not be inferred.
