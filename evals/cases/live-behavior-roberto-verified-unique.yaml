template: template.base-live
id: live_behavior.roberto_verified_unique_rsvp_writes_once
suite: live_behavior_regression
version: 1
description: Companion to the Roberto mismatch. The same attending decision resolves to one uniquely verified invitation from trusted phone lookups, so the agent executes exactly one authorized RSVP write and reports the verified outcome.
tags: [live, behavior, rsvp, reminder, verified-invitation, roberto-screenshot]
targetModes: [live_lambda]
inputs:
  - text: Si, confirmo que asistire a Cumple Marcelo
    channel: whatsapp
    contactPhone: "+51900000422"
    sessionId: live-roberto-verified-session
backendFixture:
  scenario: s04-roberto-verified
expectations:
  - id: verified-unique-writes-rsvp-once
    type: tool_usage
    mustCall: [lookup_rsvp_invitations, guest_rsvp]
    mustNotCall: [auth_by_phone, request_user_login_code, verify_user_login_code]
    severity: hard
  - id: verified-unique-reports-verified-outcome
    type: text_semantic
    rubric: >-
      The reply must be entirely in Spanish and report the verified attending outcome for
      the literal event Cumple Marcelo from the trusted lookup result. It must not deny the
      invitation, must not claim human escalation as the outcome, and must not use RSVP
      vocabulary.
    minScore: 0.9
    requireJudge: true
    severity: hard
  - id: verified-unique-uses-no-rsvp-vocabulary
    type: text_not_contains
    phrases: ["RSVP", "rsvp"]
    severity: hard
budget:
  maxTurns: 1
  estimatedPromptTokensPerTurn: 1600
  estimatedCompletionTokensPerTurn: 300
