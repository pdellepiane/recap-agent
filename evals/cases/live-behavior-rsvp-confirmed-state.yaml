template: template.base-live
id: live_behavior.rsvp_confirmed_state_is_reported
suite: live_behavior_regression
version: 7
description: A user-level invitation that already has attendance confirmed is reported via hybrid fragment plus natural tissue without another mutation.
tags: [live, behavior, rsvp, attendance, current-state, trusted-phone]
targetModes: [live_lambda]
backendFixture:
  scenario: rsvp-confirmed-otra-celebracion
inputs:
  - text: ¿Mi asistencia a Otra celebración prueba ya está confirmada?
    channel: whatsapp
    contactPhone: "+51973296571"
    sessionId: live-rsvp-confirmed-state-session
    backendFixture:
      scenario: rsvp-confirmed-otra-celebracion
seedPlan:
  current_node: responder_invitacion
  intent: responder_invitacion
  rsvp_state:
    status: awaiting_action
    pending_action: attending
    candidates:
      - guest_id: 584352
        event_name: Otra celebración prueba
        event_date: "2026-08-19 05:00:00"
    requested_at: "2026-08-17T15:00:00.000Z"
    selection_attempts: 0
expectations:
  - id: remains-in-rsvp-node
    type: node_transition
    to: responder_invitacion
    severity: hard
  - id: reads-user-level-invitation-state
    type: tool_usage
    mustCall: [lookup_rsvp_invitations]
    mustNotCall: [guest_rsvp, auth_by_phone, request_user_login_code, verify_user_login_code]
    severity: hard
  - id: clears-completed-rsvp-state
    type: plan_field_equals
    path: rsvp_state.status
    expected: none
    severity: hard
  - id: reports-existing-confirmation-naturally
    type: text_semantic
    rubric: >-
      Pass only if the assistant responds entirely in Spanish in its own natural wording, reporting that attendance for "Otra celebración prueba" is already confirmed. Factual requirements are attending polarity and the event name; the recorded date (19 de agosto de 2026, any clear rendering) supports grounding but a missing date alone never fails, while a wrong date or flipped polarity does. The response must not claim a new mutation was made; no explicit no-write recital is required. It must not ask for email or a code, must not mention internal states or tools, and must not state the opposite polarity.
    minScore: 0.9
    requireJudge: true
    severity: hard
  - id: fragment-not-inverted
    type: text_not_contains
    phrases: ["Figura que no asistirás"]
    severity: hard
  - id: no-rsvp-vocabulary
    type: text_not_contains
    phrases: ["RSVP", "rsvp"]
    severity: hard
notes:
  - "R05 oracle revision v6 to v7, 2026-09-16, final support rescue task 5. The old contract demanded attending polarity, event name, date, and an explicit no-write recital as joint factual requirements, failing useful confirmed-state answers that omitted the date or the recital. New contract keeps attending polarity and event name as hard requirements, treats the recorded date as supporting detail (wrong date still fails), and bans false new-mutation claims without demanding a recital. Threshold 0.9, hard severity, requireJudge kept. Old v6 runs preserved; baseline and candidate must rerun on this v7 contract."
budget:
  maxTurns: 1
  estimatedPromptTokensPerTurn: 1600
  estimatedCompletionTokensPerTurn: 250
