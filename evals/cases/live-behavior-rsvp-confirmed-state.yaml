version: 11
description: Six-turn confirmed-state thread. A user-level invitation that already has attendance confirmed is reported without another mutation; a date question and a thanks close the first half. The resolved-single Paolo and Mariana invitation is then reported for the named event without asking the user to choose among invitations; a time question and a thanks close the thread.
