notes:
  - "R05 oracle revision v6 to v7, 2026-09-16, final support rescue task 5. The old contract demanded attending polarity, event name, date, and an explicit no-write recital as joint factual requirements, failing useful confirmed-state answers that omitted the date or the recital. New contract keeps attending polarity and event name as hard requirements, treats the recorded date as supporting detail (wrong date still fails), and bans false new-mutation claims without demanding a recital. Threshold 0.9, hard severity, requireJudge kept. Old v6 runs preserved; baseline and candidate must rerun on this v7 contract."
  - "RSVP extension v8 (2026-09-30): added a genuine turn-1 date question and a turn-2 thanks closure, each with hard no-write structural assertions and a hard requireJudge semantic judge grounded in the same fixture. Turn-0 expectations unchanged except explicit turnIndex 0 scoping. Old v7 runs preserved; baseline and candidate must rerun on this v8 contract."
  - "RSVP merge v9 (2026-09-30): this case now carries a 6-turn thread that fully subsumes live_behavior.rsvp_paolo_mariana_resolved_single (turns 3-5). Every absorbed turn keeps its original hard structural assertions and hard requireJudge semantic judge, renumbered turnIndex 0->3, 1->4, 2->5 with turnN- id prefixes; turns 3-5 switch fixture to the absorbed rsvp-resolved-attending world via turn-level backendFixture on the same phone. The carrier seedPlan is kept; absorbed turns carry no plan assertions. Turns 0-2 unchanged. Old v8 runs preserved; baseline and candidate must rerun on this v9 contract."
budget:
  maxTurns: 6
  estimatedPromptTokensPerTurn: 1600
