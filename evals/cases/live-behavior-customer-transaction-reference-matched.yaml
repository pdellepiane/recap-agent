    backendFixture:
      scenario: s13-reference-matched
notes:
  - S13 frozen world s13-reference-matched as of 2026-09-09T00:00:00.000Z. Synthetic identity only; order alias A for Evento de prueba A carries 301816, alias B for Evento de prueba B carries 301817, no carts. Output must follow this world, never mutable backend data.
  - "v2 2026-09-28: The old node and phone-order call pins did not account for complete authorized profile prefetch before extraction. The hard extraction contract now requires a structured purchase request; the hard semantic judge still requires the exact authorized match, without a planning clarification or event B substitution."
  - "IMGMISC lane merge surgery 2026-09-30: extended 1 to 3 turns with a repeat-from-history continuity turn and a thanks closure; existing expectations pinned to turn 0 with rubric bytes unchanged."
expectations:
  - id: matched-uses-authorized-context
    turnIndex: 0
    type: tool_usage
    mustCall: []
    mustNotCall: [ auth_by_phone, request_user_login_code, verify_user_login_code ]
    severity: hard
  - id: recall-performs-no-new-effect
    type: tool_usage
    mustCall: []
    mustNotCall:
      - auth_by_phone
      - request_user_login_code
      - verify_user_login_code
      - request_human_takeover
      - guest_rsvp
      - create_quote_request
      - finish_plan
    turnIndex: 1
    severity: hard
  - id: thanks-performs-no-new-effect
    type: tool_usage
    mustCall: []
    mustNotCall:
      - auth_by_phone
      - request_user_login_code
      - verify_user_login_code
      - request_human_takeover
      - guest_rsvp
      - create_quote_request
    turnIndex: 2
    severity: hard
budget:
  maxTurns: 3
  estimatedPromptTokensPerTurn: 1500
  estimatedCompletionTokensPerTurn: 240
scorers:
  - id: expectation-core
