notes:
  - "F1 2026-09-12: backendFixture scenario image-clean-world; this phone has empty initial history and empty authorized purchase results; never mutable backend data."
  - "Backend image forwarding contract 2026-09-08. Synthetic voucher-style fixture rendered locally, never a customer document. The two inputs run as separate invocations against the same conversation; ordering is by invocation, with no sleep or debounce."
  - "E1 v3 2026-09-15, profile-inference directive (delayed images): judge-only manually verified ground truth bound to the fixture image digest via the judge-context pathway (resolveJudgeOnlyImageGroundTruth); never runtime input, no new OCR/vision. Read-only amount is not backend approval. R05: old v2 runs preserved."
  - "R05 v4 (2026-09-17, support assessment hardening items 6 and 7): the exact plan_persist_reason image_file_silence pin is replaced with observable behavior. Old defect: the trace string pinned an internal persist reason instead of the customer-visible behavior. New acceptance: deliberate first-turn suppression is judged through the existing validated-silence route (file-image-first-turn-silent-persist-reason is now a hard text_semantic on turn 0 that passes legitimate image-only silence; expectation id retained for ledger continuity, only its type changed), persisted attachment usability on the next turn is judged by the retained turn-1 semantic, and zero unauthorized effects are proved by hard rsvp.write and handoff.write 0/0/0 receipt pins on turn 0. The native image_file_context binding proof and the digest-bound judge-only pixel ground truth are preserved. The file-image-delayed-no-resend word blacklist is removed: ordinary resend phrases could reject a valid paraphrase, while the hard semantic no-resend rule is preserved unchanged. Turn 0 gains a hard semantic judge (0.8); this adds one judge call to the panel budget. Thresholds and remaining severity kept; no threshold reduction. Old v3 runs preserved; baseline and candidate must rerun on this v4 contract."
  - "IMGMISC lane merge surgery 2026-09-30: extended 2 to 3 turns with a thanks closure. Added the missing hard structural pin for turn 1."
  - "Merge v6, 2026-09-30 (IMGMISC lane): absorbed live_behavior.s5-generic-model-failure-not-image as turns 2-3 (same phone and fixture image-clean-world, ids/contracts preserved, turnIndex renumbered) with a shared turn-4 thanks closure; both judgeGroundTruth blocks carry the identical S/ 250.00 digest, carrier block kept. Deleted file: live-behavior-s5-generic-model-failure-not-image.yaml."
expectations:
