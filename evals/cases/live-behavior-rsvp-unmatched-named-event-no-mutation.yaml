template: template.base-live
id: live_behavior.rsvp_unmatched_named_event_no_mutation
suite: live_behavior_regression
version: 1
description: Naming an event that matches no authorized invitation (Boda Beto) must never fall back to the accessible invitations, must perform zero mutations, and must never present another event's details as the requested one.
tags:
  - live
  - behavior
  - rsvp
  - multi-event
  - event-identity
  - i1
targetModes:
  - live_lambda
inputs:
  - text: Confirmo mi asistencia a la Boda Beto
    channel: whatsapp
    contactPhone: "+51941438999"
    sessionId: live-rsvp-unmatched-named-event
backendFixture:
  scenario: rsvp-plus-one-multiple-pending
notes:
  - "I1 2026-09-14, event-identity-review: the fixture phone carries Boda Ana y Luis and Cumpleaños Marta only. Boda Beto matches neither. The turn must select nothing, write nothing, and disclose the missing target naturally or ask one distinguishing question. Service-level twins prove zero mutation and needs_event_selection structurally; this case proves the behavior end to end. Never fixed phrases."
expectations:
  - id: unmatched-names-no-mutation
    type: tool_usage
    mustCall:
      - lookup_rsvp_invitations
    mustNotCall:
      - guest_rsvp
      - auth_by_phone
      - request_user_login_code
      - verify_user_login_code
      - request_human_takeover
    severity: hard
  - id: unmatched-never-answers-another-event-as-beto
    type: text_semantic
    rubric: The user confirmed attendance for Boda Beto, which matches no authorized invitation. The response must be natural and entirely in Spanish and must never present Boda Ana y Luis or Cumpleaños Marta facts (dates, times, attendance states) as the requested Boda Beto event, and must never claim any attendance was registered. It may disclose that the named event was not found or ask one distinguishing question about which event is meant. No fixed wording is required and listing candidate names inside a question is acceptable.
    minScore: 0.85
    requireJudge: true
    severity: hard
budget:
  maxTurns: 1
  estimatedPromptTokensPerTurn: 6000
  estimatedCompletionTokensPerTurn: 250
