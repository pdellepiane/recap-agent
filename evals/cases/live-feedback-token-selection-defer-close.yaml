template: template.base-live
id: live_feedback.token_seeded_selection_defer_close
suite: live_behavior_regression
version: 3
description: Seeded multi-need plan should consume tokens while selecting one need, deferring a need after every option is declined, and entering close flow.
tags: [live, feedback, token, seeded-plan, multi-need]
inputs:
  - text: confirmo Carlos Schult para foto
    sessionId: live-feedback-multineed-session
  - text: para catering no quiero ninguna
    sessionId: live-feedback-multineed-session
  - text: ahora cerremos el plan
    sessionId: live-feedback-multineed-session
  - text: soy Carolina, carolina@example.com, teléfono +51 954779071
    sessionId: live-feedback-multineed-session
seedPlan:
  current_node: elicitacion_necesidades
  event_type: boda
  location: Lima
  guest_range: 51-100
  active_need_category: Fotografía y video
  vendor_category: Fotografía y video
  provider_needs:
    - category: Fotografía y video
      status: shortlisted
      preferences: []
      hard_constraints: []
      missing_fields: []
      recommended_provider_ids: [90]
      recommended_providers:
        - id: 90
          title: Carlos Schult
          category: Fotografía y video
          location: Lima
          priceLevel: null
          reason: opción foto
          serviceHighlights: []
          termsHighlights: []
      selected_provider_ids: []
      selected_provider_hints: []
    - category: Catering
      status: shortlisted
      preferences: []
      hard_constraints: []
      missing_fields: []
      recommended_provider_ids: [109]
      recommended_providers:
        - id: 109
          title: EDO Sushi Bar
          category: Catering
          location: Lima
          priceLevel: high
          reason: opción catering
          serviceHighlights: []
          termsHighlights: []
      selected_provider_ids: []
      selected_provider_hints: []
notes:
  - "R05 oracle revision v1 to v2, 2026-09-14, Packet EX1. Old correct-selection-defer-close-behavior let the judge treat an event-date question as a close-flow defect (matrix: the seed carries no event date, so a date-ask is correct close behavior and date-unnecessary is judge invention). New contract states the seed has no date and protects the date-ask. Old v1 runs preserved; baseline and candidate must rerun on this v2 contract."
  - "R05 oracle revision v2 to v3, 2026-09-15, recheck-b9a7662d. Old correct-selection-defer-close-behavior could be read to require reciting every preserved field in prose although persistence is proven structurally (recheck: data was not lost merely because the reply omitted the name; never force provider recital each turn). New contract asserts persisted selection and deferred state plus correct close continuation structurally via the hard plan and trace checks, and forbids failing preserved state merely for omitted names in prose. Keeps the mandatory semantic judge, hard severity, and the bans on re-asking catering and restarting search. Old v2 runs preserved; baseline and candidate must rerun on this v3 contract."
expectations:
  - id: tokens-all-turns
    type: token_usage_present
    allTurns: true
  - id: photography-selected
    type: plan_field_subset
    path: provider_needs
    expected:
      - category: Fotografía y video
        selected_provider_ids: [90]
  - id: catering-defer-recorded
    type: trace_field_subset
    turnIndex: 1
    path: selection_resolution_summary.provider_plan_operation_types
    expected:
      - defer_need
  - id: catering-deferred
    type: plan_field_subset
    path: provider_needs
    expected:
      - category: Catering
        status: deferred
  - id: correct-selection-defer-close-behavior
    type: text_semantic
    turnIndex: 3
    rubric: >-
      The response must preserve Carlos Schult as the selected photography provider, preserve catering as intentionally left without a provider after the user declined every option, and complete or continue the close flow using the contact details just provided. It must not ask the user to choose a catering option again or restart provider search. Persisted selection and deferred state plus correct close continuation are proven by the hard structural plan and trace checks: the judge must not fail a reply that preserves that persisted state merely for omitting a provider name or every preserved field in prose. A compact confirmation naming the selected provider is allowed; it must communicate the close-flow outcome clearly in Spanish. The seed carries no event date, so asking the user for the event date during close is correct behavior, never a defect; the judge must not invent that a date is unnecessary.
    minScore: 0.85
    requireJudge: true
    severity: hard
budget:
  maxTurns: 4
  estimatedPromptTokensPerTurn: 1600
  estimatedCompletionTokensPerTurn: 450
