template: template.base-live
id: live_feedback.token_seeded_selection_defer_close
suite: live_feedback_token_regression
version: 1
description: Seeded multi-need plan should consume tokens while selecting one need, removing a declined need, and entering close flow.
tags: [live, feedback, token, seeded-plan, multi-need]
inputs:
  - text: confirmo Carlos Schult para foto
    sessionId: live-feedback-multineed-session
  - text: para catering no quiero ninguna
    sessionId: live-feedback-multineed-session
  - text: ahora cerremos el plan
    sessionId: live-feedback-multineed-session
  - text: soy Carolina, carolina@example.com, teléfono +51 954779071
    sessionId: live-feedback-multineed-session
seedPlan:
  current_node: elicitacion_necesidades
  event_type: boda
  location: Lima
  guest_range: 51-100
  active_need_category: Fotografía y video
  vendor_category: Fotografía y video
  provider_needs:
    - category: Fotografía y video
      status: shortlisted
      preferences: []
      hard_constraints: []
      missing_fields: []
      recommended_provider_ids: [90]
      recommended_providers:
        - id: 90
          title: Carlos Schult
          category: Fotografía y video
          location: Lima
          priceLevel: null
          reason: opción foto
          serviceHighlights: []
          termsHighlights: []
      selected_provider_ids: []
      selected_provider_hints: []
    - category: Catering
      status: shortlisted
      preferences: []
      hard_constraints: []
      missing_fields: []
      recommended_provider_ids: [109]
      recommended_providers:
        - id: 109
          title: EDO Sushi Bar
          category: Catering
          location: Lima
          priceLevel: high
          reason: opción catering
          serviceHighlights: []
          termsHighlights: []
      selected_provider_ids: []
      selected_provider_hints: []
expectations:
  - id: tokens-all-turns
    type: token_usage_present
    allTurns: true
  - id: photography-selected
    type: plan_field_subset
    path: provider_needs
    expected:
      - category: Fotografía y video
        selected_provider_ids: [90]
  - id: catering-removal-recorded
    type: trace_field_subset
    turnIndex: 1
    path: selection_resolution_summary.provider_plan_operation_types
    expected:
      - delete_need
  - id: correct-selection-defer-close-behavior
    type: text_semantic
    turnIndex: 3
    rubric: >-
      The response must preserve Carlos Schult as the selected photography provider, preserve that catering was intentionally removed after the user declined every option, and complete or continue the close flow using the contact details just provided. It must not restart provider search. A compact confirmation naming the selected provider is allowed; it must communicate the close-flow outcome clearly in Spanish.
    minScore: 0.85
    requireJudge: true
    severity: hard
budget:
  maxTurns: 4
  estimatedPromptTokensPerTurn: 1600
  estimatedCompletionTokensPerTurn: 450
