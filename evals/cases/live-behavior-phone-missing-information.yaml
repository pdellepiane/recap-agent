template: template.base-live
id: live_behavior.phone_purchase_missing_hands_off_once
suite: live_behavior_regression
version: 2
description: Empty trusted-phone orders and carts preserve a purchase query and offer human help without an unrequested handoff write or automatic email verification. The effect fires only on user-accepted/requested handoff.
tags: [live, behavior, purchase, phone, human-handoff, reported-interaction]
targetModes: [live_lambda]
inputs:
  - text: Quiero consultar si mi compra está confirmada. No tengo una cuenta registrada.
    channel: whatsapp
    contactPhone: "+51985101461"
    sessionId: live-phone-missing-purchase
    backendFixture:
      scenario: support-continuity
  - text: Gracias, espero al equipo.
    channel: whatsapp
    contactPhone: "+51985101461"
    sessionId: live-phone-missing-purchase
    backendFixture:
      scenario: support-continuity
backendFixture:
  scenario: support-continuity
notes:
  - "C1 oracle revision v1 to v2, 2026-09-22, final work package. Old contract demanded request_human_takeover, human_escalation.status requested, and a handoff.write 1/1/0 effect at T0 although the frozen run-54da3f5a T0 user text contains no handoff request or acceptance; it graded an offer as a missed effect. New contract follows the established offer-first doctrine (live_behavior.gift_shipping_limitation_accepted_handoff_once: no effect at T0, effect only on explicit acceptance): T0 keeps the scoped lookup and forbids request_human_takeover, expects human_escalation.status none (expectation id manual-help-requested retained for ledger continuity), expects handoff.write 0/0/0, and the semantic judge requires an offer without claiming a requested/placed/confirmed handoff. The not-found trace pin, T0 query-preservation pin, and T1 no-repeat pins are unchanged; a genuinely requested handoff that is not performed still fails. Hard severity kept. Old v1 runs preserved; baseline and candidate must rerun on this v2 contract."
expectations:
  - id: scoped-lookup-and-handoff
    type: tool_usage
    mustCall: [lookup_guest_orders_by_phone]
    mustNotCall: [auth_by_phone, request_user_login_code, verify_user_login_code, request_human_takeover]
    turnIndex: 0
    severity: hard
  - id: manual-help-requested
    type: plan_field_equals
    path: human_escalation.status
    expected: none
    turnIndex: 0
    severity: hard
  - id: purchase-query-retained
    type: plan_field_subset
    path: information_state.pending_requests
    expected:
      - kind: purchase
    turnIndex: 0
    severity: hard
  - id: no-repeat-handoff-or-otp
    type: tool_usage
    mustNotCall: [request_human_takeover, request_user_login_code, verify_user_login_code, lookup_guest_orders_by_phone]
    turnIndex: 1
    severity: hard
  - id: scoped-missing-data-handoff-not-account-login
    type: text_semantic
    rubric: >-
      The scoped lookup could not locate this purchase and the user has not requested a handoff. In Spanish, briefly explain that limitation and offer human help to continue this purchase query, without claiming a handoff was requested, placed, or confirmed. Do not claim the purchase does not exist globally, assert payment status, ask for email or OTP, or guarantee response timing. The full pending question need not be repeated.
    minScore: 0.9
    requireJudge: true
    turnIndex: 0
    severity: hard
  - id: scoped-lookup-not-found-outcome
    type: trace_field_subset
    path: information_execution_summary
    expected:
      - outcomeCode: not_found
    turnIndex: 0
    severity: hard
  - id: missing-purchase-handoff-effect
    type: fixture_effect_count
    operation: handoff.write
    turnIndex: 0
    expectedAttempts: 0
    expectedSuccesses: 0
    expectedReplays: 0
    severity: hard
budget:
  maxTurns: 2
  estimatedPromptTokensPerTurn: 1700
  estimatedCompletionTokensPerTurn: 220
