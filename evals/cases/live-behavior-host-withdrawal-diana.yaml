template: template.base-live
id: live_behavior.host_withdrawal_diana_policy_and_support
suite: live_behavior_regression
version: 3
description: Diana corrects her role, asks about a missing host withdrawal, and supplies her event; answer sourced policy and hand off without buyer or invitation detours.
tags: [live, behavior, faq, host-withdrawal, continuity, reported-interaction, diana]
targetModes: [live_lambda]
inputs:
  - text: Hola, no hice ningún regalo. Yo soy la novia.
    channel: whatsapp
    contactPhone: "+51985101461"
    sessionId: live-host-withdrawal-diana
    backendFixture:
      scenario: support-continuity
  - text: Hice un retiro de dinero de mi evento y aun no lo recibo.
    channel: whatsapp
    contactPhone: "+51985101461"
    sessionId: live-host-withdrawal-diana
    backendFixture:
      scenario: support-continuity
  - text: "Evento: Diana y Fernando"
    channel: whatsapp
    contactPhone: "+51985101461"
    sessionId: live-host-withdrawal-diana
    backendFixture:
      scenario: support-continuity
backendFixture:
  scenario: support-continuity
expectations:
  - id: role-correction-is-not-a-buyer-lookup
    type: tool_usage
    mustNotCall: [lookup_guest_orders_by_phone, lookup_rsvp_invitations, request_user_login_code]
    turnIndex: 0
    severity: hard
  - id: acknowledges-role-without-generic-reset
    type: text_semantic
    rubric: >-
      The user corrected an assumption: she did not buy a gift and is the bride.
      Acknowledge that correction and ask at most one relevant question about what
      she needs. Do not restart with a generic introduction, offer a provider menu,
      assert verified ownership, or discuss an unrelated gift purchase.
    minScore: 0.9
    requireJudge: true
    turnIndex: 0
    severity: hard
  - id: policy-and-human-support-without-unrelated-api-work
    type: tool_usage
    mustCall: [knowledge_base_search, request_human_takeover]
    mustNotCall: [lookup_guest_orders_by_phone, lookup_guest_gift_purchases_by_phone, lookup_guest_events_by_phone, lookup_rsvp_invitations, guest_rsvp, auth_by_phone, request_user_login_code, verify_user_login_code]
    turnIndex: 1
    severity: hard
  - id: withdrawal-topic-retained
    type: plan_field_subset
    path: information_state.pending_requests
    expected: [{kind: faq, hostWithdrawal: individual_status}]
    turnIndex: 1
    severity: hard
  - id: supported-policy-not-invented-withdrawal-status
    type: text_semantic
    rubric: >-
      The user is asking about funds withdrawn from her own event, not a gift she
      bought. Explain that the general host-withdrawal processing policy is up to
      72 business hours. State that the particular withdrawal status/receipt cannot
      be checked with the available information and that human support was requested
      (the fixture succeeds). Do not assert its actual status, blame a bank, promise
      an arrival date, introduce fees or card-fund eligibility periods, ask for OTP,
      or list purchases or invitations. Reply concisely in Spanish.
    minScore: 0.9
    requireJudge: true
    turnIndex: 1
    severity: hard
  - id: handoff-is-persisted
    type: plan_field_equals
    path: human_escalation.status
    expected: requested
    turnIndex: 1
    severity: hard
  - id: later-event-message-stays-with-human-team
    type: text_semantic
    rubric: >-
      The previous turn already requested human support for the withdrawal question and reported the
      72 business hour policy. This turn only supplies the event name Diana y Fernando. Pass only if
      the assistant responds entirely in Spanish by briefly enriching that same support request with
      the event name, without resubmitting a takeover, without restarting provider planning or an
      invitation lookup, and without promising a follow-up date or outcome. A concise reply that
      omits internal handoff mechanics passes; a promised human follow-up with no new confirmed
      effect fails.
    minScore: 0.9
    requireJudge: true
    turnIndex: 2
    severity: hard
  - id: no-repeated-takeover-or-rsvp
    type: tool_usage
    mustNotCall: [request_human_takeover, lookup_rsvp_invitations, guest_rsvp, request_user_login_code]
    turnIndex: 2
    severity: hard
  - id: one-handoff-effect-in-thread
    type: fixture_effect_count
    operation: handoff.write
    turnIndex: 2
    expectedAttempts: 0
    expectedSuccesses: 0
    expectedReplays: 0
    severity: hard
notes:
  - "R05 v3 (2026-09-16, customer-support release E1): a repeated read-only policy lookup (knowledge_base_search) is permitted and removed from the turn-2 mustNotCall list. Repeated takeover remains forbidden and is checked against effect receipts (fixture_effect_count handoff.write 0/0/0 at turn 2), not wording: a reused turn-1 success receipt never counts as a new effect. Failing counterexample: a second request_human_takeover dispatch, a guest_rsvp write, or a promised follow-up with no new confirmed effect fails. Earlier runs unchanged."
  - "R05 oracle revision v1 to v2, 2026-09-16, Packet E1 implementation-pin removal. Old later-event-message-stays-with-human-team pinned the internal prompt_bundle_id deterministic:human_escalation_soft_pause, prescribing the prompt-building implementation instead of evidencing behavior (matrix: a correct brief enrichment that stayed with the human team but composed through a different bundle failed the pin). New contract judges the same behavior semantically: brief enrichment with the event name, no resubmitted takeover, no planning restart, no promised follow-up without a confirmed effect. The handoff promise-vs-omission distinction follows the shared judge rule: concise omission of internal mechanics passes, an unconfirmed follow-up promise fails. Threshold and hard severity kept; no threshold reduction. Old v1 runs preserved; baseline and candidate must rerun on this v2 contract."
budget:
  maxTurns: 3
  estimatedPromptTokensPerTurn: 1700
  estimatedCompletionTokensPerTurn: 220
