template: template.base-live
id: live_behavior.host_withdrawal_diana_policy_and_support
suite: live_behavior_regression
version: 12
description: Diana asks the general withdrawal timing first, then corrects her role, asks about a missing host withdrawal, and supplies her event; answer sourced policy and hand off without buyer or invitation detours.
tags: [ live, behavior, faq, host-withdrawal, continuity, reported-interaction, diana ]
targetModes: [ live_lambda ]
inputs:
  - text: En general, ¿cuánto demoran en procesarse las solicitudes de retiro de fondos de un evento? No estoy consultando un retiro particular.
    channel: whatsapp
    contactPhone: "+51985101461"
    sessionId: live-host-withdrawal-diana
    backendFixture:
      scenario: support-continuity
  - text: Hola, no hice ningún regalo. Yo soy la novia.
    channel: whatsapp
    contactPhone: "+51985101461"
    sessionId: live-host-withdrawal-diana
    backendFixture:
      scenario: support-continuity
  - text: Hice un retiro de dinero de mi evento y aun no lo recibo.
    channel: whatsapp
    contactPhone: "+51985101461"
    sessionId: live-host-withdrawal-diana
    backendFixture:
      scenario: support-continuity
  - text: "Evento: Diana y Fernando"
    channel: whatsapp
    contactPhone: "+51985101461"
    sessionId: live-host-withdrawal-diana
    backendFixture:
      scenario: support-continuity
backendFixture:
  scenario: support-continuity
expectations:
  - id: general-policy-reads-kb-only
    type: tool_usage
    mustNotCall:
      - request_human_takeover
      - auth_by_phone
      - request_user_login_code
    turnIndex: 0
    severity: hard
  - id: general-no-handoff-required
    type: plan_field_equals
    path: human_escalation.status
    expected: none
    turnIndex: 0
    severity: hard
  - id: general-no-handoff-effect
    type: fixture_effect_count
    operation: handoff.write
    turnIndex: 0
    expectedAttempts: 0
    expectedSuccesses: 0
    expectedReplays: 0
    severity: hard
  - id: role-correction-is-not-a-buyer-lookup
    type: tool_usage
    mustNotCall:
      - request_user_login_code
    turnIndex: 1
    severity: hard
  - id: no-handoff-effect-before-policy-turn
    type: fixture_effect_count
    operation: handoff.write
    turnIndex: 1
    expectedAttempts: 0
    expectedSuccesses: 0
    expectedReplays: 0
    severity: hard
  - id: policy-and-human-support-without-unrelated-api-work
    type: tool_usage
    mustNotCall:
      - guest_rsvp
      - auth_by_phone
      - request_user_login_code
      - verify_user_login_code
    turnIndex: 2
    severity: hard
  - id: no-unsupported-transfer-processing-or-arrival-promise
    type: text_not_contains
    phrases:
      - el día de hoy estaremos procesando tu solicitud
      - a más tardar el día de mañana
    turnIndex: 2
    severity: hard
  - id: handoff-is-persisted
    type: plan_field_equals
    path: human_escalation.status
    expected: requested
    turnIndex: 2
    severity: hard
  - id: single-handoff-effect-after-policy-turn
    type: fixture_effect_count
    operation: handoff.write
    turnIndex: 2
    expectedAttempts: 1
    expectedSuccesses: 1
    expectedReplays: 0
    severity: hard
  - id: no-repeated-takeover-or-rsvp
    type: tool_usage
    mustNotCall:
      - request_human_takeover
      - guest_rsvp
      - request_user_login_code
    turnIndex: 3
    severity: hard
  - id: one-handoff-effect-in-thread
    type: fixture_effect_count
    operation: handoff.write
    turnIndex: 3
    expectedAttempts: 0
    expectedSuccesses: 0
    expectedReplays: 0
    severity: hard
notes:
  - "2026-10-02 ATC audit: removed the unsupported mandatory 72-hour withdrawal claim. The official withdrawal article has no processing window; sample-response promises are not policy evidence. All handoff/effect/access controls remain."
  - "Merge v8, 2026-09-30: prepended live_behavior.host_withdrawal_general_policy_only (same phone and fixture support-continuity) as turn 0 and shifted the Diana turns to 1-3 with ids/contracts preserved. The cumulative handoff ledger is now 0/0/0, 0/0/0, 1/1/0, 1/1/0 across turns 0-3. The absorbed turn-0 tool ban drops the stale lookup_guest_orders_by_phone and lookup_guest_events_by_phone prohibitions per the v6 canonical-profile doctrine (required profile reads on every support turn); RSVP, takeover, and auth bans stay. Deleted file: live-behavior-host-withdrawal-general.yaml."
  - "R05 v7 (2026-09-28): a targeted dev reply omitted the sourced 72-business-hour policy even though its typed value was in the serialized reply input. Add a hard delivered-text assertion for this factual requirement; retain the semantic judge and handoff receipts. Historical v6 results remain unchanged."
  - "R05 v6 (2026-09-25): The canonical authorized customer profile reads phone-scoped orders, gift purchases and events before extraction on every support turn. The v5 turn-0 and turn-1 mustNotCall lists treated those required profile reads as unauthorized buyer work, so a correct withdrawal answer could fail structurally. Remove only those three read bans; keep the prohibition on RSVP lookup/write and auth detours, the single handoff effect ledger, the host-withdrawal task evidence, and the hard semantic policy/status requirements. Historical v5 runs are unchanged."
  - "R05 v4 (2026-09-17, actionable-answer package Lane B): cumulative-from-case-baseline ledger repair plus role-correction and turn-2 rubric repair. Old defect: the turn-2 pin expected handoff.write 0/0/0, reading turnIndex as a per-turn delta; under the harness cumulative semantics the turn-1 confirmed handoff receipt is still present at turn 2, so the old pin failed a correct run. New acceptance: cumulative handoff attempts/successes/replays = 0/0/0, 1/1/0, 1/1/0 across turns 0-2, checked together with the retained no-resubmission tool pin; a real second takeover dispatch (2/2/0) still fails, and a reused turn-1 success receipt never counts as a new effect. Turn-0 role correction now passes on a relevant acknowledgment alone with no pending task; a question is optional. Turn 2 may retain the supplied event name in conversational context without claiming an external team record update sans receipt. Threshold and hard severity kept; no threshold reduction. Old v3 runs preserved; baseline and candidate must rerun on this v4 contract."
  - "R05 v3 (2026-09-16, customer-support release E1): a repeated read-only policy lookup (knowledge_base_search) is permitted and removed from the turn-2 mustNotCall list. Repeated takeover remains forbidden and is checked against effect receipts (fixture_effect_count handoff.write 0/0/0 at turn 2), not wording: a reused turn-1 success receipt never counts as a new effect. Failing counterexample: a second request_human_takeover dispatch, a guest_rsvp write, or a promised follow-up with no new confirmed effect fails. Earlier runs unchanged."
  - "R05 oracle revision v1 to v2, 2026-09-16, Packet E1 implementation-pin removal. Old later-event-message-stays-with-human-team pinned the internal prompt_bundle_id deterministic:human_escalation_soft_pause, prescribing the prompt-building implementation instead of evidencing behavior (matrix: a correct brief enrichment that stayed with the human team but composed through a different bundle failed the pin). New contract judges the same behavior semantically: brief enrichment with the event name, no resubmitted takeover, no planning restart, no promised follow-up without a confirmed effect. The handoff promise-vs-omission distinction follows the shared judge rule: concise omission of internal mechanics passes, an unconfirmed follow-up promise fails. Threshold and hard severity kept; no threshold reduction. Old v1 runs preserved; baseline and candidate must rerun on this v2 contract."
  - "R05 v5 (2026-09-17, support assessment hardening item 1): the cumulative 0/1/1 handoff ledger described in v4 is now pinned on every turn. Old gap: only the turn-2 pin existed, so a stray turn-0 write or a missing turn-1 dispatch had no per-turn receipt check. New turn-0 no-handoff-effect-before-policy-turn (0/0/0) and turn-1 single-handoff-effect-after-policy-turn (1/1/0) complete the cumulative series with the retained turn-2 pin; a second mutation (2/2/0) still fails and missing ledger evidence errors instead of passing as zero. Same-turn forbidden writes, role-correction acceptance, and turn-2 rubric are unchanged. Threshold and hard severity kept; no threshold reduction. Old v4 runs preserved; baseline and candidate must rerun on this v5 contract."
budget:
  maxTurns: 4
  estimatedPromptTokensPerTurn: 1700
  estimatedCompletionTokensPerTurn: 220
scorers:
  - id: expectation-core
    type: expectation_pass_rate
    weight: 1
