template: template.base-live
id: live_feedback.token_fresh_multifront_stays_multi_need
suite: live_behavior_regression
version: 1
description: Fresh multi-front provider request should consume tokens and remain multi-need in live Lambda.
tags: [live, feedback, token, multi-need]
inputs:
  - text: Quiero planear una boda moderna y elegante en Lima para 120 personas. Necesito catering con sushi, fotografía y video natural, música en vivo elegante, florería blanca y verde, y local sofisticado de noche. Presupuesto medio-alto.
    sessionId: live-feedback-multifront-session
expectations:
  - id: tokens-all-turns
    type: token_usage_present
    allTurns: true
  - id: multi-node
    type: node_transition
    to: elicitacion_necesidades
  - id: multi-strategy
    type: trace_field_equals
    path: search_strategy
    expected: multi_need_query_intents
  - id: correct-multifront-behavior
    type: text_semantic
    rubric: >-
      The response must retain the request as one event plan with all five provider needs: food service with sushi, photography and video, elegant live music, floral service, and a sophisticated nighttime venue. It must not collapse the request to only one provider category. The response does not need to repeat every preference when it presents the retained category. If retrieval has no exact live-music or white-and-green match, stating that limitation honestly without inventing a match is correct. It must respond naturally in Spanish.
    minScore: 0.85
    requireJudge: true
    severity: hard
budget:
  maxTurns: 1
  estimatedPromptTokensPerTurn: 2200
  estimatedCompletionTokensPerTurn: 700
