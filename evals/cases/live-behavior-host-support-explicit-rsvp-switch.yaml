template: template.base-live
id: live_behavior.host_support_allows_explicit_rsvp_switch
suite: live_behavior_regression
version: 1
description: A pending host withdrawal must not prevent an explicitly requested attendance question; the test uses read-only fixture data.
tags: [live, behavior, rsvp, host-withdrawal, boundary]
targetModes: [live_lambda]
inputs:
  - text: Ahora cambio de tema. Quiero consultar mi asistencia a Michelle & Jorge. ¿Ya está confirmada? No cambies mi respuesta.
    channel: whatsapp
    contactPhone: "+51942633292"
seedPlan:
  current_node: resolver_consultas_informativas
  information_state:
    resume_node: entrevista
    pending_requests:
      - requestId: host-withdrawal
        kind: faq
        query: Retiro de fondos no recibido
        hostWithdrawal: individual_status
        eventHint: Otro evento
    selection_candidates: []
    last_completed_request: null
backendFixture: {scenario: rsvp-plus-one-saved}
expectations:
  - id: explicit-switch-enters-rsvp
    type: node_transition
    to: responder_invitacion
    severity: hard
  - id: explicit-state-query-is-read-only
    type: tool_usage
    mustCall: [lookup_rsvp_invitations, lookup_guest_events_by_phone]
    mustNotCall: [guest_rsvp, knowledge_base_search, request_human_takeover, auth_by_phone, request_user_login_code]
    severity: hard
  - id: current-request-not-old-pending-topic
    type: text_semantic
    rubric: >-
      The user explicitly switched from withdrawal support to asking about attendance
      at Michelle & Jorge, with no authorization to change it. The fixture attendance
      has not been answered. State that attendance is pending/not yet confirmed for
      that event, without claiming a mutation. Do not answer the old withdrawal
      question, initiate human handoff, ask for OTP, or discuss another event.
    minScore: 0.9
    requireJudge: true
    severity: hard
budget: {maxTurns: 1, estimatedPromptTokensPerTurn: 1700, estimatedCompletionTokensPerTurn: 180}
