template: template.base-live
id: live_behavior.rsvp_cinthya_campaign_invitation_not_reported_missing
suite: live_behavior_regression
version: 3
description: A campaign-grounded RSVP for Julisabeth y Andrés must reconcile both phone-scoped reads and must not be reported as a missing invitation.
tags: [live, behavior, rsvp, attendance, reported-interaction, campaign-context, concurrent-read]
targetModes: [live_lambda]
inputs:
  - text: Gracias, confirmo asistencia
    channel: whatsapp
    contactPhone: "+51904523314"
    sessionId: live-rsvp-cinthya-campaign-session
expectations:
  - id: enters-rsvp-node
    type: node_transition
    to: responder_invitacion
    severity: hard
  - id: reads-user-level-state-without-account-auth
    type: tool_usage
    mustCall: [lookup_rsvp_invitations, lookup_guest_events_by_phone, get_guest_event_detail]
    mustNotCall: [guest_rsvp, auth_by_phone, request_user_login_code, verify_user_login_code]
    severity: hard
  - id: preserves-campaign-grounded-invitation
    type: text_semantic
    rubric: >-
      The reconciled phone evidence establishes that this number is associated with Julisabeth y Andrés, and the phone-enriched attendance says the guest has responded and will attend. The answer must remain entirely in Spanish, clearly say that attendance is already confirmed, thank the person, and say that no additional change was needed. It must not deny the invitation, ask for email or a code, or claim that a new RSVP mutation was made.
    minScore: 0.9
    requireJudge: true
    severity: hard
budget:
  maxTurns: 1
  estimatedPromptTokensPerTurn: 1600
  estimatedCompletionTokensPerTurn: 300
