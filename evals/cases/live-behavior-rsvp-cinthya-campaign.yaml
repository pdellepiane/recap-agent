template: template.base-live
id: live_behavior.rsvp_cinthya_campaign_invitation_not_reported_missing
suite: live_behavior_regression
version: 1
description: A campaign-grounded RSVP for Julisabeth y Andrés must not be reported as a missing invitation when the mutation endpoint has no pending response.
tags: [live, behavior, rsvp, attendance, reported-interaction, campaign-context]
targetModes: [live_lambda]
inputs:
  - text: Gracias, confirmo asistencia
    channel: whatsapp
    contactPhone: "+51904523314"
    sessionId: live-rsvp-cinthya-campaign-session
expectations:
  - id: enters-rsvp-node
    type: node_transition
    to: responder_invitacion
    severity: hard
  - id: reads-user-level-state-without-account-auth
    type: tool_usage
    mustCall: [lookup_rsvp_invitations]
    mustNotCall: [guest_rsvp, auth_by_phone, request_user_login_code, verify_user_login_code]
    severity: hard
  - id: preserves-campaign-grounded-invitation
    type: text_semantic
    rubric: >-
      The recent campaign history establishes an invitation for Julisabeth y Andrés in this conversation, while the current user-level lookup does not return a record or current attendance state. The answer must remain entirely in Spanish, must not say that the invitation never existed or merely that there are no pending invitations, and must not claim that an attendance update succeeded. It should explain the current lookup mismatch naturally and offer human help to review the link and state.
    minScore: 0.9
    requireJudge: true
    severity: hard
budget:
  maxTurns: 1
  estimatedPromptTokensPerTurn: 1600
  estimatedCompletionTokensPerTurn: 300
