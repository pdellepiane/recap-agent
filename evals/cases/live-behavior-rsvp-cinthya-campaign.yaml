template: template.base-live
id: live_behavior.rsvp_cinthya_campaign_invitation_not_reported_missing
suite: live_behavior_regression
version: 1
description: A campaign-grounded RSVP for Julisabeth y Andrés must not be reported as a missing invitation when the mutation endpoint has no pending response.
tags: [live, behavior, rsvp, attendance, reported-interaction, campaign-context]
targetModes: [live_lambda]
inputs:
  - text: Gracias, confirmo asistencia
    channel: whatsapp
    contactPhone: "+51904523314"
    sessionId: live-rsvp-cinthya-campaign-session
expectations:
  - id: enters-rsvp-node
    type: node_transition
    to: responder_invitacion
    severity: hard
  - id: uses-rsvp-without-account-auth
    type: tool_usage
    mustCall: [guest_rsvp]
    mustNotCall: [auth_by_phone, request_user_login_code, verify_user_login_code]
    severity: hard
  - id: preserves-campaign-grounded-invitation
    type: text_semantic
    rubric: >-
      The recent campaign history establishes that Julisabeth y Andrés is an invitation associated with this channel number. The RSVP mutation endpoint reports that there is no pending response to update. The answer must remain entirely in Spanish, must not say or imply that the invitation is missing or unassociated with the number, and must not claim that a new attendance update succeeded. It should explain naturally that the invitation is no longer pending and may offer help reviewing or changing the existing response.
    minScore: 0.9
    requireJudge: true
    severity: hard
budget:
  maxTurns: 1
  estimatedPromptTokensPerTurn: 1600
  estimatedCompletionTokensPerTurn: 300
