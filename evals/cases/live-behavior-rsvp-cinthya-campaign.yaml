template: template.base-live
id: live_behavior.rsvp_cinthya_campaign_invitation_not_reported_missing
suite: live_behavior_regression
version: 6
description: A campaign-grounded RSVP for Julisabeth y Andrés must reconcile both phone-scoped reads and must not be reported as a missing invitation; confirmed state alone passes.
tags: [live, behavior, rsvp, attendance, reported-interaction, campaign-context, concurrent-read]
targetModes: [live_lambda]
inputs:
  - text: Gracias, confirmo asistencia
    channel: whatsapp
    contactPhone: "+51904523314"
    sessionId: live-rsvp-cinthya-campaign-session
expectations:
  - id: enters-rsvp-node
    type: node_transition
    to: responder_invitacion
    severity: hard
  - id: reads-user-level-state-without-account-auth
    type: tool_usage
    mustCall: [lookup_rsvp_invitations, lookup_guest_events_by_phone, get_guest_event_detail]
    mustNotCall: [guest_rsvp, auth_by_phone, request_user_login_code, verify_user_login_code]
    severity: hard
  - id: preserves-campaign-grounded-invitation
    type: text_semantic
    rubric: >-
      The reconciled phone evidence establishes that this number is associated with Julisabeth y Andrés, and the phone-enriched attendance says the guest has responded and will attend. The answer must remain entirely in Spanish and clearly say that attendance is already confirmed, with no new mutation or auth loop. An explicit thank-you is welcome but never required and its absence must not fail. It must not deny the invitation, ask for email or a code, or claim that a new RSVP mutation was made.
    minScore: 0.9
    requireJudge: true
    severity: hard
  - id: no-rsvp-vocabulary
    type: text_not_contains
    phrases: ["RSVP", "rsvp"]
    severity: hard
notes:
  - "R05 oracle revision v5 to v6, 2026-09-12, Packet F3. Old preserves-campaign-grounded-invitation required an explicit thank-you, failing a reply that reported confirmed state without a new mutation or auth loop (matrix: fails only missing explicit thank-you). New contract drops the thank-you demand while keeping confirmed-state reporting. Old v5 runs preserved; baseline and candidate must rerun on this v6 contract."
budget:
  maxTurns: 1
  estimatedPromptTokensPerTurn: 1600
  estimatedCompletionTokensPerTurn: 300
