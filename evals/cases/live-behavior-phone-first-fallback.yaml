template: template.base-live
id: live_behavior.phone_first_auth_fallback
suite: live_behavior_regression
version: 1
description: A protected WhatsApp request automatically receives phone user-not-found and then falls back to email OTP verification.
tags: [live, behavior, authentication, phone-first, email-fallback, protected-information]
targetModes: [live_lambda]
inputs:
  - text: Quiero revisar la información de mi regalo.
    channel: whatsapp
    contactPhone: "$PHONE_FIRST_FALLBACK_CONTACT_PHONE"
    sessionId: phone-first-fallback-session
  - text: Mi correo registrado es fallback@example.invalid.
    channel: whatsapp
    contactPhone: "$PHONE_FIRST_FALLBACK_CONTACT_PHONE"
    sessionId: phone-first-fallback-session
expectations:
  - id: first-turn-checks-phone-before-email
    type: tool_usage
    turnIndex: 0
    mustCall: [auth_by_phone]
    mustNotCall: [request_user_login_code]
    severity: hard
  - id: phone-not-found-asks-for-email
    type: text_semantic
    turnIndex: 0
    rubric: >-
      After automatic phone lookup finds no account, the response must ask in natural Spanish for the registered Sin Envolturas email. It must not ask the user to confirm the WhatsApp number.
    minScore: 0.9
    requireJudge: true
    severity: hard
  - id: phone-auth-fails-and-email-fallback-starts
    type: tool_usage
    turnIndex: 1
    mustCall: [auth_by_phone, request_user_login_code]
    severity: hard
  - id: email-fallback-reports-code-requested
    type: plan_field_equals
    turnIndex: 1
    path: user_auth.status
    expected: code_requested
    severity: hard
  - id: phone-failure-does-not-claim-success
    type: text_not_contains
    turnIndex: 1
    phrases: ["autenticación por teléfono exitosa", "teléfono autenticado"]
    severity: hard
  - id: phone-fallback-language
    type: text_semantic
    turnIndex: 1
    rubric: >-
      After automatic phone authentication returns user-not-found and the user provides an email, the response must clearly explain in Spanish that a one-time code was sent to that email, explicitly say that it cannot read images or screenshots, and ask the user to copy and paste the code here. It must not use the word “texto” as an instruction, claim phone authentication succeeded, or ask the user to confirm the WhatsApp number.
    minScore: 0.9
    requireJudge: true
    severity: hard
budget:
  maxTurns: 2
  estimatedPromptTokensPerTurn: 1800
  estimatedCompletionTokensPerTurn: 450
notes:
  - Set PHONE_FIRST_FALLBACK_CONTACT_PHONE to a separate development phone fixture that is known to return user_not_found; no phone, token, or OTP is stored in this case file.
