template: template.base-live
id: live_behavior.image_conversation_continuity
suite: live_behavior_regression
version: 1
description: An understood image stays in the conversation; the follow-up turn continues the same thread without hallucinating image content or resetting state.
tags: [live, behavior, image, conversation-continuity, s17]
targetModes: [live_lambda]
inputs:
  - text: ''
    channel: whatsapp
    contactPhone: "+51900027799"
    sessionId: live-image-conversation-continuity-session
    image:
      data: 
      mime_type: image/png
  - text: Me lo puedes repetir por favor?
    channel: whatsapp
    contactPhone: "+51900027799"
    sessionId: live-image-conversation-continuity-session
notes:
  - Backend image forwarding contract 2026-09-08. Synthetic voucher-style fixture rendered locally, never a customer document. Same conversation across both turns; the second turn must be answered from conversation history since image bytes are never persisted.
expectations:
  - id: continuity-image-inspected
    type: tool_usage
    mustCall: [image_inspect]
    turnIndex: 0
    severity: hard
  - id: continuity-first-turn-informative
    type: node_transition
    to: resolver_consultas_informativas
    turnIndex: 0
    severity: hard
  - id: continuity-no-resend-request
    type: text_not_contains
    phrases: [Puedes enviarla de nuevo, supera el tamaño permitido]
    turnIndex: 1
    severity: hard
  - id: continuity-repeat-from-history
    type: text_semantic
    rubric: >-
      Image bytes and inspection answers are ephemeral by design, so recall is not required. Pass only if the assistant responds entirely in Spanish by either repeating the amount already stated in this thread or by honestly asking what to repeat. It must not invent new image content, must not ask the user to resend any image, must not claim it saved, stored, or re-read the image, must not request an OTP, and must not start a planning interview from scratch.
    minScore: 0.8
    requireJudge: true
    turnIndex: 1
    severity: hard
budget:
  maxTurns: 2
  estimatedPromptTokensPerTurn: 2500
  estimatedCompletionTokensPerTurn: 300
