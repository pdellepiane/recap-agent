template: template.base-live
id: live_behavior.rsvp_missing_event_identity_is_unavailable
suite: live_behavior_regression
version: 4
description: Diana's malformed invitation evidence boundary; parsed guest records without event identity cannot become guest-name invitation choices or a global denial. A retry repeats the honest boundary and a thanks closes the thread.
tags: [ live, behavior, rsvp, minimum-disclosure, reported-interaction, diana, continuity ]
targetModes: [ live_lambda ]
inputs:
  - text: ¿Puedes verificar el estado de mi invitación?
    channel: whatsapp
    contactPhone: "+51985101461"
    sessionId: live-rsvp-missing-event-identity-session
    backendFixture:
      scenario: rsvp-missing-event-identity
  - text: ¿Puedes intentarlo de nuevo?
    channel: whatsapp
    contactPhone: "+51985101461"
    sessionId: live-rsvp-missing-event-identity-session
    backendFixture:
      scenario: rsvp-missing-event-identity
  - text: Gracias, eso era todo.
    channel: whatsapp
    contactPhone: "+51985101461"
    sessionId: live-rsvp-missing-event-identity-session
    backendFixture:
      scenario: rsvp-missing-event-identity
seedPlan:
  current_node: responder_invitacion
  rsvp_state:
    status: awaiting_event_selection
    pending_action: null
    candidates: []
    requested_at: null
    selection_attempts: 0
backendFixture: { scenario: rsvp-missing-event-identity }
expectations:
  - id: read-only-invitation-check
    type: tool_usage
    mustCall: []
    mustNotCall: [ guest_rsvp, auth_by_phone, request_user_login_code ]
    turnIndex: 0
    severity: hard
  - id: turn1-no-write-receipt
    type: fixture_effect_count
    operation: rsvp.write
    turnIndex: 1
    expectedAttempts: 0
    expectedSuccesses: 0
    expectedReplays: 0
    severity: hard
  - id: turn1-retry-stays-read-only
    type: tool_usage
    mustCall: []
    mustNotCall:
      - auth_by_phone
      - request_user_login_code
      - verify_user_login_code
      - request_human_takeover
    turnIndex: 1
    severity: hard
  - id: turn2-no-write-receipt
    type: fixture_effect_count
    operation: rsvp.write
    turnIndex: 2
    expectedAttempts: 0
    expectedSuccesses: 0
    expectedReplays: 0
    severity: hard
  - id: turn2-thanks-without-mutation
    type: tool_usage
    mustCall: []
    mustNotCall:
      - auth_by_phone
      - request_user_login_code
      - verify_user_login_code
      - request_human_takeover
    turnIndex: 2
    severity: hard
notes:
  - "RSVP extension v2 (2026-09-30): added a genuine turn-1 retry and a turn-2 thanks closure, each with hard no-write structural assertions and a hard requireJudge semantic judge grounded in the same fixture. Turn-0 expectations unchanged except explicit turnIndex 0 scoping. A shared sessionId now threads all three turns. Old v1 runs preserved; baseline and candidate must rerun on this v2 contract."
budget: { maxTurns: 3, estimatedPromptTokensPerTurn: 1700, estimatedCompletionTokensPerTurn: 180 }
scorers:
  - id: expectation-core
    type: expectation_pass_rate
    weight: 1
