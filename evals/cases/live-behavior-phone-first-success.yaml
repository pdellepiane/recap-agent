template: template.base-live
id: live_behavior.phone_first_auth_success
suite: live_behavior_regression
version: 1
description: A protected WhatsApp request authenticates automatically with the configured current phone.
tags: [live, behavior, authentication, phone-first, protected-information]
targetModes: [live_lambda]
inputs:
  - text: Quiero revisar la información de mi regalo.
    channel: whatsapp
    contactPhone: "$TERMINAL_CONTACT_PHONE"
    sessionId: phone-first-success-session
expectations:
  - id: first-turn-authenticates-by-phone
    type: tool_usage
    turnIndex: 0
    mustCall: [auth_by_phone]
    mustNotCall: [request_user_login_code]
    severity: hard
  - id: phone-auth-method-persists
    type: plan_field_equals
    turnIndex: 0
    path: user_auth.auth_method
    expected: phone
    severity: hard
  - id: phone-first-success-language
    type: text_semantic
    turnIndex: 0
    rubric: >-
      The protected gift-information request must use the current WhatsApp number automatically and continue naturally in Spanish. It must not ask the user to confirm that number and must not ask for an email or one-time code when phone authentication succeeds.
    minScore: 0.9
    requireJudge: true
    severity: hard
budget:
  maxTurns: 1
  estimatedPromptTokensPerTurn: 1800
  estimatedCompletionTokensPerTurn: 450
notes:
  - Set TERMINAL_CONTACT_PHONE to the normalized Peru success fixture before running the live gate; the phone is supplied through the environment and is not stored in this case file.
