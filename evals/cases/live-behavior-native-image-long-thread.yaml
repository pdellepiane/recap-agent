notes:
  - "User clarification 2026-09-14: never request images, replacement uploads,
    or URLs; URLs are backend-only. Images support understanding; they do not
    authorize payment approval."
  - Same run/case/session throughout. Backend fixture history and plan must
    evolve from actual preceding invocations; never seed expected assistant
    replies between turns. Each input is a separate invocation, not a new
    backend package contract.
  - New specification, not an implementation-complete claim. Run separately for
    diagnosis; mandatory full suite still required.
  - "R05 oracle revision v1 to v2, 2026-09-16, Packet E1 judge-truth binding. Old contextual-response-2/4 stated the visible amount S/ 250.00 in rubric prose with no digest-bound fixture truth, so a wrong amount failed only by prose comparison. New contract binds the existing E1 judgeGroundTruth digest mechanism to this case: the turn-1 image bytes are byte-identical to the live_behavior.image_file_delayed_question fixture (sha256 e6024548787bb4221c9dc53500f097e70e4c738283e2d684d70dba04c5cc764a, verified read-only against the case bytes, no repo writes), so the same manually verified text (Monto: S/ 250.00) is bound via judgeGroundTruth (boundInputTurn 1). Ground truth rides the judge context only via resolveJudgeOnlyImageGroundTruth, never runtime input, no new OCR/vision. Read-only amount is not backend approval. Thresholds 0.8, hard severity, requireJudge kept. Old v1 runs preserved; baseline and candidate must rerun on this v2 contract."
