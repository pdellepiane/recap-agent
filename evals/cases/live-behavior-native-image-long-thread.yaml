template: template.base-live
suite: live_behavior_regression
version: 1
tags:
  - live
  - behavior
  - conversation-continuity
  - long-thread
  - native-context-audit
targetModes:
  - live_lambda
backendFixture:
  scenario: image-clean-world
id: live_behavior.native_image_long_thread
description: "Six separate Lambda invocations in one conversation: text, image,
  question, gratitude, explicit recall, and payment-evidence boundary."
inputs:
  - text: Te voy a consultar unos datos; todavía no tengo una pregunta.
    channel: whatsapp
    contactPhone: "+51900027804"
    sessionId: live-native-image-long-thread
  - text: ""
    channel: whatsapp
    contactPhone: "+51900027804"
    sessionId: live-native-image-long-thread
    image:
      data: 
      mime_type: image/png
  - text: ¿Qué monto aparece en lo que te mandé?
    channel: whatsapp
    contactPhone: "+51900027804"
    sessionId: live-native-image-long-thread
  - text: Gracias, eso era todo.
    channel: whatsapp
    contactPhone: "+51900027804"
    sessionId: live-native-image-long-thread
  - text: ¿Me repites solo el monto que me dijiste?
    channel: whatsapp
    contactPhone: "+51900027804"
    sessionId: live-native-image-long-thread
  - text: Con ese monto, ¿puedes asegurar que la tienda ya aprobó el pago?
    channel: whatsapp
    contactPhone: "+51900027804"
    sessionId: live-native-image-long-thread
notes:
  - "User clarification 2026-09-14: never request images, replacement uploads,
    or URLs; URLs are backend-only. Images support understanding; they do not
    authorize payment approval."
  - Same run/case/session throughout. Backend fixture history and plan must
    evolve from actual preceding invocations; never seed expected assistant
    replies between turns. Each input is a separate invocation, not a new
    backend package contract.
  - New specification, not an implementation-complete claim. Run separately for
    diagnosis; mandatory full suite still required.
expectations:
  - id: image-arrival-silent
    type: trace_field_equals
    path: plan_persist_reason
    expected: image_file_silence
    turnIndex: 1
    severity: hard
  - id: no-unsolicited-effects-0
    type: tool_usage
    mustNotCall:
      - guest_rsvp
      - request_human_takeover
      - request_user_login_code
      - verify_user_login_code
    turnIndex: 0
    severity: hard
  - id: no-unsolicited-effects-1
    type: tool_usage
    mustNotCall:
      - guest_rsvp
      - request_human_takeover
      - request_user_login_code
      - verify_user_login_code
    turnIndex: 1
    severity: hard
  - id: no-unsolicited-effects-2
    type: tool_usage
    mustNotCall:
      - guest_rsvp
      - request_human_takeover
      - request_user_login_code
      - verify_user_login_code
    turnIndex: 2
    severity: hard
  - id: no-unsolicited-effects-3
    type: tool_usage
    mustNotCall:
      - guest_rsvp
      - request_human_takeover
      - request_user_login_code
      - verify_user_login_code
    turnIndex: 3
    severity: hard
  - id: no-unsolicited-effects-4
    type: tool_usage
    mustNotCall:
      - guest_rsvp
      - request_human_takeover
      - request_user_login_code
      - verify_user_login_code
    turnIndex: 4
    severity: hard
  - id: no-unsolicited-effects-5
    type: tool_usage
    mustNotCall:
      - guest_rsvp
      - request_human_takeover
      - request_user_login_code
      - verify_user_login_code
    turnIndex: 5
    severity: hard
  - id: contextual-response-2
    type: text_semantic
    rubric: Answer the visible amount S/ 250.00 directly in Spanish. Do not recite
      unrelated receipt fields. Never ask the customer for an image, a
      replacement upload, or a URL. Do not invent facts or expose internal
      storage details. Judge meaning and usefulness rather than exact phrasing.
    minScore: 0.8
    requireJudge: true
    turnIndex: 2
    severity: hard
  - id: contextual-response-3
    type: text_semantic
    rubric: Acknowledge the thanks briefly and naturally in Spanish. A validated
      silent disposition is also compliant for this no-task thanks. Do not restart
      an interview, repeat receipt details, ask a new question, or initiate an
      operation. Never ask the customer for an image, a replacement upload, or a
      URL. Do not invent facts or expose internal storage details. Judge meaning
      and usefulness rather than exact phrasing.
    minScore: 0.8
    requireJudge: true
    turnIndex: 3
    severity: hard
  - id: contextual-response-4
    type: text_semantic
    rubric: Repeat only the previously answered amount S/ 250.00 in natural Spanish.
      The earlier delivered answer is sufficient evidence; no exact wording or
      specific tool path is required. Never ask the customer for an image, a
      replacement upload, or a URL. Do not invent facts or expose internal
      storage details. Judge meaning and usefulness rather than exact phrasing.
    minScore: 0.8
    requireJudge: true
    turnIndex: 4
    severity: hard
  - id: contextual-response-5
    type: text_semantic
    rubric: Explain naturally in Spanish that the receipt amount alone cannot
      establish backend payment approval. No approved purchase is present in
      this fixture. Do not invent approval, say an unperformed verification
      occurred, or start an unsolicited human handoff. Never ask the customer
      for an image, a replacement upload, or a URL. Do not invent facts or
      expose internal storage details. Judge meaning and usefulness rather than
      exact phrasing.
    minScore: 0.8
    requireJudge: true
    turnIndex: 5
    severity: hard
budget:
  maxTurns: 6
  estimatedPromptTokensPerTurn: 6000
  estimatedCompletionTokensPerTurn: 300
