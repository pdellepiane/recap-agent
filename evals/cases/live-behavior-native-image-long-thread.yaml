  - id: contextual-response-2
    type: text_semantic
    rubric: >-
      Answer the visible amount directly in Spanish with the exact value from the judge-only ground truth for this fixture image (Monto S/ 250.00; verified amount S/ 250.00; read accuracy only, never backend payment approval). Do not recite
      unrelated receipt fields. Never ask the customer for an image, a
      replacement upload, or a URL. Do not invent facts or expose internal
      storage details. Judge meaning and usefulness rather than exact phrasing.
    minScore: 0.8
    requireJudge: true
    turnIndex: 2
    severity: hard
  - id: contextual-response-3
    type: text_semantic
    rubric: Acknowledge the thanks briefly and naturally in Spanish. A validated
      silent disposition is also compliant for this no-task thanks. Do not restart
      an interview, repeat receipt details, ask a new question, or initiate an
      operation. Never ask the customer for an image, a replacement upload, or a
      URL. Do not invent facts or expose internal storage details. Judge meaning
      and usefulness rather than exact phrasing.
    minScore: 0.8
    requireJudge: true
    turnIndex: 3
    severity: hard
  - id: contextual-response-4
    type: text_semantic
    rubric: Repeat only the previously answered amount in natural Spanish, matching the judge-only ground truth for this fixture image (verified amount S/ 250.00).
      The earlier delivered answer is sufficient evidence; no exact wording or
      specific tool path is required. Never ask the customer for an image, a
      replacement upload, or a URL. Do not invent facts or expose internal
      storage details. Judge meaning and usefulness rather than exact phrasing.
    minScore: 0.8
    requireJudge: true
    turnIndex: 4
    severity: hard
  - id: contextual-response-5
    type: text_semantic
    rubric: Explain naturally in Spanish that the receipt amount alone cannot
      establish backend payment approval. No approved purchase is present in
      this fixture. Do not invent approval, say an unperformed verification
      occurred, or start an unsolicited human handoff. Never ask the customer
      for an image, a replacement upload, or a URL. Do not invent facts or
      expose internal storage details. Judge meaning and usefulness rather than
      exact phrasing.
    minScore: 0.8
    requireJudge: true
    turnIndex: 5
    severity: hard
