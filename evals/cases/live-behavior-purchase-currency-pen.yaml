template: template.base-live
id: live_behavior.purchase_currency_pen_symbol
suite: live_behavior_regression
version: 1
description: A pending purchase row carrying currency_code PEN with currency_symbol S/ is accepted end-to-end without inventing currency or conversion.
tags: [live, behavior, purchase, currency, s08, s09]
targetModes: [live_lambda]
backendFixture:
  scenario: purchase-currency-pen
inputs:
  - text: Cual es el estado de mi compra pendiente para Mesa Mara y en que moneda esta?
    channel: whatsapp
    contactPhone: "+51900027701"
    sessionId: live-purchase-currency-pen-session
    backendFixture:
      scenario: purchase-currency-pen
notes:
  - Backend currency contract 2026-09-08. Synthetic identity only; fixture purchase-currency-pen carries PEN with S/ on a pending order row. Concise reply policy may omit amounts; the gate pins truthful status with no currency inference.
expectations:
  - id: currency-uses-phone-orders
    type: tool_usage
    mustCall: [lookup_guest_orders_by_phone]
    mustNotCall: [auth_by_phone, request_user_login_code, verify_user_login_code]
    severity: hard
  - id: currency-enters-information
    type: node_transition
    to: resolver_consultas_informativas
    severity: hard
  - id: currency-pen-no-inference
    type: text_semantic
    rubric: >-
      The fixture world contains one pending order for Mesa Mara for 250 with currency code PEN and symbol S/. The answer must be concise, natural, and entirely in Spanish and state the pending status truthfully. It must not claim another currency, must not invent an exchange rate or conversion, must not claim the order is approved, and must not ask for email, OTP, or a screenshot. Stating the amount with S/ or PEN is acceptable but not required.
    minScore: 0.85
    requireJudge: true
    severity: hard
budget:
  maxTurns: 1
  estimatedPromptTokensPerTurn: 1800
  estimatedCompletionTokensPerTurn: 300
