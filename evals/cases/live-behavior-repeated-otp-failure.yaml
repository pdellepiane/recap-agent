template: template.base-live
id: live_behavior.repeated_otp_failure_preserves_gift_query
suite: live_behavior_regression
version: 2
description: Version 2 supersedes the v1 two-failure contract under the user-approved one-shot OTP policy (plan revision 2, S06). The first rejected code verifies once, terminates OTP recovery, and hands off to human support; the second code never verifies. Incident ID retained.
tags: [live, behavior, authentication, purchase, reported-interaction]
targetModes: [live_lambda]
backendFixture:
  scenario: s02-otp-repeated-failure
inputs:
  - text: "753994"
    channel: whatsapp
    contactPhone: "+51900000903"
    sessionId: live-behavior-repeated-otp-session
  - text: "753994"
    channel: whatsapp
    contactPhone: "+51900000903"
    sessionId: live-behavior-repeated-otp-session
  - text: Ese es el código que me llegó
    channel: whatsapp
    contactPhone: "+51900000903"
    sessionId: live-behavior-repeated-otp-session
seedPlan:
  current_node: resolver_consultas_informativas
  contact_email: regression-otp@example.invalid
  contact_phone: "+51900000903"
  user_auth:
    status: code_requested
    email: regression-otp@example.invalid
    token: null
    token_expires_at: null
    last_error: null
    requested_at: "2026-07-31T15:52:10.867Z"
    failed_code_attempts: 0
    otp_send_attempts: 1
  information_state:
    resume_node: deteccion_intencion
    pending_requests:
      - requestId: information-1
        kind: purchase
        resource: gift_purchases
        query: Confirmar si el depósito del regalo llegó a los novios y revisar el estado del pago.
        orderId: null
        aspects: [payment_status, payment_details]
        sensitiveFields: [transaction_status, gateway_message, payment_id, operation_code]
        authAction: provide_otp
    selection_candidates: []
expectations:
  - id: first-code-verified-once
    type: tool_usage
    turnIndex: 0
    mustCall: [verify_user_login_code, request_human_takeover]
    mustNotCall: [request_user_login_code]
    severity: hard
  - id: second-code-never-verifies-nor-dispatches
    type: tool_usage
    turnIndex: 1
    mustNotCall: [verify_user_login_code, request_user_login_code, request_human_takeover]
    severity: hard
  - id: prose-follow-up-does-not-reverify
    type: tool_usage
    turnIndex: 2
    mustNotCall: [verify_user_login_code, request_user_login_code, request_human_takeover]
    severity: hard
  - id: single-failure-is-recorded
    type: plan_field_equals
    path: user_auth.failed_code_attempts
    expected: 1
    severity: hard
  - id: first-failure-persists-human-handoff
    type: plan_field_equals
    path: human_escalation.status
    expected: requested
    severity: hard
  - id: gift-query-remains-pending
    type: plan_field_subset
    path: information_state.pending_requests
    expected:
      - kind: purchase
        resource: gift_purchases
        query: Confirmar si el depósito del regalo llegó a los novios y revisar el estado del pago.
    severity: hard
  - id: no-copy-blame-or-email-loop-after-first-failure
    type: text_not_contains
    turnIndex: 1
    phrases:
      - cópialo completo
      - sin espacios adicionales
      - correo no deseado
      - bandeja principal
    severity: hard
  - id: turn0-auth-episode-ended-handoff-confirmed
    type: text_semantic
    turnIndex: 0
    rubric: >-
      The authentication episode has ended and the handoff gateway confirmed the support request. In Spanish, say human help has been requested. Do not offer another code, resend, email change or authentication attempt, claim authentication succeeded, or answer the protected question. It is not necessary to say a person has already joined or to repeat the pending question; state assertions verify preservation.
    minScore: 0.9
    requireJudge: true
    severity: hard
  - id: turn0-handoff-effect
    type: fixture_effect_count
    operation: handoff.write
    turnIndex: 0
    expectedAttempts: 1
    expectedSuccesses: 1
    expectedReplays: 0
    severity: hard
  - id: final-handoff-effect-unchanged
    type: fixture_effect_count
    operation: handoff.write
    turnIndex: 2
    expectedAttempts: 1
    expectedSuccesses: 1
    expectedReplays: 0
    severity: hard
budget:
  maxTurns: 3
  estimatedPromptTokensPerTurn: 1800
  estimatedCompletionTokensPerTurn: 450
