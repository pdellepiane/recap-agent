template: template.base-live
id: live_behavior.support_pending_question_completed
suite: live_behavior_regression
version: 1
description: "An ambiguous event-time question seeds a genuine pending question, the supplied event reference completes it with a grounded answer in the same turn, and thanks closes without restarting the task. No write occurs on any turn."
tags: [live, behavior, information, continuity, pending-question, reported-interaction]
targetModes: [live_lambda]
inputs:
  - text: ¿A qué hora es el evento?
    channel: whatsapp
    contactPhone: "+51941438999"
    sessionId: live-support-pending-question-completed
    backendFixture:
      scenario: rsvp-plus-one-multiple-pending
  - text: El de Ana y Luis, la boda.
    channel: whatsapp
    contactPhone: "+51941438999"
    sessionId: live-support-pending-question-completed
    backendFixture:
      scenario: rsvp-plus-one-multiple-pending
  - text: Gracias.
    channel: whatsapp
    contactPhone: "+51941438999"
    sessionId: live-support-pending-question-completed
    backendFixture:
      scenario: rsvp-plus-one-multiple-pending
backendFixture:
  scenario: rsvp-plus-one-multiple-pending
expectations:
  - id: turn0-ambiguous-time-no-write
    type: fixture_effect_count
    operation: rsvp.write
    turnIndex: 0
    expectedAttempts: 0
    expectedSuccesses: 0
    expectedReplays: 0
    severity: hard
  - id: turn0-ambiguous-time-no-mutation
    type: tool_usage
    mustNotCall: [guest_rsvp, auth_by_phone, request_user_login_code, verify_user_login_code, request_human_takeover]
    turnIndex: 0
    severity: hard
  - id: turn0-ambiguous-time-asks-bounded-selection
    type: text_semantic
    rubric: >-
      The trusted phone holds two pending invitations (Boda Ana y Luis and Cumpleaños Marta) and
      this turn names no event. The answer must be concise, natural, and entirely in Spanish; ask
      one bounded question offering those two candidate events so the user can choose which time
      they want. It must not guess one event and answer its time, must not claim any attendance
      was registered, and must not ask for email or an OTP.
    minScore: 0.9
    requireJudge: true
    turnIndex: 0
    severity: hard
  - id: turn1-reference-completes-no-write
    type: fixture_effect_count
    operation: rsvp.write
    turnIndex: 1
    expectedAttempts: 0
    expectedSuccesses: 0
    expectedReplays: 0
    severity: hard
  - id: turn1-reference-completes-no-mutation
    type: tool_usage
    mustNotCall: [guest_rsvp, auth_by_phone, request_user_login_code, verify_user_login_code, request_human_takeover]
    turnIndex: 1
    severity: hard
  - id: turn1-reference-answered-grounded
    type: text_semantic
    rubric: >-
      The user supplies the missing event reference (Boda Ana y Luis), resolving the pending time
      question. The answer must be concise, natural, and entirely in Spanish; give the Ana y Luis
      time (18:00 on 20 de septiembre de 2026) in this same turn from the available facts. It must
      not ask another clarifying question now that the evidence resolves the request, must not
      attribute Marta facts (21 de septiembre, 19:00, Cumpleaños Marta) to Ana y Luis, must not
      claim any attendance was registered, and must not ask for email or an OTP.
    minScore: 0.9
    requireJudge: true
    turnIndex: 1
    severity: hard
  - id: turn2-thanks-no-restart
    type: fixture_effect_count
    operation: rsvp.write
    turnIndex: 2
    expectedAttempts: 0
    expectedSuccesses: 0
    expectedReplays: 0
    severity: hard
  - id: turn2-thanks-no-restart-tools
    type: tool_usage
    mustNotCall: [guest_rsvp, lookup_rsvp_invitations, auth_by_phone, request_user_login_code, verify_user_login_code, request_human_takeover]
    turnIndex: 2
    severity: hard
  - id: turn2-thanks-closes-or-silent
    type: text_semantic
    rubric: >-
      The user only says thanks after the time question was answered. An empty assistant response
      is fully correct when the response classifier suppresses this simple thanks. If a response
      is sent, it must be entirely in Spanish as a brief natural closing that does not restart
      the time question, does not reopen an event selection, does not repeat event details, does
      not claim any new action, and does not ask for email or an OTP.
    minScore: 0.8
    requireJudge: true
    turnIndex: 2
    severity: hard
notes:
  - "2026-09-17 actionable-answer package Lane B: no existing case reconstructs this sequence. Checked equivalents: live_behavior.event_context_long_thread (every turn already names its event, so no pending question is ever seeded); live_behavior.rsvp_plus_one_multiple_events_requires_selection (single-turn selection demand with no completing reference or thanks); live_behavior.accountless_guest_event_uses_phone_without_otp and live_behavior.accountless_event_answer_precedes_remaining_private_auth (single-turn venue answers with the reference present from the start). This case seeds a genuine unresolved time question over fixture rsvp-plus-one-multiple-pending (Boda Ana y Luis event 8001 guest 80001 2026-09-20 18:00; Cumpleaños Marta event 8002 guest 80002 2026-09-21 19:00; trusted phone +51941438999), completes it with the missing reference in the same turn, and closes on thanks. Fixture effect pins are cumulative from the case baseline (0/0/0 on every turn: a read-only thread). Failing counterexamples: a promise-only reply that narrates help without the grounded time when the reference resolves it; an extra clarifying question after the evidence resolves the request; any guest_rsvp write; a restarted selection on thanks."
budget:
  maxTurns: 3
  estimatedPromptTokensPerTurn: 1700
  estimatedCompletionTokensPerTurn: 250
