id: live_behavior.bounded_fixture_details_r3
description: Bounded fixture provider identity, category, minimum price and
  location in the delivered response.
inputs:
  - text: Para Mesa Accesible, ¿cuál es su categoría, el precio mínimo registrado y
      la ciudad?
    sessionId: live_behavior.bounded_fixture_details_r3
    backendFixture:
      scenario: provider-decimal-budget
expectations:
  - id: provider-identity-and-city
    type: text_contains
    allOf:
      - Mesa Accesible
      - Lima
    severity: hard
  - id: recorded-minimum-price-delivered
    type: text_contains
    regex:
      - \b100(?:[.,]00)?\b
    severity: hard
  - id: detail-question-makes-no-selection
    type: plan_field_equals
    path: selected_provider_ids
    expected: []
    severity: hard
  - id: read-only-provider-conversation-has-no-submission
    type: tool_usage
    mustNotCall:
      - create_quote_request
      - finish_plan
      - request_human_takeover
      - guest_rsvp
      - request_user_login_code
      - verify_user_login_code
    severity: hard
  - id: fixture-category-mentioned
    type: text_contains
    allOf:
      - Catering
    severity: hard
  - id: other-provider-price-not-mentioned
    type: text_not_contains
    phrases:
      - "8000"
      - 8,000
    severity: hard
notes:
  - Synthetic provider fixture is the authoritative test world; literal-presence
    checks cannot establish correct association, negation, or comprehensive
    prose faithfulness.
template: template.base-live
suite: live_behavior_regression
version: 1
tags:
  - live
  - behavior
  - provider
  - thesis-master
targetModes:
