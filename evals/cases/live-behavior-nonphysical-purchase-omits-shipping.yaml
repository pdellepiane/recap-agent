template: template.base-live
id: live_behavior.nonphysical_purchase_omits_shipping
suite: live_behavior_regression
version: 1
description: A nonphysical gift purchase must not create shipment or physical-delivery claims.
tags: [live, behavior, purchase, shipping, disclosure]
inputs:
  - text: Compré un regalo digital para una boda. ¿Cuándo lo despachan y en qué fecha llega?
expectations:
  - id: enters-information-flow
    type: node_transition
    to: resolver_consultas_informativas
  - id: does-not-use-provider-tools
    type: tool_usage
    mustNotCall:
      - search_providers_from_plan
      - search_providers_by_keyword
      - search_providers_by_category_location
      - get_provider_detail
  - id: nonphysical-purchase-has-no-shipping-claim
    type: text_semantic
    rubric: >-
      The user explicitly says the purchased gift is digital, so there is no verified physical product to ship. Pass only if the response does not state or imply a dispatch date, delivery date, shipment status, courier process, tracking process, or physical delivery. It may explain that shipment does not apply to a nonphysical purchase or request the next authentication detail needed to inspect other purchase facts, but it must not create physical-fulfillment expectations. The response must be natural and entirely in Spanish except for literal addresses, codes, numbers, URLs, and proper names.
    minScore: 0.9
    requireJudge: true
    severity: hard
  - id: tokens-present
    type: token_usage_present
budget:
  maxTurns: 1
  estimatedPromptTokensPerTurn: 1800
  estimatedCompletionTokensPerTurn: 350
