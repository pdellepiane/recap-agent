template: template.base-live
id: live_behavior.rsvp_plus_one_uses_phone_scoped_mutation
suite: live_behavior_regression
version: 1
description: A single explicit +1 response uses the trusted-phone RSVP endpoint and reports only the typed saved outcome.
tags: [live, behavior, rsvp, plus-one, minimum-disclosure, spanish]
targetModes: [live_lambda]
inputs:
  - text: También asistirá mi acompañante a Michelle & Jorge
    channel: whatsapp
    contactPhone: "+51942633292"
    sessionId: live-rsvp-plus-one-phone-session
backendFixture:
  scenario: rsvp-plus-one-saved
expectations:
  - id: enters-rsvp-node
    type: node_transition
    to: responder_invitacion
    severity: hard
  - id: phone-scoped-plus-one-mutation
    type: tool_usage
    mustCall: [lookup_rsvp_invitations, guest_rsvp]
    mustNotCall: [request_human_takeover, auth_by_phone, request_user_login_code, verify_user_login_code]
    severity: hard
  - id: saved-outcome-only
    type: text_semantic
    rubric: >-
      The user explicitly says that one companion will attend Michelle & Jorge. The fixture guarantees POST /guest/rsvp returns plus_one.saved true with the documented shape (200, saved true). The answer must be concise, natural Latin American Spanish, explicitly confirm that the companion was registered as attending (for example "tu acompañante fue registrado", "acompañante confirmado", or similar success confirmation with the event name), and reflect only the typed saved outcome. It must not say the companion was not saved, must not offer a vague pending state, must never claim success without saved=true (now guaranteed), never request email or OTP, never expose guest_id or raw API fields, and never restart with a generic welcome.
    minScore: 0.9
    requireJudge: true
    severity: hard
  - id: no-raw-rsvp-fields
    type: text_not_contains
    phrases: ["guest_id", "plus_one", "saved=true", "saved=false"]
    severity: hard
budget:
  maxTurns: 1
  estimatedPromptTokensPerTurn: 1500
  estimatedCompletionTokensPerTurn: 180
