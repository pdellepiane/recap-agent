template: template.base-live
id: live_behavior.image_unavailable_captioned
suite: live_behavior_regression
version: 9
description: An explicit describe request on an image is answered and recalled; three consecutive undeliverable images (unavailable greeting, too-large delivery, malformed payload) then each get Spanish recovery; a thanks closes the thread.
tags: [ live, behavior, image, image-error, caption, s17, image-file, base64-persistence, explicit-describe ]
targetModes: [ live_lambda ]
backendFixture:
  scenario: image-clean-world
inputs:
  - text: Describe lo que ves en esta imagen con detalle
    channel: whatsapp
    contactPhone: "+51987654321"
    sessionId: live-image-unavailable-captioned-session
    image:
      data: 
      mime_type: image/png
    backendFixture:
      scenario: image-clean-world
  - text: Perdona, ¿me repites lo último que me dijiste?
    channel: whatsapp
    contactPhone: "+51987654321"
    sessionId: live-image-unavailable-captioned-session
    backendFixture:
      scenario: image-clean-world
  - text: Hola
    channel: whatsapp
    contactPhone: "+51987654321"
    sessionId: live-image-unavailable-captioned-session
    image:
      error: media_unavailable
      mime_type: image/jpeg
    backendFixture:
      scenario: image-clean-world
  - text: ''
    channel: whatsapp
    contactPhone: "+51987654321"
    sessionId: live-image-unavailable-captioned-session
    image:
      error: image_too_large
      mime_type: image/jpeg
    backendFixture:
      scenario: image-clean-world
  - text: Que ves ahi?
    channel: whatsapp
    contactPhone: "+51987654321"
    sessionId: live-image-unavailable-captioned-session
    image:
      data: "!!!!not-valid-base64!!!!"
      mime_type: image/png
    backendFixture:
      scenario: image-clean-world
  - text: Gracias, lo reviso y te aviso.
    channel: whatsapp
    contactPhone: "+51987654321"
    sessionId: live-image-unavailable-captioned-session
    backendFixture:
      scenario: image-clean-world
notes:
  - "Merge v6, 2026-09-30: absorbed live_behavior.image_too_large_fallback as turn 1 and live_behavior.image_file_malformed_unavailable as turn 2 (same phone and fixture image-clean-world, ids/contracts preserved) and added a turn-3 thanks closure. Turn-0 expectations unchanged apart from turnIndex. Deleted files: live-behavior-image-too-large.yaml, live-behavior-image-file-malformed.yaml."
  - "F1 2026-09-12: backendFixture scenario image-clean-world; this phone has empty initial history and empty authorized purchase results; never mutable backend data."
  - Backend image forwarding contract 2026-09-08 error variant. No bytes are transmitted.
  - "R05 oracle revision v2 to v3, 2026-09-12, Packet F3. Old unavailable-caption-fallback-appended demanded a fixed appended resend sentence and unavailable-caption-enters-intent forced the intent template, failing a greeting that ignored the lost image another way (matrix: greeting ignores unavailable image). New contract judges one useful model-written reply without fixed phrases. Successful-upload checks stay separate from this unavailable-image path. Old v2 runs preserved; baseline and candidate must rerun on this v3 contract."
  - "R05 oracle revision v3 to v4, 2026-09-14, Packet EX1. Old unavailable-caption-answered-plus-recovery demanded resending the image or writing the information in text, failing URL-ask or DB-answer recovery (matrix: re-upload demands contradict the 2026-09-14 operator doctrine; recovery is a URL link the assistant can open or an answer from profile evidence). New contract passes a URL-ask or an answer from available evidence and fails any demand to re-upload or resend the image file. Old v3 runs preserved; baseline and candidate must rerun on this v4 contract."
  - "R05 oracle revision v4 to v5, 2026-09-16, final support rescue task 3 (customer URL doctrine alignment). The v4 URL-ask pass path contradicts the backend-only URL doctrine held by the expired-reference oracle (URLs arrive from the backend only; the customer is never required to supply a URL). New contract passes handling the caption plus an answer from available evidence or a useful open question about what the customer needs, and fails any demand to re-upload or resend the image file as well as any request for a URL link. Threshold 0.8, hard severity, requireJudge kept. Old v4 runs preserved; baseline and candidate must rerun on this v5 contract."
  - "Merge v7, 2026-09-30 (IMGMISC lane): absorbed live_behavior.image_file_explicit_describe as turns 0-1 (same phone and fixture image-clean-world, ids/contracts preserved, turnIndex renumbered); turn 5 carries both thanks guards plus both thanks judges, absorbed thanks-acknowledged-in-spanish renamed to describe-thanks-acknowledged-in-spanish for id uniqueness with rubric bytes unchanged. Deleted file: live-behavior-image-file-explicit-describe.yaml."
