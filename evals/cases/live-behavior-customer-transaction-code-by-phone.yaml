template: template.base-live
id: live_behavior.customer_transaction_code_by_phone
suite: live_behavior_regression
version: 1
description: A customer-facing COD transaction reference is resolved as a phone-scoped purchase request without exposing internal order ids or starting authentication.
tags: [live, behavior, purchase, phone-orders, customer-transaction-code, reported-interaction]
targetModes: [live_lambda]
inputs:
  - text: COD301816
    channel: whatsapp
    contactPhone: "+51990027179"
    sessionId: live-customer-transaction-code-session
expectations:
  - id: transaction-code-enters-information
    type: node_transition
    to: resolver_consultas_informativas
    severity: hard
  - id: transaction-code-uses-phone-orders
    type: tool_usage
    mustCall: [lookup_guest_orders_by_phone]
    mustNotCall: [auth_by_phone, request_user_login_code, verify_user_login_code]
    severity: hard
  - id: transaction-code-is-handled-as-purchase-reference
    type: text_semantic
    rubric: >-
      The user sent the customer-facing transaction reference COD301816 in an abandoned-cart and purchase conversation. The response must treat it as a purchase reference and be entirely in natural Spanish. If the backend exposes transaction number 301816, answer from that matched purchase and identify it as COD301816. If the phone-scoped backend omits customer transaction numbers, clearly say that the code could not be linked directly, present the available purchases using event/date/amount/status rather than opaque internal ids, and ask the user to select one. It must not ask generically what the user wants to do with the code, must not request email or OTP, and must not reveal opaque Agent API order ids or sensitive payment details.
    minScore: 0.9
    requireJudge: true
    severity: hard
budget:
  maxTurns: 1
  estimatedPromptTokensPerTurn: 1500
  estimatedCompletionTokensPerTurn: 240
