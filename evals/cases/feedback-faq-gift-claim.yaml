template: template.base-offline
id: feedback.faq_gift_product_claim_clear_next_steps
suite: feedback_regression
version: 1
description: Gift/product claim questions should explain optional gifts, value received, brand claims, and support.
tags: [feedback, batch2, faq]
inputs:
  - text: Tengo un problema con un regalo de mi web, ¿estoy obligado a comprarlo o reclamo con la marca?
fixtures:
  offline:
    extractionsByTurn:
      - actionIntent: null
        informationRequests:
          - kind: purchase
            resource: gift_purchases
            query: Tengo un problema con un regalo de mi web.
            orderId: null
            aspects: [summary]
            sensitiveFields: []
            authAction: provide_email
        intentConfidence: 0.95
        eventType: null
        vendorCategory: null
        vendorCategories: []
        activeNeedCategory: null
        location: null
        budgetSignal: null
        guestRange: null
        preferences: []
        hardConstraints: []
        assumptions: []
        conversationSummary: Pregunta por regalos, compra obligatoria y reclamo con marca.
        selectedProviderHints: []
        pauseRequested: false
    repliesByTurn:
      - Para revisar el regalo necesito el correo usado en la compra y te enviaré un código de verificación. El número de orden es opcional, pero ayuda a ubicar una compra específica.
expectations:
  - id: faq-node
    type: node_transition
    to: resolver_consultas_informativas
  - id: gift-claim-copy
    type: text_contains
    allOf: [correo]
    anyOf: [número de orden, orden]
  - id: no-provider-search
    type: tool_usage
    mustNotCall:
      - search_providers_from_plan
      - search_providers_by_query_intent
