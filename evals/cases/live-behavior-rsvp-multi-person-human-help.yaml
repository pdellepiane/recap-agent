template: template.base-live
id: live_behavior.rsvp_multi_person_offers_human_help
suite: live_behavior_regression
version: 1
description: Multi-person RSVP reference triggers human support disclosure for companions without claiming companion registration and without RSVP vocabulary.
tags: [live, behavior, rsvp, multi-person, human-help, spanish]
targetModes: [live_lambda]
inputs:
  - text: Hola, confirmo mi asistencia y la de mi esposa Maria para el evento del sabado
    channel: whatsapp
    contactPhone: "+51973296571"
    sessionId: live-rsvp-multi-person-human-help-session
expectations:
  - id: enters-rsvp-node
    type: node_transition
    to: responder_invitacion
    severity: hard
  - id: multi-person-offers-human-help
    type: text_semantic
    rubric: >-
      The user confirms attendance for themselves and a companion (partner Maria). The response must be entirely in natural Latin American Spanish, acknowledge warmly both people, confirm it will handle the user's own attendance per the conversation, and clearly state that our human support team will help confirm the attendance for the other person(s) (for example "nuestro equipo de apoyo humano te ayudara con la confirmacion"). It must not claim that the companion's attendance was already registered or mutated, must not invent companion registration, and must not offer to do nothing. It must remain natural and helpful.
    minScore: 0.9
    requireJudge: true
    severity: hard
  - id: no-rsvp-vocabulary
    type: text_not_contains
    phrases: ["RSVP", "rsvp"]
    severity: hard
budget:
  maxTurns: 1
  estimatedPromptTokensPerTurn: 1600
  estimatedCompletionTokensPerTurn: 250
