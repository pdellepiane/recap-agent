template: template.base-live
id: live_behavior.rsvp_multi_person_offers_human_help
suite: live_behavior_regression
version: 4
description: Multi-person RSVP reference triggers additive human support disclosure for companions (selection enumeration + disclosure) without claiming companion registration, without RSVP vocabulary, and without overclaiming attendance while selection is pending.
tags: [live, behavior, rsvp, multi-person, human-help, spanish]
targetModes: [live_lambda]
inputs:
  - text: Hola, confirmo mi asistencia y la de mi esposa Maria para el evento del sabado
    channel: whatsapp
    contactPhone: "+51973296571"
    sessionId: live-rsvp-multi-person-human-help-session
expectations:
  - id: enters-rsvp-node
    type: node_transition
    to: responder_invitacion
    severity: hard
  - id: multi-person-offers-human-help
    type: text_semantic
    rubric: >-
      The user confirms attendance for themselves and a companion (partner Maria) and the phone lookup returned multiple invitations requiring selection. The response must be entirely in natural Latin American Spanish, warmly acknowledge the user's request (e.g., thanking for confirming for both), acknowledge warmly both people, confirm it will handle the user's own attendance per the conversation, and clearly state that our human support team will help confirm the attendance for the other person(s) (for example "nuestro equipo de apoyo humano te ayudara con la confirmacion de Maria"). It must be additive: when multiple candidate events require selection, the response must IN ADDITION enumerate the candidate events with names/dates and ask one question to choose, while still including the human-help sentence in the same reply. The warm acknowledgement must appear before or alongside the disclosure. While the event selection is pending (awaiting_event_selection), the reply must NOT state or imply that any attendance (own or companion's) is confirmed — own confirmation happens only after a grounded selection + explicit decision; the human-help disclosure covers the companion's confirmation path. It must not claim that the companion's attendance was already registered or mutated, must not invent companion registration, must not offer to do nothing, must not use RSVP vocabulary. A reply that confirms or implies the user's own attendance is already confirmed while still asking to choose (e.g., "aplicar tu confirmacion") violates the no-overclaim rule and must fail. It must remain natural and helpful.
    minScore: 0.9
    requireJudge: true
    severity: hard
  - id: no-rsvp-vocabulary
    type: text_not_contains
    phrases: ["RSVP", "rsvp"]
    severity: hard
budget:
  maxTurns: 1
  estimatedPromptTokensPerTurn: 1600
  estimatedCompletionTokensPerTurn: 250
