template: template.base-live
id: live_behavior.rsvp_multi_person_offers_human_help
suite: live_behavior_regression
version: 10
description: RSVP for more than one additional companion remains a bounded human-review case; the single +1 case is handled separately through POST /guest/rsvp.
tags: [live, behavior, rsvp, multi-person, human-help, spanish]
targetModes: [live_lambda]
inputs:
  - text: Hola, confirmo mi asistencia y la de Maria y Carlos para el evento del sabado
    channel: whatsapp
    contactPhone: "+51941438449"
    sessionId: live-rsvp-multi-person-human-help-session
backendFixture:
  scenario: rsvp-plus-one-saved
expectations:
  - id: enters-rsvp-node
    type: node_transition
    to: responder_invitacion
    severity: hard
  - id: no-mutation
    type: tool_usage
    mustNotCall: [guest_rsvp, lookup_rsvp_invitations, lookup_guest_events_by_phone, get_guest_event_detail, auth_by_phone, request_user_login_code, verify_user_login_code]
    severity: hard
  - id: handoff-registered
    type: tool_usage
    mustCall: [request_human_takeover]
    severity: hard
  - id: multi-person-offers-human-help
    type: text_semantic
    rubric: >-
      The user asks to confirm attendance for themselves and two additional people, Maria and Carlos. The current API supports only one +1, so the response must be entirely in natural Latin American Spanish, acknowledge the request, and state that human support will help. It must NOT silently truncate the request to one companion, enumerate events, ask to select an event, claim any attendance was already registered, or call the RSVP mutation. The reply must be one concise code-composed handoff sentence.
    minScore: 0.9
    requireJudge: true
    severity: hard
  - id: no-overclaim-apply-confirmation
    type: text_not_contains
    phrases: ["aplicar la confirmación", "aplicar la confirmacion"]
    severity: hard
  - id: no-rsvp-vocabulary
    type: text_not_contains
    phrases: ["RSVP", "rsvp"]
    severity: hard
budget:
  maxTurns: 1
  estimatedPromptTokensPerTurn: 1600
  estimatedCompletionTokensPerTurn: 250
