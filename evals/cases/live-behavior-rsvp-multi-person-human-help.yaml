template: template.base-live
id: live_behavior.rsvp_multi_person_offers_human_help
suite: live_behavior_regression
version: 6
description: Multi-person RSVP reference triggers code-composed warm lead "¡Con gusto!" plus deterministic human support disclosure for companions (selection enumeration via multipleRsvpInvitationsNote format + disclosure fragment "Para confirmar la asistencia de {nombres}, nuestro equipo de apoyo humano te ayudará." + exact question "¿Para cuál de estos eventos deseas registrar tu asistencia?" scoped to user's own attendance) without claiming companion registration, without RSVP vocabulary, without overclaim "aplicar la confirmación" while selection is pending.
tags: [live, behavior, rsvp, multi-person, human-help, spanish]
targetModes: [live_lambda]
inputs:
  - text: Hola, confirmo mi asistencia y la de mi esposa Maria para el evento del sabado
    channel: whatsapp
    contactPhone: "+51973296571"
    sessionId: live-rsvp-multi-person-human-help-session
expectations:
  - id: enters-rsvp-node
    type: node_transition
    to: responder_invitacion
    severity: hard
  - id: multi-person-offers-human-help
    type: text_semantic
    rubric: >-
      The user confirms attendance for themselves and a companion (partner Maria) and the phone lookup returned multiple invitations requiring selection. The response must be entirely in natural Latin American Spanish, warmly acknowledge the user's request via the deterministic warm lead "¡Con gusto!" (code-composed, satisfies warm-ack), enumerate the candidate events with names/dates, ask the exact selection question fragment "¿Para cuál de estos eventos deseas registrar tu asistencia?" scoped to the user's OWN attendance (never implying companion's attendance is registered by selection), and clearly state that our human support team will help confirm the attendance for the other person(s) via the deterministic disclosure fragment "Para confirmar la asistencia de Maria, nuestro equipo de apoyo humano te ayudará." (or with names present) as the final sentence (tissue optional single courtesy sentence before it is allowed). It must be code-composed for self_and_others + awaiting_event_selection (per hybrid policy). While the event selection is pending (awaiting_event_selection), the reply must NOT state or imply that any attendance (own or companion's) is confirmed — own confirmation happens only after a grounded selection + explicit decision; the human-help disclosure covers the companion's confirmation path. It must not claim that the companion's attendance was already registered or mutated, must not invent companion registration, must not use "aplicar la confirmación" phrasing nor imply companion registration via selection, must not use RSVP vocabulary. A reply that says "aplicar la confirmación" or implies the companion's attendance is being registered violates the forbidden phrase and must fail. It must remain natural and helpful.
    minScore: 0.9
    requireJudge: true
    severity: hard
  - id: no-overclaim-apply-confirmation
    type: text_not_contains
    phrases: ["aplicar la confirmación", "aplicar la confirmacion"]
    severity: hard
  - id: no-rsvp-vocabulary
    type: text_not_contains
    phrases: ["RSVP", "rsvp"]
    severity: hard
budget:
  maxTurns: 1
  estimatedPromptTokensPerTurn: 1600
  estimatedCompletionTokensPerTurn: 250
