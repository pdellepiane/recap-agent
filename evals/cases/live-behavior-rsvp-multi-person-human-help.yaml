template: template.base-live
id: live_behavior.rsvp_multi_person_offers_human_help
suite: live_behavior_regression
version: 9
description: Multi-person RSVP triggers single-sentence backend-registered handoff to human support (request_human_takeover), no RSVP mutation, no enumeration or selection. Seed phone mirrors jose/cinthya pattern for resolveEscalationPhone.
tags: [live, behavior, rsvp, multi-person, human-help, spanish]
targetModes: [live_lambda]
inputs:
  - text: Hola, confirmo mi asistencia y la de mi esposa Maria para el evento del sabado
    channel: whatsapp
    contactPhone: "+51941438449"
    sessionId: live-rsvp-multi-person-human-help-session
expectations:
  - id: enters-rsvp-node
    type: node_transition
    to: responder_invitacion
    severity: hard
  - id: no-mutation
    type: tool_usage
    mustNotCall: [guest_rsvp, lookup_rsvp_invitations, lookup_guest_events_by_phone, get_guest_event_detail, auth_by_phone, request_user_login_code, verify_user_login_code]
    severity: hard
  - id: handoff-registered
    type: tool_usage
    mustCall: [request_human_takeover]
    severity: hard
  - id: multi-person-offers-human-help
    type: text_semantic
    rubric: >-
      The user confirms attendance for themselves and a companion (partner Maria). The response must be entirely in natural Latin American Spanish, warmly acknowledge the request for both people, and clearly state that the human support team will help confirm attendance for the companion/named people (e.g., "nuestro equipo de apoyo humano te ayudará" for Maria / "tu acompañante" fallback). It must NOT enumerate events, NOT ask to select an event, NOT claim any attendance was already registered or mutated, NOT use "aplicar la confirmación" phrasing, and NOT imply that any registration happened. A reply that enumerates events, asks "¿Para cuál de estos eventos deseas registrar tu asistencia?", claims companion registration, or says "aplicar la confirmación" violates the handoff contract and must fail. The reply must be the single handoff sentence (one sentence, code-composed) and be warm and helpful in Spanish.
    minScore: 0.9
    requireJudge: true
    severity: hard
  - id: no-overclaim-apply-confirmation
    type: text_not_contains
    phrases: ["aplicar la confirmación", "aplicar la confirmacion"]
    severity: hard
  - id: no-rsvp-vocabulary
    type: text_not_contains
    phrases: ["RSVP", "rsvp"]
    severity: hard
budget:
  maxTurns: 1
  estimatedPromptTokensPerTurn: 1600
  estimatedCompletionTokensPerTurn: 250
