  user_auth:
    status: code_requested
    email: stefany_ljsv4@hotmail.com
    token: null
    token_expires_at: null
    last_error: null
    requested_at: "2026-08-13T21:55:52.166Z"
    failed_code_attempts: 0
  information_state:
    resume_node: deteccion_intencion
    pending_requests:
      - requestId: information-1
        kind: purchase
        resource: gift_purchases
