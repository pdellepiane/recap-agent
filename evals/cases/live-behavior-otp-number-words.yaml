expectations:
  - id: word-code-is-submitted
    type: tool_usage
    mustCall: [verify_user_login_code]
    severity: hard
  - id: word-code-is-not-rejected-for-format
    type: text_not_contains
    phrases:
      - escríbelo como números
      - sin palabras
      - no pude leer el código
    severity: hard
  - id: word-code-receives-correct-outcome
    type: text_semantic
    rubric: >-
      The user supplied a six-digit one-time code as an unambiguous sequence of Spanish digit words. Pass only if the agent treats it as a code and attempts verification. The response may report the backend verification result, but it must not ask the user to rewrite the same code using digits or claim that number words are unreadable. It must not invent a purchase result before authentication succeeds, and it must remain entirely in Spanish except for literal addresses, codes, numbers, URLs, and proper names.
    minScore: 0.9
    requireJudge: true
    severity: hard
budget:
  maxTurns: 1
  estimatedPromptTokensPerTurn: 1800
  estimatedCompletionTokensPerTurn: 450
