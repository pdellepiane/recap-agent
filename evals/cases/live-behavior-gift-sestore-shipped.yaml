template: template.base-live
id: live_behavior.gift_sestore_shipped_answers_data
suite: live_behavior_regression
version: 6
description: A physical gift with recorded shipment data is answered from that data with no unnecessary handoff; a delivery-status follow-up and thanks close the thread.
tags: [ live, behavior, purchase, gift, shipping, fulfillment, sestore ]
targetModes: [ live_lambda ]
backendFixture:
  scenario: purchase-gift-sestore-shipped
inputs:
  - text: Compré el juego de sábanas como regalo. ¿En qué estado está el envío?
    channel: whatsapp
    contactPhone: "+51999350215"
    sessionId: live-gift-sestore-shipped
    backendFixture:
      scenario: purchase-gift-sestore-shipped
  - text: ¿Ya lo entregaron o sigue en camino?
    channel: whatsapp
    contactPhone: "+51999350215"
    sessionId: live-gift-sestore-shipped
    backendFixture:
      scenario: purchase-gift-sestore-shipped
  - text: Gracias, quedó claro.
    channel: whatsapp
    contactPhone: "+51999350215"
    sessionId: live-gift-sestore-shipped
    backendFixture:
      scenario: purchase-gift-sestore-shipped
expectations:
  - id: shipped-uses-gift-read
    type: tool_usage
    mustCall: []
    mustNotCall: [ auth_by_phone, request_user_login_code, verify_user_login_code, guest_rsvp ]
    turnIndex: 0
    severity: hard
  - id: shipped-no-handoff-needed
    type: fixture_effect_count
    operation: handoff.write
    expectedAttempts: 0
    expectedSuccesses: 0
    expectedReplays: 0
    turnIndex: 0
    severity: hard
  - id: shipped-t1-no-handoff-needed
    type: fixture_effect_count
    operation: handoff.write
    expectedAttempts: 0
    expectedSuccesses: 0
    expectedReplays: 0
    turnIndex: 1
    severity: hard
  - id: shipped-t2-no-handoff-needed
    type: fixture_effect_count
    operation: handoff.write
    expectedAttempts: 0
    expectedSuccesses: 0
    expectedReplays: 0
    turnIndex: 2
    severity: hard
notes:
  - "2026-09-30 purchase-lane extension v4: grows 1 turn to 3 with a delivery-status follow-up and a thanks closure. Pre-existing expectations gain explicit turnIndex 0 because un-indexed expectations evaluate the final turn."
  - "R05 oracle revision v2 to v3, 2026-09-25: Remove obsolete authorized-order-read prohibition; retain protected effects and authentication boundaries. Historical runs retain their original verdicts; rerun only explicitly selected cases on these revised bytes."
  - "R05 oracle revision v1 to v2, 2026-09-21, gift/campaign review correction 3. Rubric now requires the in-transit state in natural words rather than the raw enum, adds the no-internal-code-citation requirement, and states that an optional support offer is not an executed escalation. Threshold and hard severity kept. Old v1 runs preserved; baseline and candidate must rerun on this v2 contract."
budget:
  maxTurns: 3
  estimatedPromptTokensPerTurn: 1800
  estimatedCompletionTokensPerTurn: 300
scorers:
  - id: expectation-core
    type: expectation_pass_rate
    weight: 1
