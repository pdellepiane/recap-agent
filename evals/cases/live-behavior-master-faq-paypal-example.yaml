id: live_behavior.master_faq_paypal_example
suite: live_behavior_regression
version: 1
description: "Master study public FAQ: paypal_example. Checks explicitly
  requested published values, not general prose faithfulness."
tags:
  - live
  - behavior
  - master-study
  - faq
  - live-kb
targetModes:
  - live_lambda
backendFixture:
  scenario: master-faq-public-empty
inputs:
  - text: Para el ejemplo publicado de regalo de US$100 con la comisión a cargo del
      invitado, ¿cuánto paga por PayPal y cuánto recibe el anfitrión?
    channel: whatsapp
    contactPhone: "+51900007000"
    sessionId: live_behavior.master_faq_paypal_example
    backendFixture:
      scenario: master-faq-public-empty
expectations:
  - id: requested-published-value-delivered
    type: text_contains
    regex:
      - (?<![0-9])110(?![0-9])
      - (?<![0-9])100(?![0-9])
    turnIndex: 0
    severity: hard
  - id: no-private-auth-or-side-effect
    type: tool_usage
    mustCall: []
    mustNotCall:
      - auth_by_phone
      - request_user_login_code
      - verify_user_login_code
      - guest_rsvp
      - request_human_takeover
      - create_quote_request
      - finish_plan
    turnIndex: 0
    severity: hard
  - id: no-rsvp.write
    type: fixture_effect_count
    operation: rsvp.write
    turnIndex: 0
    expectedAttempts: 0
    expectedSuccesses: 0
    expectedReplays: 0
    severity: hard
  - id: no-handoff.write
    type: fixture_effect_count
    operation: handoff.write
    turnIndex: 0
    expectedAttempts: 0
    expectedSuccesses: 0
    expectedReplays: 0
    severity: hard
  - id: no-provider.quote.write
    type: fixture_effect_count
    operation: provider.quote.write
    turnIndex: 0
    expectedAttempts: 0
    expectedSuccesses: 0
    expectedReplays: 0
    severity: hard
scorers:
  - id: objective-obligations
    type: expectation_pass_rate
    weight: 1
budget:
  maxTurns: 1
notes:
  - "Independent oracle source: knowledge-base/articles/cuanto-cuesta.md. Freeze
    its exact bytes before study execution."
  - No knowledgeBase fixture passages are supplied; the deployed live KB
    retrieves evidence. Value-presence checks are bounded and do not prove
    complete attribution, absence of contradiction, or full response
    faithfulness.
  - Synthetic private backend world; no real customer effect authorized. New
    study scenario, no historical case is regraded.
