template: template.base-live
id: live_behavior.s11_rsvp_durability_confirms_once
suite: live_behavior_regression
version: 1
description: S11 durability twin of the reversal world. The explicit attending decision ends confirmed with the effect intent persisted before execution and the confirmed result persisted before reply, exactly one RSVP write, and no unsupported success claim.
tags: [live, behavior, rsvp, durability, s11]
targetModes: [live_lambda]
inputs:
  - text: Sí, cámbiala para confirmar que asistiré.
    channel: whatsapp
    contactPhone: "+51973296571"
    sessionId: live-s11-durability-session
seedPlan:
  current_node: responder_invitacion
  intent: responder_invitacion
  rsvp_state:
    status: awaiting_action
    pending_action: attending
    candidates:
      - guest_id: 584353
        event_name: Otra celebración prueba
        event_date: "2026-08-19 05:00:00"
    requested_at: "2026-08-20T15:00:00.000Z"
    selection_attempts: 0
backendFixture:
  scenario: s02-rsvp-reversal
rsvpIsolation:
  setup:
    guestId: 584353
    eventName: Otra celebración prueba
    phone: "+51973296571"
    targetState: declining
  teardown:
    guestId: 584353
    eventName: Otra celebración prueba
    phone: "+51973296571"
    restore: true
expectations:
  - id: remains-in-rsvp-node
    type: node_transition
    to: responder_invitacion
    severity: hard
  - id: reads-authoritative-rsvp-state
    type: tool_usage
    mustCall: [lookup_rsvp_invitations]
    mustNotCall: [auth_by_phone, request_user_login_code, verify_user_login_code]
    severity: hard
  - id: reports-confirmed-final-state-once
    type: text_semantic
    rubric: >-
      The user explicitly confirmed attending guest invitation 584353 for Otra celebración prueba. The authoritative final state says the guest will attend after one durable RSVP effect whose intent was persisted before execution and whose confirmed result was persisted before reply. The response must be natural and entirely in Spanish, clearly say attendance is confirmed, and must not claim the invitation remains declined, claim a repeated write or retry, ask for email or a code, expose internal fields, or offer human support as if the operation failed.
    minScore: 0.9
    requireJudge: true
    severity: hard
  - id: no-rsvp-vocabulary
    type: text_not_contains
    phrases: ["RSVP", "rsvp"]
    severity: hard
budget:
  maxTurns: 1
  estimatedPromptTokensPerTurn: 1800
  estimatedCompletionTokensPerTurn: 300
