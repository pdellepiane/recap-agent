notes:
  - "R05 oracle revision v6 to v7, 2026-09-16, final support rescue tasks 4 and 5. Fixture: evals/fixtures/rsvp-cristian-michelle-jorge.json now supplies delivered outbound campaign evidence (recentMessages, direction outbound, source campaign, sent_at timestamp, status delivered) for the subject, with provenance in the fixture note; baseline and candidate share identical bytes. Rubric: the old contract demanded attending polarity, event name, date, and an explicit no-write recital as joint factual requirements, failing useful confirmed-state answers that omitted the date or the recital. New contract keeps attending polarity and event name as hard requirements, treats the recorded date as supporting detail (wrong date still fails), and bans false new-mutation claims without demanding a recital. Threshold 0.9, hard severity, requireJudge kept. Old v6 runs preserved; baseline and candidate must rerun on this v7 contract."
  - "RSVP extension v8 (2026-09-30): added a genuine turn-1 time question and a turn-2 thanks closure, each with hard no-write structural assertions and a hard requireJudge semantic judge grounded in the same fixture. Turn-0 expectations unchanged except explicit turnIndex 0 scoping. Old v7 runs preserved; baseline and candidate must rerun on this v8 contract."
  - "RSVP merge v9 (2026-09-30): this case now carries a 6-turn thread that fully subsumes live_behavior.rsvp_plus_one_not_eligible_no_false_success (turns 3-5). Every absorbed turn keeps its original hard structural assertions (handoff.write receipt, tool_usage, fixture_effect_count) and hard requireJudge semantic judge, renumbered turnIndex 0->3, 1->4, 2->5 with turnN- id prefixes; turns 3-5 switch fixture to the absorbed rsvp-plus-one-not-eligible world via turn-level backendFixture on the same phone and event. Turns 0-2 unchanged. Old v8 runs preserved; baseline and candidate must rerun on this v9 contract."
