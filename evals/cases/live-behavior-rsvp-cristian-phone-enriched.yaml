template: template.base-live
id: live_behavior.rsvp_cristian_phone_enriched_confirmation
suite: live_behavior_regression
version: 4
description: Cristian's completed invitation is resolved via hybrid fragment plus natural tissue without a false missing-invitation answer.
tags: [live, behavior, rsvp, phone-enrichment, reported-interaction, cristian]
targetModes: [live_lambda]
inputs:
  - text: Hola buen día, ya confirmé, gracias
    channel: whatsapp
    contactPhone: "+51942633292"
    sessionId: live-rsvp-cristian-phone-enriched-session
expectations:
  - id: cristian-enters-rsvp
    type: node_transition
    to: responder_invitacion
    severity: hard
  - id: cristian-reconciles-both-phone-reads
    type: tool_usage
    mustCall: [lookup_rsvp_invitations, lookup_guest_events_by_phone, get_guest_event_detail]
    mustNotCall: [guest_rsvp, auth_by_phone, request_user_login_code, verify_user_login_code]
    severity: hard
  - id: cristian-existing-confirmation-is-reported
    type: text_semantic
    rubric: >-
      The response must contain the deterministic attending fragment elements — polarity "figura que asistirás", confirmation "ya está confirmada", no-change clause "No fue necesario hacer otro cambio" and "no se realizó un nuevo registro", event name "Michelle & Jorge", date "10/10/2026 20:15" (slash fallback via formatRsvpSpanishDate), and natural Spanish conversational tissue. Element presence is required, order is not evaluated. Must be entirely in Spanish, natural, must not imply a new mutation was made, must not ask for email or a code, must not mention internal states or tools, and must not invert polarity to "Figura que no asistirás".
    minScore: 0.9
    requireJudge: true
    severity: hard
  - id: fragment-attending-polarity-event-date-no-change
    type: text_contains
    allOf: ["figura que asistirás", "Michelle & Jorge", "10/10/2026 20:15", "No fue necesario hacer otro cambio", "no se realizó un nuevo registro", "ya está confirmada"]
    severity: hard
  - id: fragment-not-inverted
    type: text_not_contains
    phrases: ["Figura que no asistirás"]
    severity: hard
  - id: no-rsvp-vocabulary
    type: text_not_contains
    phrases: ["RSVP", "rsvp"]
    severity: hard
budget:
  maxTurns: 1
  estimatedPromptTokensPerTurn: 1500
  estimatedCompletionTokensPerTurn: 220
