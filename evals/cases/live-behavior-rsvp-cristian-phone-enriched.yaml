template: template.base-live
id: live_behavior.rsvp_cristian_phone_enriched_confirmation
suite: live_behavior_regression
version: 1
description: Cristian's completed invitation is resolved from the guest association and phone-enriched event attendance without a false missing-invitation answer.
tags: [live, behavior, rsvp, phone-enrichment, reported-interaction, cristian]
targetModes: [live_lambda]
inputs:
  - text: Hola buen día, ya confirmé, gracias
    channel: whatsapp
    contactPhone: "+51942633292"
    sessionId: live-rsvp-cristian-phone-enriched-session
expectations:
  - id: cristian-enters-rsvp
    type: node_transition
    to: responder_invitacion
    severity: hard
  - id: cristian-reconciles-both-phone-reads
    type: tool_usage
    mustCall: [lookup_rsvp_invitations, lookup_guest_events_by_phone, get_guest_event_detail]
    mustNotCall: [guest_rsvp, auth_by_phone, request_user_login_code, verify_user_login_code]
    severity: hard
  - id: cristian-existing-confirmation-is-reported
    type: text_semantic
    rubric: >-
      The trusted phone is associated with Michelle & Jorge and the phone-enriched event attendance says the guest has responded and will attend. The answer must be concise, natural, and entirely in Spanish; confirm that Cristian's attendance is already recorded for Michelle & Jorge and make clear that no additional change was needed. It must not say the invitation is missing, ask for email or a code, or claim a new RSVP mutation was made.
    minScore: 0.9
    requireJudge: true
    severity: hard
budget:
  maxTurns: 1
  estimatedPromptTokensPerTurn: 1500
  estimatedCompletionTokensPerTurn: 220
