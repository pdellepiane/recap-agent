template: template.base-live
id: live_behavior.rsvp_cristian_phone_enriched_confirmation
suite: live_behavior_regression
version: 2
description: Cristian's completed invitation is resolved from the guest association and phone-enriched event attendance without a false missing-invitation answer.
tags: [live, behavior, rsvp, phone-enrichment, reported-interaction, cristian]
targetModes: [live_lambda]
inputs:
  - text: Hola buen día, ya confirmé, gracias
    channel: whatsapp
    contactPhone: "+51942633292"
    sessionId: live-rsvp-cristian-phone-enriched-session
expectations:
  - id: cristian-enters-rsvp
    type: node_transition
    to: responder_invitacion
    severity: hard
  - id: cristian-reconciles-both-phone-reads
    type: tool_usage
    mustCall: [lookup_rsvp_invitations, lookup_guest_events_by_phone, get_guest_event_detail]
    mustNotCall: [guest_rsvp, auth_by_phone, request_user_login_code, verify_user_login_code]
    severity: hard
  - id: cristian-existing-confirmation-is-reported
    type: text_semantic
    rubric: >-
      The deterministic reply for the attending current-state must be exactly "Gracias, tu asistencia a Michelle & Jorge el 10/10/2026 20:15 ya está confirmada y figura que asistirás. No fue necesario hacer otro cambio y no se realizó un nuevo registro. ¡Que disfrutes el evento!" Required elements in order: explicit "Gracias", event name "Michelle & Jorge", date "10/10/2026 20:15" (rendered via formatRsvpSpanishDate fallback for slash input), confirmation "ya está confirmada", attending polarity "figura que asistirás", no-change clause "No fue necesario hacer otro cambio", "no se realizó un nuevo registro", and closing "¡Que disfrutes el evento!". The answer must be entirely in Spanish, natural, and must not imply a new mutation was made, ask for email or a code, or mention internal states or tools.
    minScore: 0.9
    requireJudge: true
    severity: hard
  # exact-match deterministic renderer (T6-fix-5) — src/runtime/agent-service.ts:2586 renderRsvpCurrentStateDeterministically; verified byte-identical vs .eval-runs/eval-2026-08-28T15-19-45-749Z-a39b4199
  - id: deterministic-attending-contains-thanks-and-no-change
    type: text_contains
    allOf: ["Gracias, tu asistencia a Michelle & Jorge el 10/10/2026 20:15 ya está confirmada y figura que asistirás. No fue necesario hacer otro cambio y no se realizó un nuevo registro. ¡Que disfrutes el evento!"]
    severity: hard
budget:
  maxTurns: 1
  estimatedPromptTokensPerTurn: 1500
  estimatedCompletionTokensPerTurn: 220
