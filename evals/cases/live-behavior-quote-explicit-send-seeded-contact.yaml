id: live_behavior.quote_explicit_send_seeded_contact
version: 4
description: "Bounded quote: S12 per-provider quote completion with an
  explicitly captured event date. Two selected providers across two needs close
  with the user-supplied date sent verbatim to every quote, per-provider
  outcomes persisted, and no today substitution or silent partial finish."
inputs:
  - text: Mi evento es el 18 de octubre de 2028. Por favor envía la cotización al
      proveedor elegido para cerrar el plan.
    sessionId: live_behavior.quote_explicit_send_seeded_contact
    channel: whatsapp
    contactPhone: "+51999111222"
    backendFixture:
      scenario: master-v2-provider-completion
  - text: Perdona, ¿me repites lo último que me dijiste?
    sessionId: live_behavior.quote_explicit_send_seeded_contact
    channel: whatsapp
    contactPhone: "+51999111222"
    backendFixture:
      scenario: master-v2-provider-completion
  - text: Gracias, eso era todo.
    sessionId: live_behavior.quote_explicit_send_seeded_contact
    channel: whatsapp
    contactPhone: "+51999111222"
    backendFixture:
      scenario: master-v2-provider-completion
expectations:
  - id: both-quote-receipts-match-selected-providers-and-date
    type: trace_field_subset
    turnIndex: 0
    path: provider_quote_receipts
    expected:
      - providerId: 101
        eventDate: 2028-10-18
        resultStatus: confirmed
    severity: hard
  - id: submits-quotes-through-finish-plan
    type: tool_usage
    turnIndex: 0
    mustCall:
      - finish_plan
    mustNotCall: []
    severity: hard
  - id: multi-need-selection-preserved
    type: plan_field_subset
    turnIndex: 0
    path: provider_needs
    expected:
      - category: Catering
        selected_provider_ids:
          - 101
    severity: hard
  - id: recall-performs-no-new-effect
    type: tool_usage
    mustCall: []
    mustNotCall:
      - auth_by_phone
      - request_user_login_code
      - verify_user_login_code
      - request_human_takeover
      - guest_rsvp
      - create_quote_request
      - finish_plan
    turnIndex: 1
    severity: hard
  - id: thanks-performs-no-new-effect
    type: tool_usage
    mustCall: []
    mustNotCall:
      - auth_by_phone
      - request_user_login_code
      - verify_user_login_code
      - request_human_takeover
      - guest_rsvp
      - create_quote_request
    turnIndex: 2
    severity: hard
  - id: expected-simulated-quote-count
    type: fixture_effect_count
    operation: provider.quote.write
    turnIndex: 0
    expectedAttempts: 1
    expectedSuccesses: 1
    expectedReplays: 0
    severity: hard
  - id: no-repeat-quote-on-recall
    type: fixture_effect_count
    operation: provider.quote.write
    turnIndex: 1
    expectedAttempts: 0
    expectedSuccesses: 0
    expectedReplays: 0
    severity: hard
