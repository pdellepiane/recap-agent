template: template.base-live
id: live_behavior.pending_balance_validation_luis
suite: live_behavior_regression
version: 2
description: Luis pending Alejandra order and cart with null currency; the pending total is reported without a currency symbol and the remaining balance stays unknown.
tags: [live, behavior, purchase, balance, validation, reported-interaction, luis]
targetModes: [live_lambda]
inputs:
  - text: Consulta por Alejandra. El pedido figura pendiente por Yape. Cuanto me falta?
    channel: whatsapp
    contactPhone: "+51938389389"
    sessionId: live-pending-balance-luis-session
  - text: Ya envié los 13.76 que faltaban, tengo el voucher.
    channel: whatsapp
    contactPhone: "+51938389389"
    sessionId: live-pending-balance-luis-session
backendFixture:
  scenario: purchase-luis-389
expectations:
  - id: pending-balance-enters-information
    type: node_transition
    to: resolver_consultas_informativas
    turnIndex: 0
    severity: hard
  - id: pending-balance-uses-phone-partitions
    type: tool_usage
    mustCall: [lookup_guest_orders_by_phone]
    mustNotCall: [auth_by_phone, request_user_login_code, verify_user_login_code]
    turnIndex: 0
    severity: hard
  - id: balance-unknown-no-currency
    type: text_semantic
    rubric: >-
      The phone lookup returns a pending Alejandra order for 227.76 via Yape and a same-event active cart; currency is null and no balance-due or amount-received fields exist. The backend method enum is Yape_o_Plin (combined name from the real API); rendering "Yape o Plin" or naming the registered method family is grounded, covered by the indexed validation-window policy. The answer must be concise, natural Latin American Spanish, report the pending total with method without adding a currency symbol, state that the remaining balance cannot be confirmed from the available record, and explain that Yape validation can take up to 72 business hours. It must not calculate a balance, invent PEN or soles, or confirm receipt from the voucher image.
    minScore: 0.9
    requireJudge: true
    turnIndex: 0
    severity: hard
  - id: voucher-does-not-confirm
    type: text_semantic
    rubric: >-
      This is the same Alejandra thread; the user reports sending the 13.76 shortfall with a voucher image in a text-only turn with no new image attached. The answer must stay on that pending order, acknowledge the report, restate that the order remains pending backend validation without claiming the payment was validated, and repeat the 72 business hour window. It must not restart with a generic welcome, present a currency that the backend did not supply, or calculate a remaining balance. No image disclaimer is required for this text-only turn; silence about a nonexistent image is correct.
    minScore: 0.9
    requireJudge: true
    turnIndex: 1
    severity: hard
notes:
  - "R05 oracle revision v1 to v2, 2026-09-12, Packet F3. Old voucher-does-not-confirm demanded an image disclaimer although the turn is text-only with no image attached, failing a reply that acknowledged 13.76, retained pending state, and invented no currency (matrix: judge demands image/backend disclaimer though turn is text-only). New contract keeps pending state plus no invented currency and drops the disclaimer demand for a nonexistent image. Old v1 runs preserved; baseline and candidate must rerun on this v2 contract."
budget:
  maxTurns: 2
  estimatedPromptTokensPerTurn: 1800
  estimatedCompletionTokensPerTurn: 240
