notes:
  - S13 frozen world s13-reference-unavailable-multiple as of 2026-09-09T00:00:00.000Z. Synthetic identity only; two orders with no customer references for Evento de prueba A and Evento de prueba B with distinct status and authorized totals, no carts. Output must follow this world, never mutable backend data.
  - "R05 oracle revision v1 to v2, 2026-09-12, Packet F3. Old multiple-asks-grounded-selection chased omitted names while missing the real defect: the reply inserted S/ although the stored candidate evidence carries no currency (matrix: unsupported currency assertion). New contract explicitly labels event dates and forbids inventing currency symbols or codes. Old v1 runs preserved; baseline and candidate must rerun on this v2 contract."
  - "R05 oracle revision v2 to v3, 2026-09-14, Packet EX1. Old multiple-asks-grounded-selection forbade every currency symbol or code, but the frozen fixture world itself carries currency_code PEN with currency_symbol S/ on both orders (currency null, code and symbol present; independently read from evals/fixtures/s13-reference-unavailable-multiple.json). Forbidding S/ contradicts world data, so a grounded reply stating recorded PEN/S/ failed as invention. Choice: align the oracle to world data; fixtures untouched (out of scope for this evaluator packet). New contract treats recorded PEN/S/ alongside the recorded totals as grounded fixture fact and forbids only novel currencies, amounts, or symbols beyond the world data. Old v2 runs preserved; baseline and candidate must rerun on this v3 contract."
  - "v4 2026-09-28: A complete authorized profile may prefetch both orders before extraction. Replace internal node and extra phone-read pins with a hard structured purchase-extraction check. The semantic judge still requires a grounded single selection question naming both event dates and no false reference match."
  - "IMGMISC lane merge surgery 2026-09-30: extended 1 to 3 turns with a repeat-from-history continuity turn and a thanks closure; existing expectations pinned to turn 0 with rubric bytes unchanged."
