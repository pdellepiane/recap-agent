    type: plan_field_subset
    path: provider_needs
    expected:
      - category: Locales
        status: no_providers_available
    turnIndex: 0
    severity: hard
  - id: not-pending-copy
    type: text_not_contains
    phrases:
      - cuando quieras retomamos Locales
      - pendiente Locales
    turnIndex: 0
    severity: hard
  - id: turn1-no-providers-status
    type: plan_field_subset
    path: provider_needs
    expected:
      - category: Locales
        status: no_providers_available
    turnIndex: 1
    severity: hard
