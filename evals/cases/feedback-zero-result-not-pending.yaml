template: template.base-offline
id: feedback.zero_result_need_not_treated_as_pending
suite: feedback_regression
version: 2
description: A searched need with zero providers should become no_providers_available and not be resumed as pending. Extended with a location-refinement retry that also returns zero and a thanks closure.
tags: [feedback, batch1, batch2, no-results]
