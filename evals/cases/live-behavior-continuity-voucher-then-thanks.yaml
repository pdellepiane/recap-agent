template: template.base-live
id: live_behavior.continuity_voucher_then_thanks
suite: live_behavior_regression
version: 3
description: A captioned voucher image receives one brief receipt that never approves payment; the following thanks adds no task and must not trigger a repeated payment explanation.
tags: [live, behavior, continuity, image, image-file, inbound-continuity]
targetModes: [live_lambda]
backendFixture:
  scenario: image-clean-world
inputs:
  - text: Acabo de hacer el pago, te mando el comprobante
    channel: whatsapp
    contactPhone: "+51900027803"
    sessionId: live-continuity-voucher-thanks-session
    image:
      data: 
      mime_type: image/png
  - text: Gracias
    channel: whatsapp
    contactPhone: "+51900027803"
    sessionId: live-continuity-voucher-thanks-session
notes:
  - "F1 2026-09-12: backendFixture scenario image-clean-world; this phone has empty initial history and empty authorized purchase results; never mutable backend data."
  - "Backend image forwarding contract 2026-09-08. Synthetic voucher-style fixture rendered locally, never a customer document. The receipt is evidence only: the original order status stays authoritative and the image never proves approval."
  - "R05 oracle revision v2 to v3, 2026-09-12, Packet F3. Old voucher-receipt-brief-and-honest claimed pending backend validation although this clean-world fixture has no order record (matrix: must not invent a known pending backend status without an order fixture). New contract judges one brief honest receipt without inventing backend state. Old v2 runs preserved; baseline and candidate must rerun on this v3 contract."
expectations:
  - id: voucher-receipt-projected
    type: tool_usage
    mustCall: [image_file_context]
    mustNotCall: [image_inspect]
    turnIndex: 0
    severity: hard
  - id: voucher-receipt-no-approval
    type: text_not_contains
    phrases: [pago aprobado, pago confirmado, hemos confirmado tu pago, pago verificado]
    turnIndex: 0
    severity: hard
  - id: voucher-receipt-brief-and-honest
    type: text_semantic
    rubric: >-
      Pass only if the assistant responds entirely in Spanish with one brief receipt for the
      comprobante that states the image alone cannot confirm or approve any payment, without
      inventing a backend order status, without quoting an order total as settled, without asking
      the user to resend the image, and without requesting an OTP. This clean-world fixture has no
      order record, so pending-validation language that presumes one must fail. Judge only what was
      known through this turn; the later thanks was not yet available.
    minScore: 0.8
    requireJudge: true
    turnIndex: 0
    severity: hard
  - id: thanks-adds-no-payment-effect
    type: tool_usage
    mustCall: []
    mustNotCall: [search_providers_from_plan, guest_rsvp, auth_by_phone, request_user_login_code, verify_user_login_code, request_human_takeover, image_inspect]
    turnIndex: 1
    severity: hard
  - id: thanks-no-repeated-explanation
    type: text_not_contains
    phrases: [pago aprobado, pago confirmado, hemos confirmado tu pago, RSVP, rsvp]
    turnIndex: 1
    severity: hard
budget:
  maxTurns: 2
  estimatedPromptTokensPerTurn: 2500
  estimatedCompletionTokensPerTurn: 300
