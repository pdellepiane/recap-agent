template: template.base-live
id: live_behavior.otp_sent_explains_image_limitation
suite: live_behavior_regression
version: 2
description: After sending an email code, the assistant asks the user to type or paste it here, scoped to the credential step without a global image-reading claim.
tags: [live, behavior, authentication, otp, image-limitation]
targetModes: [live_lambda]
inputs:
  - text: Mi correo registrado es regression-image-code@example.invalid.
    channel: terminal_whatsapp
    sessionId: otp-sent-image-guidance-session
    backendFixture:
      scenario: otp-sent-image-guidance
backendFixture:
  scenario: otp-sent-image-guidance
seedPlan:
  current_node: resolver_consultas_informativas
  information_state:
    resume_node: entrevista
    pending_requests:
      - requestId: information-1
        kind: associated_event
        query: ¿A qué hora empieza el evento?
        eventHint: null
    selection_candidates: []
expectations:
  - id: requests-email-code-without-phone-lookup
    type: tool_usage
    mustCall: [request_user_login_code]
    mustNotCall: [auth_by_phone, verify_user_login_code]
    severity: hard
  - id: code-challenge-persists
    type: plan_field_equals
    path: user_auth.status
    expected: code_requested
    severity: hard
  - id: post-send-image-guidance
    type: text_semantic
    rubric: >-
      Pass only if the assistant responds naturally and entirely in Spanish that a one-time code was sent to the provided email, and directly asks the user to type or paste the code here as text for this credential step. It must not use the word “texto” as an instruction, must not claim a global inability to read images or screenshots, must not ask for the WhatsApp number, and must not claim that the protected event question has already been answered.
    minScore: 0.9
    requireJudge: true
    severity: hard
notes:
  - "R05 oracle revision v1 to v2, 2026-09-12, Packet F3. Old post-send-image-guidance demanded the retired universal inability-to-read-images sentence, failing an understandable credential-scoped instruction (matrix: universal image limitation is obsolete). New contract keeps the text-entry instruction scoped to the code step and forbids the global claim instead of requiring it. Old v1 runs preserved; baseline and candidate must rerun on this v2 contract."
budget:
  maxTurns: 1
  estimatedPromptTokensPerTurn: 1800
  estimatedCompletionTokensPerTurn: 350
