template: template.base-live
id: live_behavior.image_receipt_illegible_amount
suite: live_behavior_regression
version: 2
description: A captioned receipt image with nothing legible keeps amount, currency and date unknown and never approves a payment.
tags: [live, behavior, image, image-file, receipt-uncertainty]
targetModes: [live_lambda]
backendFixture:
  scenario: image-clean-world
inputs:
  - text: Cuanto es el monto del comprobante?
    channel: whatsapp
    contactPhone: "+51987654321"
    sessionId: live-image-illegible-amount-session
    image:
      data: 
      mime_type: image/png
    backendFixture:
      scenario: image-clean-world
notes:
  - "F1 2026-09-12: synthetic receipt with obscured values evals/fixtures/images/receipt-amount-obscured.png (800x1000 PNG, sha256 b9070acd5d258ca1e3361ac05638b8de3e3db16f63fdc0b6538a2e335c2f630c, 34099 bytes, base64 45468 chars, normalizes available). Readable: title, Monto:/Fecha: labels, Comercio: Tienda Demo, Operacion: 884211, Tarjeta: **** 4521. Unreadable behind solid black redaction: monto value, currency, fecha value. No oracle may demand redacted values. Synthetic, never a customer document."
  - "F1 2026-09-12: backendFixture scenario image-clean-world; this phone has empty initial history and empty authorized purchase results; never mutable backend data."
  - "Synthetic 1px fixture rendered locally, never a customer document. Known fact: no amount, currency, date or issuer is legible. Paired control for the readable receipt case live_behavior.image_file_captioned_persisted."
expectations:
  - id: illegible-uses-owner-path
    type: tool_usage
    mustCall: [image_file_context]
    mustNotCall: [image_inspect]
    severity: hard
  - id: illegible-no-approval-or-bytes
    type: text_not_contains
    phrases: [pago aprobado, pago confirmado, hemos confirmado tu pago, pago verificado, base64, file-live, http]
    severity: hard
  - id: illegible-amount-stays-unknown
    type: text_semantic
    rubric: >-
      Pass only if the assistant responds entirely in Spanish stating that the amount cannot be read from the image, keeping amount, currency and date unknown. It must not state any amount, currency, date, issuer or operation number as fact, must not confirm or approve any payment, must not claim the image proves a settled payment, and must not ask for an OTP.
    minScore: 0.8
    requireJudge: true
    severity: hard
budget:
  maxTurns: 1
  estimatedPromptTokensPerTurn: 2500
  estimatedCompletionTokensPerTurn: 300
