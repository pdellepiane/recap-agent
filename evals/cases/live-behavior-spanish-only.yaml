template: template.base-live
id: live_behavior.spanish_only_mixed_language_request
suite: live_behavior_regression
version: 2
description: A mixed-language request must be understood while every user-visible natural-language word in the reply remains Spanish; catalog labels stay usable and the email request is preserved.
tags: [live, behavior, language, spanish-only]
backendFixture:
  scenario: spanish-only-catering
inputs:
  - text: Necesito catering para un baby shower en Miraflores. Please send the RSVP link by email.
    sessionId: live-behavior-spanish-only-session
    backendFixture:
      scenario: spanish-only-catering
expectations:
  - id: tokens-present
    type: token_usage_present
    allTurns: true
  - id: no-known-english-interface-terms
    type: text_not_contains
    phrases:
      - RSVP
      - email
      - chat
      - web
      - link
      - feedback
      - marketplace
      - delivery
      - app
      - login
  - id: correct-behavior-and-spanish-only
    type: text_semantic
    rubric: >-
      Pass only if the response retains the user's celebration in Miraflores and food-service request in the plan, honestly addresses the request to send the RSVP link by email without falsely claiming it was sent (explaining the limitation and offering a concrete next step preserves the task; silently dropping the email request fails), advances or clarifies the next missing search field naturally, and uses Spanish for every user-visible natural-language word. The reply does not need to repeat already retained context such as the event type or location. Naming the catalog labels Catering and Baby shower is grounded and must not fail. Allow only official proper names, provider or brand names, literal URLs, email addresses, numbers, and copied codes to remain untranslated. Fail if any English common noun, verb, adjective, interface term, or untranslated product term appears, including words copied from the user. Judge language and task behavior only; a minor Spanish grammar or style defect is not evidence of an English word and must not lower the score below passing.
    minScore: 0.95
    requireJudge: true
    severity: hard
notes:
  - "R05 oracle revision v1 to v2, 2026-09-12, Packet F3. Old no-known-english-product-terms banned the valid catalog labels catering and baby shower, failing an understandable reply (matrix: catalog words are understandable labels). Those two entries are removed; interface terms stay banned. Old correct-behavior-and-spanish-only let the reply ignore the RSVP-by-email request entirely (matrix: secondary question dropped). New contract fails a reply that silently drops the email request while still forbidding false sent claims; the one-question planning policy may sequence the work but never discards it. Old v1 runs preserved; baseline and candidate must rerun on this v2 contract."
budget:
  maxTurns: 1
  estimatedPromptTokensPerTurn: 1600
  estimatedCompletionTokensPerTurn: 450
