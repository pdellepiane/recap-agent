template: template.base-live
id: live_behavior.rsvp_plus_one_multiple_events_requires_selection
suite: live_behavior_regression
version: 1
description: Plus-one request with multiple pending invitations requires one bounded event selection before mutation.
tags: [live, behavior, rsvp, plus-one, selection, spanish]
targetModes: [live_lambda]
inputs:
  - text: Confirmo que mi acompañante asistirá al evento del sábado
    channel: whatsapp
    contactPhone: "+51941438999"
    sessionId: live-rsvp-plus-one-multi-event-session
    backendFixture:
      scenario: rsvp-plus-one-multiple-pending
backendFixture:
  scenario: rsvp-plus-one-multiple-pending
expectations:
  - id: enters-rsvp-node
    type: node_transition
    to: responder_invitacion
    severity: hard
  - id: no-premature-mutation
    type: tool_usage
    mustNotCall: [guest_rsvp, request_human_takeover, auth_by_phone, request_user_login_code, verify_user_login_code]
    severity: hard
  - id: requires-event-selection
    type: text_semantic
    rubric: >-
      The user wants to confirm one companion but multiple pending invitations exist and no specific event is grounded. The answer must be concise, natural Latin American Spanish, ask one bounded question to choose which event the plus-one applies to, list the candidate events, and must not guess an event, call POST /guest/rsvp, silently truncate companions, or request email or OTP.
    minScore: 0.9
    requireJudge: true
    severity: hard
budget:
  maxTurns: 1
  estimatedPromptTokensPerTurn: 1500
  estimatedCompletionTokensPerTurn: 180
