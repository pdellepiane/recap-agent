template: template.base-live
id: live_behavior.master_provider_location_clarification
suite: live_behavior_regression
version: 1
description: An absent event location does not create a shortlist; supplying
  Lima completes the same planning request.
tags:
  - live
  - behavior
  - provider
  - thesis-master
targetModes:
  - live_lambda
backendFixture:
  scenario: master-provider-catalog
inputs:
  - text: Busco catering para mi cumpleaños para 20 invitados, máximo 500 soles.
      ¿Qué me recomiendas?
    sessionId: master-provider-location_clarification
    backendFixture:
      scenario: master-provider-catalog
  - text: Será en Lima.
    sessionId: master-provider-location_clarification
    backendFixture:
      scenario: master-provider-catalog
expectations:
  - id: no-shortlist-without-location
    type: plan_field_equals
    path: recommended_provider_ids
    expected: []
    turnIndex: 0
    severity: hard
  - id: no-location-invented
    type: plan_field_equals
    path: location
    expected: null
    turnIndex: 0
    severity: hard
  - id: location-added
    type: plan_field_equals
    path: location
    expected: Lima
    turnIndex: 1
    severity: hard
  - id: accessible-shortlist-after-answer
    type: plan_field_equals
    path: recommended_provider_ids
    expected:
      - 9101
    turnIndex: 1
    severity: hard
  - id: accessible-provider-after-answer
    type: text_contains
    allOf:
      - Mesa Accesible
    turnIndex: 1
    severity: hard
  - id: read-only-provider-conversation-has-no-submission
    type: tool_usage
    mustNotCall:
      - create_quote_request
      - finish_plan
      - request_human_takeover
      - guest_rsvp
      - request_user_login_code
      - verify_user_login_code
    severity: hard
scorers:
  - id: expectation-core
    type: expectation_pass_rate
    weight: 1
budget:
  maxTurns: 2
  estimatedPromptTokensPerTurn: 12000
  estimatedCompletionTokensPerTurn: 600
notes:
  - Frozen synthetic capability question for the master thesis study. These
    fixtures test the deployed orchestration and model against a declared
    provider world; they do not test real marketplace/vector retrieval recall.
  - All replies remain model-generated. Assertions pin independently declared
    provider identities, facts and effects rather than prose style or internal
    node paths.
