template: template.base-live
id: live_behavior.customer_event_task_continuity
suite: live_behavior_regression
version: 1
description: "One trusted-phone session across two pending events proves task continuity: Boda Ana y Luis time with zero writes, Marta confirmation plus time in one combined write, Ana time again with zero new writes and no cross-event leakage, and a thanks that closes without restarting reads or writes."
tags: [live, behavior, rsvp, continuity, multi-turn, task-continuity, reported-interaction]
targetModes: [live_lambda]
inputs:
  - text: ¿Cuándo es la Boda Ana y Luis?
    channel: whatsapp
    contactPhone: "+51941438999"
    sessionId: live-customer-event-task-continuity
    backendFixture:
      scenario: rsvp-plus-one-multiple-pending
  - text: Confirmo mi asistencia al Cumpleaños Marta. ¿A qué hora es?
    channel: whatsapp
    contactPhone: "+51941438999"
    sessionId: live-customer-event-task-continuity
    backendFixture:
      scenario: rsvp-plus-one-multiple-pending
  - text: ¿Y a qué hora era la Boda Ana y Luis?
    channel: whatsapp
    contactPhone: "+51941438999"
    sessionId: live-customer-event-task-continuity
    backendFixture:
      scenario: rsvp-plus-one-multiple-pending
  - text: Gracias.
    channel: whatsapp
    contactPhone: "+51941438999"
    sessionId: live-customer-event-task-continuity
    backendFixture:
      scenario: rsvp-plus-one-multiple-pending
backendFixture:
  scenario: rsvp-plus-one-multiple-pending
expectations:
  - id: turn0-ana-time-no-write
    type: fixture_effect_count
    operation: rsvp.write
    turnIndex: 0
    expectedAttempts: 0
    expectedSuccesses: 0
    expectedReplays: 0
    severity: hard
  - id: turn0-ana-time-reads-events
    type: tool_usage
    mustCall: [lookup_guest_events_by_phone]
    mustNotCall: [guest_rsvp, auth_by_phone, request_user_login_code, verify_user_login_code, request_human_takeover]
    turnIndex: 0
    severity: hard
  - id: turn0-ana-time-answered
    type: text_semantic
    rubric: >-
      The trusted phone is invited to Boda Ana y Luis on 2026-09-20 at 18:00 and to Cumpleaños Marta on 2026-09-21 at 19:00. This turn only asks when Boda Ana y Luis is. The answer must be concise, natural, and entirely in Spanish; give the Ana y Luis date and time (20 de septiembre de 2026, 18:00) without claiming any attendance was registered, without asking which event the user means, and without asking for email or an OTP.
    minScore: 0.9
    requireJudge: true
    turnIndex: 0
    severity: hard
  - id: turn1-only-marta-write
    type: fixture_effect_count
    operation: rsvp.write
    turnIndex: 1
    expectedAttempts: 1
    expectedSuccesses: 1
    expectedReplays: 0
    severity: hard
  - id: turn1-marta-write-and-read
    type: tool_usage
    mustCall: [lookup_rsvp_invitations, guest_rsvp]
    mustNotCall: [auth_by_phone, request_user_login_code, verify_user_login_code, request_human_takeover]
    turnIndex: 1
    severity: hard
  - id: turn1-marta-confirmed-with-time
    type: text_semantic
    rubric: >-
      The user explicitly confirms attendance to Cumpleaños Marta and asks its time in the same turn. The fixture records one successful write for guest 80002 at event 8002 with a same-ID fresh read. The answer must be concise, natural, and entirely in Spanish; confirm in one combined reply that the Marta attendance was registered and give its time (21 de septiembre de 2026, 19:00). It must not ask which event to confirm first, must not attribute Ana y Luis facts to Marta, must not claim a second write for Ana y Luis, and must not ask for email or an OTP.
    minScore: 0.9
    requireJudge: true
    turnIndex: 1
    severity: hard
  - id: turn2-ana-again-no-new-write
    type: fixture_effect_count
    operation: rsvp.write
    turnIndex: 2
    expectedAttempts: 0
    expectedSuccesses: 0
    expectedReplays: 0
    severity: hard
  - id: turn2-ana-again-no-mutation
    type: tool_usage
    mustNotCall: [guest_rsvp, auth_by_phone, request_user_login_code, verify_user_login_code, request_human_takeover]
    turnIndex: 2
    severity: hard
  - id: turn2-ana-time-not-marta
    type: text_semantic
    rubric: >-
      The user asks again for the Boda Ana y Luis time after confirming Marta. The answer must be concise, natural, and entirely in Spanish; give the Ana y Luis time (18:00 on 20 de septiembre de 2026) from the already known facts without a new write. It must not attribute Marta facts (21 de septiembre, 19:00, Cumpleaños Marta) to Ana y Luis, must not claim a new registration, and must not ask for email or an OTP.
    minScore: 0.9
    requireJudge: true
    turnIndex: 2
    severity: hard
  - id: turn3-thanks-no-restart
    type: fixture_effect_count
    operation: rsvp.write
    turnIndex: 3
    expectedAttempts: 0
    expectedSuccesses: 0
    expectedReplays: 0
    severity: hard
  - id: turn3-thanks-no-restart-tools
    type: tool_usage
    mustNotCall: [guest_rsvp, lookup_rsvp_invitations, auth_by_phone, request_user_login_code, verify_user_login_code, request_human_takeover]
    turnIndex: 3
    severity: hard
  - id: turn3-thanks-closes-or-silent
    type: text_semantic
    rubric: >-
      The user only says thanks after all tasks resolved. An empty assistant response is fully correct when the response classifier suppresses this simple thanks. If a response is sent, it must be entirely in Spanish as a brief natural closing that does not restart the attendance or time questions, does not repeat event details, does not claim any new action, and does not ask for email or an OTP.
    minScore: 0.8
    requireJudge: true
    turnIndex: 3
    severity: hard
notes:
  - "2026-09-16 customer-support release E3: single-session four-turn integration over fixture rsvp-plus-one-multiple-pending (Boda Ana y Luis event 8001 guest 80001 2026-09-20 18:00; Cumpleaños Marta event 8002 guest 80002 2026-09-21 19:00; trusted phone +51941438999). Exact guest/event IDs are proved by the offline service twin with gateway capture, not by the semantic judge alone. New case; no old runs."
budget:
  maxTurns: 4
  estimatedPromptTokensPerTurn: 1700
  estimatedCompletionTokensPerTurn: 250
