template: template.base-live
id: live_behavior.s5-generic-model-failure-not-image
suite: live_behavior_regression
version: 1
description: S5/D7 full-context twin through live Lambda. A captionless readable image followed by a purchase amount question must be answered from the pixels; a generic model-stage failure must never be relabeled image_unavailable.
tags: [live, behavior, image, image-file, purchase, s5, model-failure]
targetModes: [live_lambda]
backendFixture:
  scenario: image-clean-world
inputs:
  - text: ''
    channel: whatsapp
    contactPhone: "+51987654321"
    sessionId: live-s5-generic-model-failure-session
    image:
      data: 
      mime_type: image/png
  - text: Es el comprobante de mi pedido, cuanto dice ahi?
    channel: whatsapp
    contactPhone: "+51987654321"
    sessionId: live-s5-generic-model-failure-session
notes:
  - "B4 S5 2026-09-14: backendFixture scenario image-clean-world; this phone has empty initial history and empty authorized purchase results; never mutable backend data. The two inputs run as separate invocations against the same conversation."
  - "Current-image and retained-image paths share one narrow image-error policy: only a typed image-access failure retries without pixels. Model composition, schema, guardrail, credential, quota, timeout and server errors keep their actual classification and must never surface as image_unavailable. The exact image-download-400 recovery stays covered by existing suites; no 400 is injected here."
  - "Backend image forwarding contract 2026-09-08. Synthetic voucher-style fixture rendered locally, never a customer document."
expectations:
  - id: s5-captionless-persists
    type: tool_usage
    mustCall: [image_file_context]
    mustNotCall: [image_inspect]
    turnIndex: 0
    severity: hard
  - id: s5-answered-no-image-unavailable
    type: text_not_contains
    phrases: [no puedo ver, no se puede leer, imagen no disponible, no esta disponible, Puedes enviarla de nuevo, supera el tamaño permitido]
    turnIndex: 1
    severity: hard
  - id: s5-usage-present
    type: token_usage_present
    turnIndex: 1
    severity: hard
  - id: s5-answered-from-pixels
    type: text_semantic
    rubric: >-
      The previous turn stored a captionless readable image and this turn asks for the receipt amount of the order. Pass only if the assistant responds entirely in Spanish answering the purchase amount question with the text visible in the image, including the amount when readable. It must not claim the image is unavailable, unreadable, or missing, must not ask the user to resend any image, must not claim it saved, stored or re-read the image, must not confirm or approve any payment, must not claim the image proves a settled payment, and must not ask for an OTP.
    minScore: 0.8
    requireJudge: true
    turnIndex: 1
    severity: hard
budget:
  maxTurns: 2
  estimatedPromptTokensPerTurn: 2500
  estimatedCompletionTokensPerTurn: 300
