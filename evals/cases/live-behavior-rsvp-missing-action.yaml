template: template.base-live
id: live_behavior.rsvp_missing_action_requires_explicit_decision
suite: live_behavior_regression
version: 1
description: An RSVP request without an attendance decision reports the selected invitation state and does not mutate it.
tags: [live, behavior, rsvp, attendance, explicit-decision]
targetModes: [live_lambda]
inputs:
  - text: Quiero responder mi invitación.
    channel: whatsapp
    contactPhone: "+51973296571"
    sessionId: live-rsvp-missing-action-session
seedPlan:
  current_node: responder_invitacion
  intent: responder_invitacion
  rsvp_state:
    status: awaiting_action
    pending_action: null
    candidates:
      - guest_id: 584353
        event_name: Otra celebración prueba
        event_date: "2026-08-19 05:00:00"
    requested_at: "2026-08-17T15:00:00.000Z"
    selection_attempts: 0
expectations:
  - id: enters-rsvp-node
    type: node_transition
    to: responder_invitacion
    severity: hard
  - id: preserves-awaiting-action-state
    type: plan_field_equals
    path: rsvp_state.status
    expected: awaiting_action
    severity: hard
  - id: does-not-mutate-without-decision
    type: tool_usage
    mustCall: [lookup_rsvp_invitations]
    mustNotCall: [guest_rsvp, auth_by_phone, request_user_login_code, verify_user_login_code]
    severity: hard
  - id: asks-for-explicit-rsvp-decision
    type: text_semantic
    rubric: >-
      The guest wants to manage the selected invitation but has not stated a new attendance decision. The current user-level state says the guest will not attend. The response must naturally and entirely in Spanish report that current state and ask one clear question offering to change it to attending. It must not mutate the invitation, ask for email or an authentication code, or claim that any new response was registered.
    minScore: 0.9
    requireJudge: true
    severity: hard
budget:
  maxTurns: 1
  estimatedPromptTokensPerTurn: 1400
  estimatedCompletionTokensPerTurn: 250
