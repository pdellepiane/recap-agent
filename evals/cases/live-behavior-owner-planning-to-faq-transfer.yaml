template: template.base-live
id: live_behavior.owner_planning_to_faq_single_transfer
suite: live_behavior_regression
version: 3
description: A planning interview followed by a general information question transfers once to the FAQ owner and answers honestly from available evidence, never inventing a fee.
tags: [live, behavior, ownership, planning, faq]
targetModes: [live_lambda]
backendFixture:
  scenario: plan-owner-faq-transfer
inputs:
  - text: Hola!
    sessionId: live-owner-planning-to-faq-session
    backendFixture:
      scenario: plan-owner-faq-transfer
  - text: Estoy buscando un proveedor para mi matrimonio, ¿qué opciones tienes?
    sessionId: live-owner-planning-to-faq-session
    backendFixture:
      scenario: plan-owner-faq-transfer
  - text: ¿Cuánto cobra Sin Envolturas por sus servicios?
    sessionId: live-owner-planning-to-faq-session
    backendFixture:
      scenario: plan-owner-faq-transfer
expectations:
  - id: planning-turn-does-not-search-early
    type: tool_usage
    mustNotCall:
      - search_providers_from_plan
      - search_providers_by_query_intent
    turnIndex: 1
    severity: hard
  - id: planning-turn-continues-interview
    type: text_semantic
    rubric: >-
      The user asked for wedding-provider options while the planning interview still misses required details. The answer must be concise, natural, and entirely in Spanish; continue the interview by naturally asking for the next missing detail without running a provider search, listing providers, or presenting results. It must not invent providers or fees, must not transfer to another topic prematurely, and must not request authentication.
    minScore: 0.85
    requireJudge: true
    turnIndex: 1
    severity: hard
  - id: faq-turn-enters-information
    type: fixture_effect_count
    operation: provider.quote.write
    expectedAttempts: 0
    expectedSuccesses: 0
    expectedReplays: 0
    turnIndex: 2
    severity: hard
  - id: faq-turn-runs-no-provider-search
    type: tool_usage
    mustNotCall:
      - search_providers_from_plan
      - search_providers_by_query_intent
      - search_providers_by_keyword
      - search_providers_by_category_location
    turnIndex: 2
    severity: hard
  - id: faq-turn-persists-faq-owner
    type: plan_field_equals
    path: owner
    expected: faq
    turnIndex: 2
    severity: hard
  - id: faq-reply-answers-general-question
    type: text_semantic
    rubric: >-
      The user asked a general pricing question after a wedding-provider interview. The answer must be concise, natural, and entirely in Spanish; it addresses the pricing question honestly from the available evidence, which includes saying no price is available and offering human confirmation when that is the truth. It must not invent a fee, list providers, restart the interview, ask again for event details already in context, claim account-specific data, or request authentication.
    minScore: 0.85
    requireJudge: true
    turnIndex: 2
    severity: hard
notes:
  - "R05 oracle revision v1 to v2, 2026-09-12, Packet F3. Old faq-reply-answers-general-question failed a reply that honestly said no price was available and offered human confirmation although the judge rationale approved that behavior (matrix: do not invent fees or add irrelevant planning questions). New contract names honest unavailability plus human confirmation a pass and fails only invented fees and interview restarts. Old v1 runs preserved; baseline and candidate must rerun on this v2 contract."
  - "R05 v3 (2026-09-17, support assessment hardening items 5 and 8): faq-turn-enters-information no longer pins the internal resolver_consultas_informativas node. Old defect: a correct honest pricing reply through any routing passed the no-search evidence and the persisted faq owner but failed the node pin, grading implementation instead of behavior. New contract proves the same no-side-effect invariant observably: zero provider quote dispatches from receipts (fixture_effect_count provider.quote.write 0/0/0 hard at turn 2) together with the retained no-provider-search evidence, the persisted faq owner, and the honest-answer semantic judge. Expectation id faq-turn-enters-information is retained for ledger and run continuity; only its type changed from node_transition to fixture_effect_count. Turn 1 gains a hard semantic judge (planning-turn-continues-interview, 0.85) so the actionable interview turn is covered instead of inferred from the final reply; this adds one judge call to the panel budget. Thresholds, remaining severity, and requireJudge kept; no threshold reduction. Old v2 runs preserved; baseline and candidate must rerun on this v3 contract."
budget:
  maxTurns: 3
  estimatedPromptTokensPerTurn: 2000
  estimatedCompletionTokensPerTurn: 280
