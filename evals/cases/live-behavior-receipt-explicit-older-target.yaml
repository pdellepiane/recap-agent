  - "2026-09-30 purchase-lane extension v3: a thanks closure extends the thread to 3 turns with a cumulative rsvp.write zero-effect pin and a hard semantic judge."
  - "2026-09-30 LIVE-PURCHASE merge v4: absorbed live_behavior.receipt_dual_same_amount_asks into this carrier; every structural and text_semantic assertion kept with renumbered turnIndex (receipt-explicit-older-target: T0->M1,T1->M2,T2->M3; receipt-dual-same-amount: T0->M0,T1->M1,T2->M3). Absorbed source files deleted; turn fixtures/phones preserved per turn."
