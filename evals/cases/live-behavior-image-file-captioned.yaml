  - Backend image forwarding contract 2026-09-08. Synthetic voucher-style fixture rendered locally, never a customer document. Live test uploads the bytes to Files and asks a visual detail not supplied in text; test files are deleted afterwards.
  - "R05 oracle revision v2 to v3, 2026-09-16, full-gate triage item 1. The turn-0 image bytes are byte-identical to the live_behavior.image_file_delayed_question fixture (sha256 e6024548787bb4221c9dc53500f097e70e4c738283e2d684d70dba04c5cc764a, verified read-only against the E1 digest), so the same manually verified text (Monto: S/ 250.00) is bound via judgeGroundTruth (boundInputTurn 0). Ground truth rides the judge context only via resolveJudgeOnlyImageGroundTruth, never runtime input, no new OCR/vision. Read-only amount is not backend approval. Threshold 0.8, hard severity, requireJudge kept. Old v2 runs preserved; baseline and candidate must rerun on this v3 contract."
  - "Merge v5, 2026-09-30 (IMGMISC lane): absorbed live_behavior.image_file_unrelated_omits_pixels as turns 0-1 (same phone and fixture image-clean-world, ids/contracts preserved, turnIndex renumbered); turn 4 carries both thanks guards plus both thanks judges, absorbed thanks-acknowledged-in-spanish renamed to unrelated-thanks-acknowledged-in-spanish for id uniqueness with rubric bytes unchanged; judgeGroundTruth rebound 0 to 2 following the identical image bytes. Deleted file: live-behavior-image-file-unrelated.yaml."
