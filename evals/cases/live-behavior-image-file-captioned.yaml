notes:
  - "Merge v4, 2026-09-30: absorbed live_behavior.image_captioned_preserved (byte-identical captioned fixture, same caption question) and live_behavior.image_conversation_repeat_answered (same bytes, caption answer plus explicit repeat) as turns 0-1, reusing the repeat ids/contracts, and added a turn-2 thanks closure. Turn-0 expectations unchanged apart from turnIndex; judgeGroundTruth stays bound to input turn 0. Deleted files: live-behavior-image-captioned.yaml, live-behavior-image-conversation-repeat-answered.yaml."
