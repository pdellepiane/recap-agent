template: template.base-live
id: live_behavior.rsvp_ambiguous_event_requires_grounded_selection
suite: live_behavior_regression
version: 9
description: Six-turn trusted-phone-empty thread. An underspecified event reference cannot select or mutate one of several persisted RSVP candidates; the follow-up answer continues on the chosen candidate without re-asking and a thanks closes the first half. A clear attending decision then reports the scoped empty-lookup outcome honestly, a doubting follow-up re-checks the same empty world, and a thanks closes the thread.
tags: [ live, behavior, rsvp, attendance, ambiguity, reported-interaction, trusted-phone, agent-api, continuity ]
targetModes: [ live_lambda ]
