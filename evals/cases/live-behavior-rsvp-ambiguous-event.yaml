template: template.base-live
id: live_behavior.rsvp_ambiguous_event_requires_grounded_selection
suite: live_behavior_regression
version: 5
description: An underspecified event reference cannot select or mutate one of several persisted RSVP candidates; the follow-up answer continues on the chosen candidate without re-asking.
tags: [live, behavior, rsvp, attendance, ambiguity, reported-interaction]
targetModes: [live_lambda]
backendFixture:
  scenario: rsvp-trusted-phone-empty
inputs:
  - text: Ese.
    channel: whatsapp
    contactPhone: "+12025550100"
    sessionId: live-rsvp-ambiguous-event-session
    backendFixture:
      scenario: rsvp-trusted-phone-empty
  - text: El de Marta, el 19 de septiembre.
    channel: whatsapp
    contactPhone: "+12025550100"
    sessionId: live-rsvp-ambiguous-event-session
    backendFixture:
      scenario: rsvp-trusted-phone-empty
seedPlan:
  current_node: responder_invitacion
  intent: responder_invitacion
  rsvp_state:
    status: awaiting_event_selection
    pending_action: attending
    candidates:
      - guest_id: 41001
        event_name: Matrimonio de Ana y Luis
        event_date: "2026-09-12"
      - guest_id: 41002
        event_name: Cumpleaños de Marta
        event_date: "2026-09-19"
    requested_at: "2026-08-13T15:00:00.000Z"
    selection_attempts: 0
expectations:
  - id: remains-in-rsvp-node
    type: fixture_effect_count
    operation: rsvp.write
    turnIndex: 0
    expectedAttempts: 0
    expectedSuccesses: 0
    expectedReplays: 0
    severity: hard
  - id: preserves-event-selection-state
    type: plan_field_equals
    path: rsvp_state.status
    expected: awaiting_event_selection
    turnIndex: 0
    severity: hard
  - id: does-not-mutate-an-ungrounded-candidate
    type: tool_usage
    mustNotCall: [guest_rsvp, auth_by_phone, request_user_login_code, verify_user_login_code]
    turnIndex: 0
    severity: hard
  - id: asks-which-persisted-event
    type: text_semantic
    # Rubric clarification (specification, not weakening): dates are required when enumerating candidates.
    # Derived from prompts/nodes/responder_invitacion/response_contract.txt:9
    # "Si rsvp_phone_evidence.state es needs_event_selection, enumera solo los candidatos de ese estado y formula una sola pregunta."
    # Candidates are defined as {event_name, event_date}; enumeration must include dates when present, in any natural format when facts are identical.
    rubric: >-
      The guest says only “Ese” while two invitation candidates are pending: Matrimonio de Ana y Luis on 12 September 2026 and Cumpleaños de Marta on 19 September 2026. The response must not choose either event or claim that attendance was registered. It must identify the two available events with their dates in natural Spanish, in any date format when the facts are identical, and ask which one the guest means, without requesting email or an authentication code. Useful extra grounded detail passes.
    minScore: 0.9
    requireJudge: true
    turnIndex: 0
    severity: hard
  - id: continuation-answers-on-chosen-candidate
    type: text_semantic
    rubric: >-
      The guest answered the selection question with Cumpleaños de Marta on 19 September 2026. The response must continue on that chosen candidate in natural Spanish: it must never re-ask which event the guest means and never present Matrimonio de Ana y Luis facts as the selected event. It may confirm, ask for the attendance decision, or report state, but a repeated selection question fails. Useful extra grounded detail passes.
    minScore: 0.85
    requireJudge: true
    turnIndex: 1
    severity: hard
  - id: continuation-needs-no-reauth
    type: tool_usage
    mustNotCall: [auth_by_phone, request_user_login_code, verify_user_login_code]
    turnIndex: 1
    severity: hard
  - id: no-rsvp-vocabulary
    type: text_not_contains
    phrases: ["RSVP", "rsvp"]
    severity: hard
notes:
  - "E1 v4 2026-09-15, profile-inference directive: counter pin records-one-ambiguous-attempt replaced by a turn-1 continuation proof (clarification answerable, state survives, no re-ask); literal allOf date pin projection-carries-candidate-dates folded into the format-tolerant semantic rubric; turn-0 expectations scoped with turnIndex 0. Node pin kept as a documented lane-routing invariant. R05: old v3 runs preserved; baseline and candidate must rerun on this v4 contract."
  - "R05 v5 2026-09-22, evidence-preserving handoff Packet C: remains-in-rsvp-node no longer pins the internal responder_invitacion node. Old defect: a correct two-candidate clarification composed through entrevista routing failed the node pin while passing the semantic judge, grading implementation instead of behavior. New contract proves the same stay-in-selection invariant observably: zero rsvp.write effects on turn 0 from receipts (fixture_effect_count rsvp.write 0/0/0 hard, same pattern as s11 v4) together with the retained awaiting_event_selection state, the zero-guest_rsvp tool evidence, and the two-candidate semantic judge with dates. Expectation id remains-in-rsvp-node is retained for ledger and run continuity; only its type changed from node_transition to fixture_effect_count. T1 audit (2026-09-23 targeted run): the Marta lookup returns not_found and the reply truthfully reports nonverification without claiming success; that is correct effect truth, not a successful RSVP, and the fixture does not permit a verified post-write state here. Threshold and hard severity kept; no threshold reduction. Old v4 runs preserved; baseline and candidate must rerun on this v5 contract."
budget:
  maxTurns: 2
  estimatedPromptTokensPerTurn: 1600
  estimatedCompletionTokensPerTurn: 300
