template: template.base-live
id: live_behavior.rsvp_jose_campaign_invitation_not_reported_missing
suite: live_behavior_regression
version: 1
description: A campaign-grounded RSVP for Gia Antonella must not be reported as a missing invitation when the mutation endpoint has no pending response.
tags: [live, behavior, rsvp, attendance, reported-interaction, campaign-context]
targetModes: [live_lambda]
inputs:
  - text: Si confirmamos la asistencia
    channel: whatsapp
    contactPhone: "+51941438449"
    sessionId: live-rsvp-jose-campaign-session
expectations:
  - id: enters-rsvp-node
    type: node_transition
    to: responder_invitacion
    severity: hard
  - id: reads-user-level-state-without-account-auth
    type: tool_usage
    mustCall: [lookup_rsvp_invitations]
    mustNotCall: [guest_rsvp, auth_by_phone, request_user_login_code, verify_user_login_code]
    severity: hard
  - id: preserves-campaign-grounded-invitation
    type: text_semantic
    rubric: >-
      The recent campaign and the trusted-phone event lookup establish an association with Gia Antonella, but the read-only result does not include a guest record or current attendance state. Pass only if the answer stays entirely in Spanish, thanks the person for saying attendance was already confirmed, and avoids claiming that this turn changed or verified the stored RSVP state. It may offer human help to verify the stored state. It must not deny the invitation, restart onboarding, request email authentication, or invent a guest record.
    minScore: 0.9
    requireJudge: true
    severity: hard
budget:
  maxTurns: 1
  estimatedPromptTokensPerTurn: 1600
  estimatedCompletionTokensPerTurn: 300
