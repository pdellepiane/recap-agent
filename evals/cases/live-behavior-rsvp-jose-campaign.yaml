template: template.base-live
id: live_behavior.rsvp_jose_campaign_invitation_not_reported_missing
suite: live_behavior_regression
version: 9
# Evidence: event 38331 / guest 579788 has_responded=true will_attend=true -> resolved_single attending (not unavailable)
# Verified via live API GET /guest/events and GET /event?event_id=38331 with phone +51941438449 (see /tmp/evidence-T6-fix-2b.json); SE API cannot provision unavailable condition; user-approved Option B T6-fix-3
description: A campaign-grounded RSVP for Gia Antonella is resolved via hybrid fragment plus natural tissue without claiming a new mutation.
tags: [live, behavior, rsvp, attendance, reported-interaction, campaign-context]
targetModes: [live_lambda]
backendFixture:
  scenario: rsvp-jose-gia-antonella
inputs:
  - text: Si confirmamos la asistencia
    channel: whatsapp
    contactPhone: "+51941438449"
    sessionId: live-rsvp-jose-campaign-session
    backendFixture:
      scenario: rsvp-jose-gia-antonella
expectations:
  - id: enters-rsvp-node
    type: fixture_effect_count
    operation: rsvp.write
    expectedAttempts: 0
    expectedSuccesses: 0
    expectedReplays: 0
    severity: hard
  - id: reads-user-level-state-without-account-auth
    type: tool_usage
    mustCall: [lookup_rsvp_invitations]
    mustNotCall: [guest_rsvp, auth_by_phone, request_user_login_code, verify_user_login_code]
    severity: hard
  - id: preserves-campaign-grounded-invitation
    type: text_semantic
    rubric: >-
      Pass only if the assistant responds entirely in Spanish in its own natural wording, reporting that attendance for "Gia Antonella" is already confirmed. Factual requirements are attending polarity and the event name; the recorded date (15 August 2026 at 22:00, any clear rendering) supports grounding but a missing date alone never fails, while a wrong date or flipped polarity does. It must reflect that reconciled phone evidence associates this number with Gia Antonella (event 38331, guest 579788, has_responded=true, will_attend=true). The response must not claim a new mutation was made; no explicit no-write recital is required. It must not deny the invitation, must not restart onboarding, must not request email authentication or a code, must not invent guest details, and must not state the opposite polarity.
    minScore: 0.9
    requireJudge: true
    severity: hard
  - id: fragment-not-inverted
    type: text_not_contains
    phrases: ["Figura que no asistirás"]
    severity: hard
  - id: no-rsvp-vocabulary
    type: text_not_contains
    phrases: ["RSVP", "rsvp"]
    severity: hard
notes:
  - "R05 oracle revision v7 to v8, 2026-09-16, Packet E1 node-pin removal. Old enters-rsvp-node pinned the internal responder_invitacion node, prescribing implementation instead of evidencing behavior (matrix: a correct confirmed-state answer through any routing passed the read evidence but failed the node pin). New contract proves the same read-only invariant from receipts: fixture_effect_count rsvp.write 0/0/0 hard plus the retained lookup_rsvp_invitations read evidence. The rubric never claims a campaign informed the decision; it asserts only reconciled phone evidence. Threshold and hard severity kept; no threshold reduction. Old v7 runs preserved; baseline and candidate must rerun on this v8 contract. Expectation id enters-rsvp-node is retained for ledger and run continuity; only its type changed from node_transition to fixture_effect_count."
  - "R05 oracle revision v8 to v9, 2026-09-16, final support rescue tasks 4 and 5. Fixture: evals/fixtures/rsvp-jose-gia-antonella.json now supplies delivered outbound campaign evidence (recentMessages, direction outbound, source campaign, sent_at timestamp, status delivered) for the subject, with provenance in the fixture note; baseline and candidate share identical bytes. Rubric: the old contract demanded attending polarity, event name, date, and an explicit no-write recital as joint factual requirements. New contract keeps attending polarity and event name as hard requirements, treats the recorded date as supporting detail (wrong date still fails), and bans false new-mutation claims without demanding a recital. Threshold 0.9, hard severity, requireJudge kept. Old v8 runs preserved; baseline and candidate must rerun on this v9 contract."
budget:
  maxTurns: 1
  estimatedPromptTokensPerTurn: 1600
  estimatedCompletionTokensPerTurn: 300
