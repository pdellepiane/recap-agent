template: template.base-live
id: live_behavior.rsvp_jose_campaign_invitation_not_reported_missing
suite: live_behavior_regression
version: 6
# Evidence: event 38331 / guest 579788 has_responded=true will_attend=true -> resolved_single attending (not unavailable)
# Verified via live API GET /guest/events and GET /event?event_id=38331 with phone +51941438449 (see /tmp/evidence-T6-fix-2b.json); SE API cannot provision unavailable condition; user-approved Option B T6-fix-3
description: A campaign-grounded RSVP for Gia Antonella is resolved via hybrid fragment plus natural tissue without claiming a new mutation.
tags: [live, behavior, rsvp, attendance, reported-interaction, campaign-context]
targetModes: [live_lambda]
inputs:
  - text: Si confirmamos la asistencia
    channel: whatsapp
    contactPhone: "+51941438449"
    sessionId: live-rsvp-jose-campaign-session
expectations:
  - id: enters-rsvp-node
    type: node_transition
    to: responder_invitacion
    severity: hard
  - id: reads-user-level-state-without-account-auth
    type: tool_usage
    mustCall: [lookup_rsvp_invitations]
    mustNotCall: [guest_rsvp, auth_by_phone, request_user_login_code, verify_user_login_code]
    severity: hard
  - id: preserves-campaign-grounded-invitation
    type: text_semantic
    rubric: >-
      The response must contain the deterministic attending fragment elements — polarity "figura que asistirás", confirmation "ya está confirmada", no-change clause "No fue necesario hacer otro cambio" and "no se realizó un nuevo registro", event name "Gia Antonella", date "15/08/2026 22:00" (rendered via fallback for slash input), and natural Spanish conversational tissue. Element presence is required, order is not evaluated. Must be entirely in Spanish, natural, must not deny the invitation, must not restart onboarding, must not request email authentication or a code, must not invent guest details, and must not invert polarity to "Figura que no asistirás". It must reflect that reconciled phone evidence establishes this number is associated with Gia Antonella (event 38331, guest 579788, has_responded=true, will_attend=true) and projects resolved_single with rsvp_state attending.
    minScore: 0.9
    requireJudge: true
    severity: hard
  - id: fragment-attending-polarity-event-date-no-change
    type: text_contains
    allOf: ["figura que asistirás", "Gia Antonella", "15/08/2026 22:00", "No fue necesario hacer otro cambio", "no se realizó un nuevo registro", "ya está confirmada"]
    severity: hard
  - id: fragment-not-inverted
    type: text_not_contains
    phrases: ["Figura que no asistirás"]
    severity: hard
  - id: no-rsvp-vocabulary
    type: text_not_contains
    phrases: ["RSVP", "rsvp"]
    severity: hard
budget:
  maxTurns: 1
  estimatedPromptTokensPerTurn: 1600
  estimatedCompletionTokensPerTurn: 300
