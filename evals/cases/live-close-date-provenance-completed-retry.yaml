template: template.base-live
id: live_behavior.close_date_provenance_and_completed_retry
suite: live_behavior_regression
version: 4
description: Reconstruct the duplicate close failure, then repeat the confirmed request to verify that completed state prevents another provider submission.
tags:
  - live
  - feedback
  - token
  - seeded-plan
  - close
inputs:
  - text: quiero cerrar este plan
    sessionId: live-feedback-close-session
    backendFixture:
      scenario: gate-selected-provider-close
  - text: mi nombre es Carolina
    sessionId: live-feedback-close-session
    backendFixture:
      scenario: gate-selected-provider-close
  - text: mi correo es carolina@example.com
    sessionId: live-feedback-close-session
    backendFixture:
      scenario: gate-selected-provider-close
  - text: mi teléfono es 51954779071
    sessionId: live-feedback-close-session
    backendFixture:
      scenario: gate-selected-provider-close
  - text: "Mi evento es el 18 de octubre de 2026. Confirmo: envía la solicitud de cotización a Carlos Schult y cierra el plan."
    sessionId: live-feedback-close-session
    backendFixture:
      scenario: gate-selected-provider-close
  - text: "Confirma otra vez el envío de esa misma solicitud, por favor."
    sessionId: live-feedback-close-session
    backendFixture:
      scenario: gate-selected-provider-close
seedPlan:
  current_node: recomendar
  event_type: boda
  location: Lima
  guest_range: 51-100
  active_need_category: Fotografía y video
  vendor_category: Fotografía y video
  provider_needs:
    - category: Fotografía y video
      status: selected
      preferences: []
      hard_constraints: []
      missing_fields: []
      recommended_provider_ids:
        - 90
      recommended_providers:
        - id: 90
          title: Carlos Schult
          category: Fotografía y video
          location: Lima
          priceLevel: null
          reason: seleccionado
          serviceHighlights: []
          termsHighlights: []
      selected_provider_ids:
        - 90
      selected_provider_hints:
        - Carlos Schult
expectations:
  - id: selected-provider-preserved
    type: plan_field_subset
    path: provider_needs
    expected:
      - category: Fotografía y video
        selected_provider_ids:
          - 90
  - id: contact-details-alone-do-not-submit
    type: tool_usage
    turnIndex: 3
    mustNotCall:
      - finish_plan
    severity: hard
  - id: explicit-close-dispatches
    type: tool_usage
    turnIndex: 4
    mustCall:
      - finish_plan
    severity: hard
  - id: explicit-close-effect
    type: fixture_effect_count
    operation: provider.quote.write
    expectedAttempts: 1
    expectedSuccesses: 1
    expectedReplays: 0
    severity: hard
  - id: completed-retry-does-not-dispatch
    type: tool_usage
    turnIndex: 5
    mustNotCall:
      - finish_plan
    severity: hard
  - id: completed-plan-is-durable
    type: plan_field_equals
    path: lifecycle_state
    expected: finished
    severity: hard
budget:
  maxTurns: 6
  estimatedPromptTokensPerTurn: 1400
  estimatedCompletionTokensPerTurn: 400
backendFixture:
  scenario: gate-selected-provider-close
notes:
  - "Merge v2, 2026-09-30 (IMGMISC lane): live_feedback.token_seeded_close_flow is fully subsumed by this case (identical seedPlan, identical inputs turns 0-4, all 7 expectations byte-identical) and deleted without any edit to this thread. Deleted file: live-feedback-token-close-flow.yaml."
scorers:
  - id: expectation-core
    type: expectation_pass_rate
    weight: 1
