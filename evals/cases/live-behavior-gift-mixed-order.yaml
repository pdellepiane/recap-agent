template: template.base-live
id: live_behavior.gift_mixed_order_distinguishes_items
suite: live_behavior_regression
version: 1
description: A mixed order (physical sheets plus credit honeymoon contribution) is answered per item; an order-wide question distinguishes both without a whole-order no-shipping claim.
tags: [live, behavior, purchase, gift, shipping, fulfillment, mixed]
targetModes: [live_lambda]
backendFixture:
  scenario: purchase-gift-mixed
inputs:
  - text: Compré dos regalos para la boda. ¿Cuándo llegan?
    channel: whatsapp
    contactPhone: "+51999350213"
    sessionId: live-gift-mixed
    backendFixture:
      scenario: purchase-gift-mixed
  - text: ¿Y el aporte para la luna de miel?
    channel: whatsapp
    contactPhone: "+51999350213"
    sessionId: live-gift-mixed
    backendFixture:
      scenario: purchase-gift-mixed
expectations:
  - id: mixed-uses-gift-reads
    type: tool_usage
    mustCall: [lookup_guest_gift_purchases_by_phone]
    mustNotCall: [auth_by_phone, request_user_login_code, verify_user_login_code, guest_rsvp]
    turnIndex: 0
    severity: hard
  - id: mixed-followup-uses-gift-read
    type: tool_usage
    mustCall: [lookup_guest_gift_purchases_by_phone]
    mustNotCall: [auth_by_phone, request_user_login_code, verify_user_login_code, guest_rsvp]
    turnIndex: 1
    severity: hard
  - id: mixed-no-unsolicited-effects
    type: fixture_effect_count
    operation: handoff.write
    expectedAttempts: 0
    expectedSuccesses: 0
    expectedReplays: 0
    severity: hard
  - id: mixed-order-wide-distinguishes
    type: text_semantic
    rubric: >-
      The phone-scoped gift lookup returns one order with two items: physical sheets (Juego de sábanas) and a credit honeymoon contribution. The order-wide answer must be natural and entirely in Spanish, discuss the two items separately, keep the sheets as a physical gift with no recorded shipment detail, and state that the honeymoon contribution carries no gift shipment because the hosts chose account credit. It must not claim the whole order ships, nor that nothing ships; must not invent dispatch or delivery dates; and must not merge the two items into one fulfillment story.
    minScore: 0.9
    requireJudge: true
    turnIndex: 0
    severity: hard
  - id: mixed-item-followup-answers-that-item
    type: text_semantic
    rubric: >-
      Asked specifically about the honeymoon contribution, the answer must be natural and entirely in Spanish and address that item: a credit gift with no gift shipment because the hosts chose account credit. It must not answer about the sheets instead, must not state or imply a dispatch or delivery, and must not claim any payment already posted beyond the record.
    minScore: 0.9
    requireJudge: true
    turnIndex: 1
    severity: hard
budget:
  maxTurns: 2
  estimatedPromptTokensPerTurn: 1800
  estimatedCompletionTokensPerTurn: 300
