template: template.base-live
id: live_behavior.gift_mixed_order_distinguishes_items
suite: live_behavior_regression
version: 6
description: A mixed order (150 physical sheets plus 80 credit honeymoon contribution) is answered per item across turns; an order-wide question distinguishes both without a whole-order no-shipping claim, and requested known amounts are reported exactly.
tags: [ live, behavior, purchase, gift, shipping, fulfillment, mixed ]
targetModes: [ live_lambda ]
backendFixture:
  scenario: purchase-gift-mixed
inputs:
  - text: Compré dos regalos para la boda. ¿Cuándo llegan?
    channel: whatsapp
    contactPhone: "+51999350213"
    sessionId: live-gift-mixed
    backendFixture:
      scenario: purchase-gift-mixed
  - text: ¿Y el regalo de 80, cómo llega?
    channel: whatsapp
    contactPhone: "+51999350213"
    sessionId: live-gift-mixed
    backendFixture:
      scenario: purchase-gift-mixed
  - text: ¿Cuánto costaron las sábanas y cuántas compré?
    channel: whatsapp
    contactPhone: "+51999350213"
    sessionId: live-gift-mixed
    backendFixture:
      scenario: purchase-gift-mixed
expectations:
  - id: mixed-uses-gift-reads
    type: tool_usage
    mustCall: []
    mustNotCall:
      - auth_by_phone
      - request_user_login_code
      - verify_user_login_code
    turnIndex: 0
    severity: hard
  - id: mixed-gift-evidence-in-trace
    type: trace_field_subset
    path: information_execution_summary
    expected:
      - kind: purchase
        status: completed
        outcomeCode: completed_with_results
        evidence:
          - purchaseFact:
              eventLabel: Boda Lucía y Marco
              items:
                - name: Juego de sábanas
                  quantity: 1
                  amount: 150
                  rowTotal: 150
                - name: Aporte luna de miel
                  quantity: 1
                  amount: 80
                  rowTotal: 80
    turnIndex: 0
    severity: hard
  - id: mixed-no-unsolicited-effects
    type: fixture_effect_count
    operation: handoff.write
    expectedAttempts: 0
    expectedSuccesses: 0
    expectedReplays: 0
    severity: hard
  - id: mixed-no-rsvp-writes
    type: fixture_effect_count
    operation: rsvp.write
    expectedAttempts: 0
    expectedSuccesses: 0
    expectedReplays: 0
    severity: hard
  - id: mixed-t1-gift-evidence-in-trace
    type: trace_field_subset
    path: information_execution_summary
    expected:
      - kind: purchase
        status: completed
        outcomeCode: completed_with_results
        evidence:
          - purchaseFact:
              eventLabel: Boda Lucía y Marco
              items:
                - name: Aporte luna de miel
                  quantity: 1
                  amount: 80
                  rowTotal: 80
    turnIndex: 1
    severity: hard
  - id: requested-sheet-amount-delivered
    type: text_contains
    regex:
      - (?:^|[^0-9])150(?:[.,]00)?(?:[^0-9]|$)
    turnIndex: 2
    severity: hard
notes:
  - "R05 oracle revision v1 to v2, 2026-09-21, gift/campaign review corrections 1+3. Fixture v2 carries preserved amounts (sheets 1/150/150, honeymoon 1/80/80, total 230, currency null) instead of the v1 values. T1 replaced with an amount-anchored follow-up and T2 appended to prove requested known amounts across turns; the follow-up gift-read pin was removed because either reuse of established authorized evidence or a fresh authorized read is valid. Rubrics now require natural Spanish with no internal-code citations and forbid substituting related amounts. Threshold and hard severity kept. Old v1 runs preserved; baseline and candidate must rerun on this v2 contract."
  - "R05 oracle revision v2 to v3, 2026-09-22, extractor-context-completion package section C: T0/T1 must find the authorized gift records with no user-provided backend ID. Positive proof is now source/resource evidence (hard trace_field_subset on information_execution_summary asserting the completed purchase evidence with the Boda Lucía y Marco purchaseFact and the recorded 150/80 items), never an exclusive tool-name pin: the T0 mustCall list is empty (auth/RSVP safety pins kept) so a generic tool label alone is insufficient to pass, and a wrong-partition read yields no such evidence. Hard text_not_contains pins forbid order-number requests on T0/T1. Subsets deliberately pin no resource value pending the Lane A/B trace-contract fix for purchase_discovery summaries. Threshold and hard severity kept. Positive/negative calibration examples live in the Lane C review report only; they do not prove live judge consistency."
  - "C1 oracle revision v3 to v4, 2026-09-22, final work package. Old mixed-gift-evidence-in-trace demanded paymentStatus approved from the T0 shipping-question projection; the frozen run-54da3f5a T0 trace carries the authorized gift evidence (Boda Lucía y Marco, recorded 150/80 items, gift_purchases complete coverage) with paymentStatus null, so the pin graded projection shape instead of the requested shipping distinction. New contract drops only the paymentStatus demand; event label, both recorded items, hard severity, and the T0 semantic no-implied-dispatch judge are kept. Old v3 runs preserved; baseline and candidate must rerun on this v4 contract."
budget:
  maxTurns: 3
  estimatedPromptTokensPerTurn: 1800
  estimatedCompletionTokensPerTurn: 300
scorers:
  - id: expectation-core
    type: expectation_pass_rate
    weight: 1
