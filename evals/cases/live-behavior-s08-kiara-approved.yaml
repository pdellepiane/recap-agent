template: template.base-live
id: live_behavior.s08_kiara_approved_replay
suite: live_behavior_regression
version: 5
description: S08 frozen-world replay. Synthetic identity asks for the Suki Sofia gift status against the frozen Kiara approved world; the recorded 149.9 total and event label are grounded. A balance-unknown disclaimer is relevance, never a pending claim.
tags: [live, behavior, purchase, phone-orders, s08, frozen-world]
targetModes: [live_lambda]
backendFixture:
  scenario: purchase-kiara-approved-frozen
inputs:
  - text: Hice la compra para Suki Sofia pero no me llego confirmacion. Cual es el estado?
    channel: whatsapp
    contactPhone: "+51900027635"
    sessionId: live-s08-frozen-kiara-approved-session
    backendFixture:
      scenario: purchase-kiara-approved-frozen
notes:
  - S08 frozen approved world purchase-kiara-approved-frozen as of 2026-09-05T01:33:57.291Z. Synthetic identity only; approved in completed_orders, no pending orders or carts.
  - "R05 oracle revision v1 to v2, 2026-09-12, Packet F3. Old s08-approved-status-is-reported let the judge call the stated 149.9 unsupported although the stored input carries it with approved status and the event label (matrix: keep requested disclosure relevance but do not erase grounded facts). New contract names the total and label grounded. Old v1 runs preserved; baseline and candidate must rerun on this v2 contract."
  - "R05 oracle revision v2 to v3, 2026-09-14, Packet EX1. Old s08-approved-status-is-reported let the judge demand one fixed approved phrasing (matrix: wording literalism fails natural paraphrases of one approval). New contract judges behavior only: approval stated once, in the model's own wording without any fixed required phrase. Old v2 runs preserved; baseline and candidate must rerun on this v3 contract."
  - "R05 oracle revision v3 to v4, 2026-09-14, Packet A. No behavior change to the approved-once contract; adds the operator-clarified ban on customer-facing image or URL requests to the must-not list (URLs arrive from the backend only) and records that repetition alone is quality, not failure, unless it changes meaning or repeats an action. Old v3 runs preserved; baseline and candidate must rerun on this v4 contract."
  - "R05 oracle revision v4 to v5, 2026-09-15, recheck-b9a7662d. Old s08-approved-status-is-reported let the judge treat an unsolicited cannot-confirm-balance disclaimer as an affirmative pending-balance claim (recheck: unsolicited uncertainty, not an affirmative claim that the purchase is pending; judge overstates contradiction). New contract distinguishes a balance-unknown disclaimer, scored as relevance and concision only, from a false pending-balance assertion or stated balance amount, which still fails grounding with hard severity. Keeps the mandatory semantic judge, the approved-once behavior check, and the rejection of fabricated balance, status, and currency. Old v4 runs preserved; baseline and candidate must rerun on this v5 contract."
expectations:
  - id: s08-approved-enters-information
    type: node_transition
    to: resolver_consultas_informativas
    severity: hard
  - id: s08-approved-uses-order-summary-only
    type: tool_usage
    mustCall: [lookup_guest_orders_by_phone]
    mustNotCall: [lookup_guest_gift_purchases_by_phone, auth_by_phone, request_user_login_code, verify_user_login_code]
    severity: hard
  - id: s08-approved-status-is-reported
    type: text_semantic
    rubric: >-
      The frozen phone-scoped world contains one approved order for Suki Sofia with recorded total 149.9, event date 2026-09-20, and no pending orders or carts. Stating the recorded total 149.9 and the Suki Sofia event label is grounded fixture fact, never an unsupported amount. The answer must be concise, natural, and entirely in Spanish; state once that the payment or gift is approved, in the model's own wording without any fixed required phrase: judge that approval was stated once (behavior), never exact phrasing; without calling it pending, failed, or under verification. An unsolicited disclaimer that a remaining balance cannot be confirmed is a relevance and concision weakness, never a fabricated pending status or balance amount: only an affirmative claim that the order is pending, failed, or under verification, or a stated balance amount or currency the backend did not supply, fails grounding. It must not ask for email, an OTP, another registration, a screenshot, an image, or a URL, must not present a currency the backend did not supply, and must not reference the pending world or mutable backend data.
    minScore: 0.9
    requireJudge: true
    severity: hard
budget:
  maxTurns: 1
  estimatedPromptTokensPerTurn: 1500
  estimatedCompletionTokensPerTurn: 240
