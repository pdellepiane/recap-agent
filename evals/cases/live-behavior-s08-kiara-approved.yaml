template: template.base-live
id: live_behavior.s08_kiara_approved_replay
suite: live_behavior_regression
version: 1
description: S08 frozen-world replay. Synthetic identity asks for the Suki Sofia gift status against the frozen Kiara approved world. Output must follow frozen approved facts, never the pending world or mutable backend data.
tags: [live, behavior, purchase, phone-orders, s08, frozen-world]
targetModes: [live_lambda]
backendFixture:
  scenario: purchase-kiara-approved-frozen
inputs:
  - text: Hice la compra para Suki Sofia pero no me llego confirmacion. Cual es el estado?
    channel: whatsapp
    contactPhone: "+51900027635"
    sessionId: live-s08-frozen-kiara-approved-session
notes:
  - S08 frozen approved world purchase-kiara-approved-frozen as of 2026-09-05T01:33:57.291Z. Synthetic identity only; approved in completed_orders, no pending orders or carts.
expectations:
  - id: s08-approved-enters-information
    type: node_transition
    to: resolver_consultas_informativas
    severity: hard
  - id: s08-approved-uses-order-summary-only
    type: tool_usage
    mustCall: [lookup_guest_orders_by_phone]
    mustNotCall: [lookup_guest_gift_purchases_by_phone, auth_by_phone, request_user_login_code, verify_user_login_code]
    severity: hard
  - id: s08-approved-status-is-reported
    type: text_semantic
    rubric: >-
      The frozen phone-scoped world contains one approved order for Suki Sofia and no pending orders or carts. The answer must be concise, natural, and entirely in Spanish; state that the payment or gift is approved, without calling it pending, failed, or under verification. It must not ask for email, an OTP, another registration, or a screenshot, and must not reference the pending world or mutable backend data.
    minScore: 0.9
    requireJudge: true
    severity: hard
budget:
  maxTurns: 1
  estimatedPromptTokensPerTurn: 1500
  estimatedCompletionTokensPerTurn: 240
