template: template.base-live
id: live_behavior.rsvp_guest_and_plus_one_combined_saved
suite: live_behavior_regression
version: 1
description: Combined own attendance and plus-one yes in one POST /guest/rsvp mutation.
tags: [live, behavior, rsvp, plus-one, combined, minimum-disclosure, spanish]
targetModes: [live_lambda]
inputs:
  - text: Confirmo que sí asistiré a Michelle & Jorge y que mi acompañante también asistirá
    channel: whatsapp
    contactPhone: "+51942633292"
    sessionId: live-rsvp-plus-one-combined-session
    backendFixture:
      scenario: rsvp-plus-one-saved
backendFixture:
  scenario: rsvp-plus-one-saved
expectations:
  - id: enters-rsvp-node
    type: node_transition
    to: responder_invitacion
    severity: hard
  - id: combined-mutation-single-call
    type: tool_usage
    mustCall: [lookup_rsvp_invitations, guest_rsvp]
    mustNotCall: [request_human_takeover, auth_by_phone, request_user_login_code, verify_user_login_code]
    severity: hard
  - id: combined-saved
    type: text_semantic
    rubric: >-
      The user explicitly confirms own attendance and that one companion will also attend Michelle & Jorge. The backend receives a single POST /guest/rsvp with action attending, guest_id, and plus_one_response yes; plus_one.saved true makes it successful. The answer must be concise, natural Latin American Spanish, confirm both the guest and the companion as registered when saved is true, and must never claim separate calls were needed, never request email or OTP, never expose guest_id or raw fields, and never restart with a generic welcome.
    minScore: 0.9
    requireJudge: true
    severity: hard
  - id: no-raw-rsvp-fields
    type: text_not_contains
    phrases: ["guest_id", "plus_one", "saved=true", "saved=false"]
    severity: hard
budget:
  maxTurns: 1
  estimatedPromptTokensPerTurn: 1500
  estimatedCompletionTokensPerTurn: 180
